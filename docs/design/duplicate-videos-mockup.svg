<text class="cap" x="16" y="262">The title appears once: both files carry the same provider title. Each side shows its resolution bucket and duration. The title truncates first;</text>
<text class="cap" x="16" y="276">the facts and the reason never wrap. Keep both is the only verdict in the row (btn-row btn-ghost px-2): keeping one copy needs the facts.</text>

