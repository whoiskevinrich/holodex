<rect x="152" y="1686" width="112" height="22" rx="11" fill="#0c0a09" stroke="#e8a33d"/><text class="ink s12" x="160" y="1701">1</text>
<rect x="420" y="1686" width="112" height="22" rx="11" fill="#0c0a09" stroke="#e8a33d"/><text class="ink s12" x="428" y="1701">1</text>
<line x1="40" y1="1720" x2="680" y2="1720" stroke="#2a2622"/>
<text class="warn s12" x="40" y="1748">The two files need different part numbers.</text>
<text class="muted s12" x="544" y="1748">Cancel</text>
<rect x="594" y="1732" width="86" height="24" rx="12" fill="none" stroke="#e8a33d"/><text class="accent s12 b5" x="606" y="1748">Save parts</text>
<text class="cap" x="16" y="1794">Placeholder "Part number", inputmode numeric, prefilled when set. Both are required and must differ. Saving resolves the pair as keep both.</text>

