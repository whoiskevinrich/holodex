<rect x="28" y="1412" width="664" height="126" fill="#181310" stroke="#2a2622"/>
<text class="muted s12" x="48" y="1440">File</text><text class="ink s14" x="152" y="1441">Harbor Lights (2019) 2160p.mkv</text><text class="ink s14" x="420" y="1441">harbor_lights_1080p_alt_sour…</text>
<line x1="40" y1="1452" x2="680" y2="1452" stroke="#2a2622"/>
<text class="muted s12" x="48" y="1474">Edition</text>
<rect x="152" y="1460" width="160" height="22" rx="11" fill="#0c0a09" stroke="#e8a33d"/><text class="ink s12" x="160" y="1475">Director's Cut</text>
<rect x="420" y="1460" width="160" height="22" rx="11" fill="#0c0a09" stroke="#e8a33d"/><text class="muted s12" x="428" y="1475">Edition</text>
<line x1="40" y1="1494" x2="680" y2="1494" stroke="#2a2622"/>
<text class="warn s12" x="40" y="1522">Give at least one file an edition.</text>
<text class="muted s12" x="530" y="1522">Cancel</text>
<rect x="580" y="1506" width="100" height="24" rx="12" fill="none" stroke="#e8a33d"/><text class="accent s12 b5" x="592" y="1522">Save editions</text>
<text class="cap" x="16" y="1568">Prefilled with each file's current edition. One label is enough ("Director's Cut" against an unlabeled original). Enter in either input saves;</text>
<text class="cap" x="16" y="1582">Escape or Cancel restores the panel. Saving sets both and resolves the pair as keep both. The action is hidden when edition isn't settable.</text>

<!-- 5 · parts -->
<text class="ttl" x="16" y="1616">5 · Label as parts… — numeric part inputs; the two must differ</text>
<rect x="16" y="1626" width="688" height="150" rx="2" fill="#0c0a09"/>
<rect x="28" y="1638" width="664" height="126" fill="#181310" stroke="#2a2622"/>
