<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2070" width="720" height="2070" role="img" aria-labelledby="t d">
<title id="t">Duplicate videos (F76) — Videos group, fact-table compare panel, keep-one confirm, edition and part labeling, mobile</title>
<desc id="d">Seven panels in the Cinémathèque skin. 1: the Videos group on the owner Duplicates page, collapsed, three pair rows each showing the shared title once, a resolution and duration summary per side, "same provider match" and a Keep both button. 2: an expanded pair as one fact table with two posters on top and a column per file: File, Folder, Resolution, Duration, File size, Video codec, Bitrate, Container, Your work, then a Keep this one button and an Open link per column; the footer has Label as editions, Label as parts and Keep both. 3: the Move the other copy to Trash confirm dialog listing what moves to the kept copy. 4: label-as-editions editing state with edition inputs in an Edition row and a validation error. 5: label-as-parts editing state with an error for equal part numbers. 6: the expanded table at 375 px, still side by side. 7: the panel's loading and load-failure states.</desc>
