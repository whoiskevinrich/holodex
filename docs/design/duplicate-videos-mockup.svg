<text class="muted s12" x="615" y="882">Keep both</text>
<text class="cap" x="16" y="938">A fact row appears when either side has a value; a side without one leaves its cell blank, so rows never shift. Labels and formats are</text>
<text class="cap" x="16" y="952">the media page File section's (formatDuration, formatBytes, formatBitrate, resolutionBucket). Edition and Part rows appear only when set.</text>
<text class="cap" x="16" y="966">No "better" marker (spec P1-3). Open ↗ opens the media page in a new tab, so the queue keeps its place.</text>

<!-- 3 · confirm -->
<text class="ttl" x="16" y="1000">3 · Keep this one → confirm (the existing ConfirmDialog; here keeping the FHD copy)</text>
<rect x="16" y="1010" width="688" height="300" rx="2" fill="#0c0a09"/>
<rect x="136" y="1030" width="448" height="262" rx="2" fill="#15110e" stroke="#2a2622"/>
<text class="serif ink s18 b6" x="152" y="1060">Move the other copy to Trash?</text>
<text class="ink s14" x="152" y="1088"><tspan class="b6">Harbor Lights (2019) 2160p.mkv</tspan> (4K) will be hidden from</text>
<text class="ink s14" x="152" y="1108">your library and permanently deleted in 30 days. You can</text>
<text class="ink s14" x="152" y="1128">restore it from Trash until then.</text>
<text class="ink s14" x="152" y="1156">Moving to the copy you keep:</text>
<text class="muted s14" x="164" y="1176">2 playlist places</text>
<text class="muted s14" x="164" y="1196">Film link — Harbor Lights (2019), scene 3</text>
<text class="muted s14" x="164" y="1216">3 field edits</text>
<circle cx="157" cy="1171" r="1.5" fill="#9b9082"/><circle cx="157" cy="1191" r="1.5" fill="#9b9082"/><circle cx="157" cy="1211" r="1.5" fill="#9b9082"/>
<rect x="376" y="1244" width="70" height="32" rx="2" fill="none" stroke="#2a2622"/><text class="ink s14" x="389" y="1265">Cancel</text>
<rect x="454" y="1244" width="114" height="32" rx="2" fill="#e2603f"/><text class="wink s14 b6" x="466" y="1265">Move to Trash</text>
<text class="cap" x="16" y="1328">Names the copy going to Trash by file name and resolution (the titles are identical). The list holds only what will actually move: an edit the</text>
<text class="cap" x="16" y="1342">kept copy already has stays its own and isn't counted. Nothing to move → the list becomes "It carries no playlists, film link or edits of its own."</text>
<text class="cap" x="16" y="1356">Move to Trash → "Working…" while busy; a failure shows under the buttons and nothing changes (spec P0-5).</text>

<!-- 4 · editions -->
<text class="ttl" x="16" y="1390">4 · Label as editions… — the Edition row becomes the media page's edition input</text>
