<svg width="900" height="470" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Provider link badge — media header pill derived from the provider match (HOLODEX-424)</title>
<desc>Three panels, one per skin, each showing the media detail header meta row five ways: today (a TMDB-matched video with no file tag renders no pill), after (the match yields a TMDB pill after the year), match plus file tag (two pills, IMDb then TMDB, deduped by namespace and sorted by label), the hover/focus state (accent border, ink text), and the degraded state (a namespace with no template renders label-only). Below: the derivation — resolved external_provider_id and the match id stamped on the video's enrichment rows are merged, deduped by namespace, and sorted.</desc>
<rect width="900" height="470" fill="#f4f2ee"/>

<text x="24" y="28" font-size="11" letter-spacing="1" fill="#8a8478">MEDIA HEADER META ROW — DD6: THE PROVIDER MATCH IS A PILL TOO (HOLODEX-424)</text>

