<text x="744" y="412" font-size="9" fill="#8a8478">rule as EntityVideoMeta</text>

<text x="350" y="446" font-size="9" fill="#8a8478">Extraction rows carry ExternalID "" and are skipped. No identity row is written for a video (RD4 still holds).</text>
