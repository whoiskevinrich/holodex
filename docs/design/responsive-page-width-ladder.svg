<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="ladder-title ladder-desc">
<title id="ladder-title">Option C across the device gamut, 412px to 5120px</title>
<desc id="ladder-desc">The chosen player-column-plus-metadata-rail layout drawn at five viewport widths. At 412 pixels on a Pixel 7 Pro everything stacks in one column in reading order: player, title, tags, films, metadata. At 768 pixels the tags and films cards pair up side by side and the metadata field grid goes to two columns. At 1280 pixels the rail first appears beside the player. At 1920 pixels the player stops growing and the rail widens, with metadata at two columns. At 5120 pixels the whole stage caps at roughly 2600 pixels and centres, leaving deliberate gutters, while the metadata grid fans out to three columns. Frames are schematic and not drawn to a common scale.</desc>
<rect width="1000" height="1030" fill="#0c0a09"/>

<text x="20" y="30" fill="#f3ece1" font-size="15">Option C across the gamut — 412px to 5120px (default skin)</text>
<text x="20" y="52" fill="#9b9082" font-size="11">Rail appears at 1024px and above. Below that everything stacks in reading order. Frames are schematic, not to a common scale.</text>

