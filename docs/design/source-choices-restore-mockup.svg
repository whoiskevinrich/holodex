<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Archivo, 'Archivo Variable', sans-serif">
  <!-- HOLODEX-69 + HOLODEX-138, owner pick 2026-10-25: option A (inline disclosure) for Removed (N),
       and the folded source chip as drawn. Cinémathèque tokens: bg #0c0a09, surface #15110e,
       surface-2 #181310, rule #2a2622, ink #f3ece1, muted #9b9082, accent #e8a33d.
       Text widths measured with Archivo 12px / 10.4px in a browser. Chips are 24px tall
       (min-h-6), px-2 plus a 1px border = 9px each side, gap-1.5 (6px) between chips.
       Fields are Director and a video title, both file-tag baselines; the provider is the
       generic "provider-1" (docs/reference/doc-types.md, "Examples"). -->
  <rect width="960" height="470" fill="#0c0a09"/>

  <!-- ===== Left: Removed (N), option A ===== -->
  <text x="20" y="30" fill="#e8a33d" font-size="14" font-weight="500">Removed (N): inline disclosure</text>
  <line x1="470" y1="14" x2="470" y2="214" stroke="#2a2622"/>

  <g font-size="12">
    <!-- at rest -->
    <text x="20" y="72" fill="#9b9082">Director</text>
    <text x="20" y="86" fill="#9b9082" font-size="10">closed</text>
    <rect x="90" y="56" width="62.7" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="99" y="72" fill="#f3ece1">Rui Dias</text>
    <rect x="158.7" y="56" width="73.9" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="167.7" y="72" fill="#f3ece1">Mara Voss</text>
    <rect x="238.6" y="56" width="55.8" height="24" rx="12" fill="none" stroke="#2a2622"/>
    <path d="M253.6 62v12M247.6 68h12" stroke="#9b9082" stroke-width="1.5" stroke-linecap="round"/><text x="263.6" y="72" fill="#9b9082">Add</text>
    <text x="304.4" y="72" fill="#9b9082">Removed (2)</text>
    <path d="M378.9 66l4 4 4-4" fill="none" stroke="#9b9082" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- open -->
    <text x="20" y="128" fill="#9b9082">Director</text>
    <text x="20" y="142" fill="#9b9082" font-size="10">open</text>
    <rect x="90" y="112" width="62.7" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="99" y="128" fill="#f3ece1">Rui Dias</text>
    <rect x="158.7" y="112" width="73.9" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="167.7" y="128" fill="#f3ece1">Mara Voss</text>
    <rect x="238.6" y="112" width="55.8" height="24" rx="12" fill="none" stroke="#2a2622"/>
    <path d="M253.6 118v12M247.6 124h12" stroke="#9b9082" stroke-width="1.5" stroke-linecap="round"/><text x="263.6" y="128" fill="#9b9082">Add</text>
    <text x="304.4" y="128" fill="#f3ece1">Removed (2)</text>
    <path d="M378.9 126l4-4 4 4" fill="none" stroke="#f3ece1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- removed values: their own line, dashed status chips, muted, each with Restore -->
    <rect x="90" y="142" width="94.9" height="24" rx="12" fill="none" stroke="#2a2622" stroke-dasharray="3 2"/>
    <text x="99" y="158" fill="#9b9082">Ana Keßler</text>
    <path d="M169.9 151.5l-2.5 2.5 2.5 2.5M167.4 154h5.6a3 3 0 010 6h-1.5" fill="none" stroke="#9b9082" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="190.9" y="142" width="156.4" height="24" rx="12" fill="none" stroke="#2a2622" stroke-dasharray="3 2"/>
    <text x="199.9" y="158" fill="#9b9082">Lena Ortiz</text><text x="258.4" y="158" fill="#9b9082" font-size="10.4">·not sent now</text>
    <path d="M332.3 151.5l-2.5 2.5 2.5 2.5M329.8 154h5.6a3 3 0 010 6h-1.5" fill="none" stroke="#9b9082" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-size="11" fill="#9b9082">
    <text x="20" y="192">At rest, one quiet control follows + Add. Open, the removed values take their own line:</text>
    <text x="20" y="207">dashed (not in effect), muted, each with a Restore icon. No control when nothing is removed.</text>
  </g>

  <!-- ===== Right: folded chip (F36 P1-6) ===== -->
  <text x="490" y="30" fill="#e8a33d" font-size="14" font-weight="500">Folded chip: same look, a wider match</text>
  <g font-size="12">
    <text x="490" y="72" fill="#9b9082">Title</text>
    <text x="490" y="86" fill="#9b9082" font-size="10">today</text>
    <rect x="540" y="56" width="135.6" height="24" rx="12" fill="#181310" stroke="#e8a33d"/>
    <circle cx="553" cy="68" r="4" fill="#e8a33d"/>
    <text x="563" y="72" fill="#f3ece1">The Long Night</text><text x="649.8" y="72" fill="#9b9082" font-size="10.4">·file</text>
    <rect x="681.6" y="56" width="163.2" height="24" rx="12" fill="#181310" stroke="#2a2622"/>
    <circle cx="694.6" cy="68" r="3.5" fill="none" stroke="#9b9082"/>
    <text x="704.6" y="72" fill="#9b9082">the long night.</text><text x="785.3" y="72" fill="#e8a33d" font-size="10.4">·provider-1</text>
    <rect x="850.8" y="56" width="74.3" height="24" rx="12" fill="#181310" stroke="#2a2622"/>
    <circle cx="863.8" cy="68" r="3.5" fill="none" stroke="#9b9082"/><text x="873.8" y="72" fill="#9b9082">Custom</text>

    <text x="490" y="128" fill="#9b9082">Title</text>
    <text x="490" y="142" fill="#9b9082" font-size="10">after</text>
    <rect x="540" y="112" width="193.5" height="24" rx="12" fill="#181310" stroke="#e8a33d"/>
    <circle cx="553" cy="124" r="4" fill="#e8a33d"/>
    <text x="563" y="128" fill="#f3ece1">The Long Night</text><text x="649.8" y="128" fill="#e8a33d" font-size="10.4">·file + provider-1</text>
    <rect x="739.5" y="112" width="74.3" height="24" rx="12" fill="#181310" stroke="#2a2622"/>
    <circle cx="752.5" cy="124" r="3.5" fill="none" stroke="#9b9082"/><text x="762.5" y="128" fill="#9b9082">Custom</text>
  </g>
  <g font-size="11" fill="#9b9082">
    <text x="490" y="192">Values that differ only in case, spacing or punctuation are one choice.</text>
    <text x="490" y="207">It shows the baseline's spelling and names every source it stands for.</text>
  </g>

  <!-- ===== Bottom: the bio modal (SourceRadioList rows) ===== -->
  <line x1="20" y1="230" x2="940" y2="230" stroke="#2a2622"/>
  <text x="20" y="258" fill="#f3ece1" font-size="14" font-weight="500">Edit Bio, today</text>
  <text x="490" y="258" fill="#e8a33d" font-size="14" font-weight="500">Edit Bio, after</text>

  <g font-size="14">
    <rect x="20" y="272" width="440" height="56" rx="2" fill="#e8a33d" fill-opacity="0.1" stroke="#e8a33d"/>
    <circle cx="36" cy="290" r="5" fill="none" stroke="#e8a33d"/><circle cx="36" cy="290" r="2.5" fill="#e8a33d"/>
    <text x="48" y="294" fill="#e8a33d" font-size="12" letter-spacing="0.3">RECORD</text>
    <text x="48" y="316" fill="#f3ece1">Lisbon-born director of quiet, long-take dramas.</text>
    <rect x="20" y="336" width="440" height="56" rx="2" fill="none" stroke="#2a2622"/>
    <circle cx="36" cy="354" r="5" fill="none" stroke="#9b9082"/>
    <text x="48" y="358" fill="#9b9082" font-size="12" letter-spacing="0.3">PROVIDER-1</text>
    <text x="48" y="380" fill="#f3ece1">Lisbon-born  director of quiet, long-take dramas</text>
    <rect x="20" y="400" width="440" height="34" rx="2" fill="none" stroke="#2a2622"/>
    <circle cx="36" cy="417" r="5" fill="none" stroke="#9b9082"/>
    <text x="48" y="421" fill="#9b9082" font-size="12" letter-spacing="0.3">CUSTOM</text>

    <rect x="490" y="272" width="440" height="56" rx="2" fill="#e8a33d" fill-opacity="0.1" stroke="#e8a33d"/>
    <circle cx="506" cy="290" r="5" fill="none" stroke="#e8a33d"/><circle cx="506" cy="290" r="2.5" fill="#e8a33d"/>
    <text x="518" y="294" fill="#e8a33d" font-size="12" letter-spacing="0.3">RECORD + PROVIDER-1</text>
    <text x="518" y="316" fill="#f3ece1">Lisbon-born director of quiet, long-take dramas.</text>
    <rect x="490" y="336" width="440" height="34" rx="2" fill="none" stroke="#2a2622"/>
    <circle cx="506" cy="353" r="5" fill="none" stroke="#9b9082"/>
    <text x="518" y="357" fill="#9b9082" font-size="12" letter-spacing="0.3">CUSTOM</text>
  </g>
  <g font-size="11" fill="#9b9082">
    <text x="20" y="456">A doubled space and a missing full stop made two rows the owner had to read side by side.</text>
    <text x="490" y="456">One row; the Custom textarea is cropped here.</text>
  </g>
</svg>
