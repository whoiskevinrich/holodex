<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1342" width="720" height="1342" role="img" aria-labelledby="t d">
<title id="t">File names (F86): the File name row in the video page's Maintenance section</title>
<desc id="d">Owner-only states of the File name row: up to date with Lock name; out of date with the new name, Rename and Lock name; renaming; renamed with Undo rename and History; history open; locked after a hand edit with Unlock; blocked by a held original; refused because the name would not read back; undo refused because the old name is taken; a failed rename with Retry and Dismiss.</desc>
<style>
text{font-family:"Archivo",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.serif{font-family:"Fraunces",Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-weight:400}
.ttl{font-size:12px;font-weight:600;fill:#2c2c2a}
.cap{font-size:11px;fill:#5f5e5a}
</style>
<rect width="720" height="1342" fill="#ffffff"/>
<text class="ttl" x="16" y="22">1 · Up to date</text>
<text class="cap" x="16" y="37">The row sits in Maintenance under the Flip and Re-encode rows.</text>
<rect x="16" y="48" width="688" height="64" rx="2" fill="#0c0a09"/>
<text x="40" y="68" font-size="12" fill="#9b9082" letter-spacing="0.6">MAINTENANCE</text>
<text x="40" y="90" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="90" class="mono" font-size="13" fill="#f3ece1">[Acme] Ada Lovelace (2023).mkv</text>
<rect x="591" y="83.5" width="9" height="6.5" rx="1" fill="none" stroke="#9b9082" stroke-width="1.3"/>
<path d="M593.02 83.5v-1.8a2.5 2.5 0 0 1 5 0v1.8" fill="none" stroke="#9b9082" stroke-width="1.3"/>
<text x="607.5" y="89.9" font-size="14" fill="#9b9082">Lock name</text>
<text x="152" y="108" font-size="12" fill="#9b9082">Matches template 1.</text>
<text class="ttl" x="16" y="146">2 · Out of date (Manual and above)</text>
<text class="cap" x="16" y="161">Plan mode shows the same lines without Rename.</text>
<rect x="16" y="172" width="688" height="108" rx="2" fill="#0c0a09"/>
<text x="40" y="200" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="200" class="mono" font-size="13" fill="#f3ece1">[Acme] Nothern Lights (2019).mkv</text>
<text x="152" y="220" font-size="12" fill="#9b9082">Would be </text>
<text x="203.8" y="220" class="mono" font-size="12" fill="#f3ece1">[Acme] Northern Lights (2019).mkv</text>
<text x="152" y="238" font-size="12" fill="#9b9082">Title changed since Holodex named it.</text>
<rect x="152" y="248" width="64.3" height="30" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="164" y="267.9" font-size="14" fill="#f3ece1">Rename</text>
<rect x="237.8" y="261.5" width="9" height="6.5" rx="1" fill="none" stroke="#9b9082" stroke-width="1.3"/>
<path d="M239.82 261.5v-1.8a2.5 2.5 0 0 1 5 0v1.8" fill="none" stroke="#9b9082" stroke-width="1.3"/>
<text x="254.3" y="267.9" font-size="14" fill="#9b9082">Lock name</text>
<text class="ttl" x="16" y="314">3 · Renaming</text>
<rect x="16" y="326" width="688" height="58" rx="2" fill="#0c0a09"/>
<text x="40" y="354" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="354" class="mono" font-size="13" fill="#f3ece1">[Acme] Nothern Lights (2019).mkv</text>
<rect x="152" y="364" width="71.9" height="18" rx="9" fill="#e8a33d"/>
<circle cx="164" cy="373" r="4.5" fill="none" stroke="#1a1206" stroke-opacity=".35" stroke-width="1.5"/>
<path d="M164 368.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="#1a1206" stroke-width="1.5"/>
<text x="174" y="376.5" font-size="10.4" fill="#1a1206">renaming</text>
<text x="236" y="377" font-size="12" fill="#9b9082">Started 14:02. You can leave this page.</text>
<text class="ttl" x="16" y="418">4 · Renamed: the latest rename can be undone while the file keeps that name</text>
<text class="cap" x="16" y="433">Mirrors the held-original banner: a surface box, then the quiet undo.</text>
<rect x="16" y="444" width="688" height="136" rx="2" fill="#0c0a09"/>
<text x="40" y="472" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="472" class="mono" font-size="13" fill="#f3ece1">[Acme] Ada Lovelace (2023).mkv</text>
<rect x="152" y="484" width="520" height="54" rx="2" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
<text x="164" y="505" font-size="14" fill="#f3ece1">Renamed Oct 30 from</text>
<text x="164" y="525" class="mono" font-size="13" fill="#f3ece1">Ada Lovelace (2023).mkv</text>
<text x="164" y="565.9" font-size="14" fill="#9b9082">Undo rename</text>
<text x="257.9" y="566" font-size="14" fill="#9b9082">History (2)</text>
<text x="337.8" y="566" font-size="12" fill="#9b9082">▾</text>
<text class="ttl" x="16" y="614">5 · History open (P1): the names it has carried, oldest to newest</text>
<text class="cap" x="16" y="629">Opened from History (2); the trigger that gave each name is named.</text>
<rect x="16" y="640" width="688" height="96" rx="2" fill="#0c0a09"/>
<text x="152" y="668" font-size="12" fill="#9b9082">Arrived</text>
<text x="208" y="668" font-size="12" fill="#9b9082"></text>
<text x="264" y="668" class="mono" font-size="12" fill="#9b9082">ada.lovelace.2023.1080p.WEB-DL.x264-GRP.mkv</text>
<text x="152" y="692" font-size="12" fill="#9b9082">Oct 2</text>
<text x="208" y="692" font-size="12" fill="#9b9082">job</text>
<text x="264" y="692" class="mono" font-size="12" fill="#9b9082">Ada Lovelace (2023).mkv</text>
<text x="152" y="716" font-size="12" fill="#9b9082">Oct 30</text>
<text x="208" y="716" font-size="12" fill="#9b9082">manual</text>
<text x="264" y="716" class="mono" font-size="12" fill="#f3ece1">[Acme] Ada Lovelace (2023).mkv</text>
<text class="ttl" x="16" y="770">6 · Locked after a hand edit</text>
<text class="cap" x="16" y="785">Lock by you reads "Locked by you."; after an undo, "Locked when you undid a rename on Oct 30."</text>
<rect x="16" y="796" width="688" height="92" rx="2" fill="#0c0a09"/>
<text x="40" y="824" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="824" class="mono" font-size="13" fill="#f3ece1">night ferry - my cut.mkv</text>
<rect x="348.7" y="818.5" width="9" height="6.5" rx="1" fill="none" stroke="#f3ece1" stroke-width="1.3"/>
<path d="M350.7 818.5v-1.8a2.5 2.5 0 0 1 5 0v1.8" fill="none" stroke="#f3ece1" stroke-width="1.3"/>
<text x="152" y="844" font-size="12" fill="#9b9082">Locked when you renamed it outside Holodex on Oct 12. Holodex leaves its name alone.</text>
<rect x="165.5" y="865.5" width="9" height="6.5" rx="1" fill="none" stroke="#9b9082" stroke-width="1.3"/>
<path d="M167.5 865.5v-1.8a2.5 2.5 0 0 1 5 0" fill="none" stroke="#9b9082" stroke-width="1.3"/>
<text x="182" y="871.9" font-size="14" fill="#9b9082">Unlock</text>
<text class="ttl" x="16" y="922">7 · Blocked by a held original</text>
<text class="cap" x="16" y="937">The held-original banner sits just above in Maintenance.</text>
<rect x="16" y="948" width="688" height="56" rx="2" fill="#0c0a09"/>
<text x="40" y="976" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="976" class="mono" font-size="13" fill="#f3ece1">glass_harbour.mkv</text>
<text x="152" y="996" font-size="12" fill="#9b9082">Can't rename while the original is held (until Nov 4).</text>
<text class="ttl" x="16" y="1038">8 · Refused: the name wouldn't read back</text>
<rect x="16" y="1050" width="688" height="72" rx="2" fill="#0c0a09"/>
<text x="40" y="1078" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="1078" class="mono" font-size="13" fill="#f3ece1">long_afternoon_final.mkv</text>
<text x="152" y="1098" font-size="12" fill="#e2603f">Won't rename: studio </text>
<text x="273" y="1098" class="mono" font-size="12" fill="#f3ece1">Acme [EU]</text>
<text x="337.8" y="1098" font-size="12" fill="#e2603f"> contains </text>
<text x="395.4" y="1098" class="mono" font-size="12" fill="#f3ece1">]</text>
<text x="402.6" y="1098" font-size="12" fill="#e2603f">, which ends {studio} in template 1.</text>
<text x="152" y="1116" font-size="12" fill="#9b9082">Edit the template or the studio name in File names.</text>
<text class="ttl" x="16" y="1156">9 · Undo refused</text>
<rect x="16" y="1168" width="688" height="56" rx="2" fill="#0c0a09"/>
<text x="40" y="1196" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="1196" class="mono" font-size="13" fill="#f3ece1">[Acme] Ada Lovelace (2023).mkv</text>
<text x="152" y="1216" font-size="12" fill="#e2603f">Can't undo: </text>
<text x="221.1" y="1216" class="mono" font-size="12" fill="#f3ece1">Ada Lovelace (2023).mkv</text>
<text x="386.7" y="1216" font-size="12" fill="#e2603f"> is taken.</text>
<text class="ttl" x="16" y="1258">10 · Rename failed (job state, as Maintenance's other jobs)</text>
<rect x="16" y="1270" width="688" height="56" rx="2" fill="#0c0a09"/>
<text x="40" y="1298" font-size="14" fill="#9b9082">File name</text>
<text x="152" y="1298" class="mono" font-size="13" fill="#f3ece1">[Acme] Nothern Lights (2019).mkv</text>
<text x="152" y="1318" font-size="12" fill="#e2603f">Rename failed: the folder wasn't reachable. </text>
<text x="405.4" y="1318" font-size="12" fill="#e8a33d">Retry</text>
<line x1="405.4" y1="1320" x2="434.2" y2="1320" stroke="#e8a33d"/>
<text x="444.2" y="1318" font-size="12" fill="#9b9082">Dismiss</text>
<line x1="444.2" y1="1320" x2="484.6" y2="1320" stroke="#9b9082"/>
</svg>
