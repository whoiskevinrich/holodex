<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Edition as built (HOLODEX-377) — "Director's Edition" on the media detail and film detail pages</title>
  <desc>Two panels drawn from the shipped components. Panel A, the media detail page: the header with the edition pill directly beside the title, then the Metadata grid's Edition row in its three resting provenances (container tag, filename marker, typed custom value with the out-of-sync pill), then the row as it lands from the film page's deep link — expanded, with the blank file chip, the filename candidate selected and the Custom opener — and the Write-to-file dialog line. Panel B, the film detail page's Full film list: one file with a Director's Edition pill directly beside its title, one with no edition showing the dashed Set edition link in that same slot, one with a long edition wrapped beneath its title, and the visitor rendering with pills but no link or write button.</desc>

  <rect width="900" height="900" fill="#0c0a09"/>

  <!-- ─────────── A. Media detail page: Edition row, as built ─────────── -->
  <text x="30" y="30" fill="#e8a33d" font-size="11" letter-spacing="1.2">A — MEDIA DETAIL: EDITION BESIDE THE TITLE, AND ITS METADATA ROW, AS BUILT (377)</text>
  <rect x="30" y="42" width="840" height="550" rx="10" fill="#15110e" stroke="#2a2622" stroke-width="1"/>

  <!-- A0 header: title + edition pill, the trailing slot of NameEditControl -->
  <text x="46" y="68" fill="#9b9082" font-size="11" letter-spacing="1.2">HEADER — the edition reads beside the title when present (owner and visitor)</text>
  <rect x="46" y="80" width="808" height="46" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="110" fill="#f3ece1" font-size="20" font-weight="600" font-family="'Fraunces Variable', serif">Dune</text>
  <rect x="116" y="93" width="108" height="20" rx="10" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="170" y="107" fill="#9b9082" font-size="10" text-anchor="middle">Director's Edition</text>
  <rect x="232" y="95" width="16" height="16" rx="4" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="240" y="107" fill="#9b9082" font-size="9" text-anchor="middle">✎</text>
  <text x="264" y="107" fill="#9b9082" font-size="9">← beside the title when it fits; on narrow screens it drops beneath the title, never truncated · display only</text>
  <text x="58" y="122" fill="#9b9082" font-size="8.5">4K · 3840×2160 · 2:35:24 · 2021 · video:8</text>

  <!-- A1 three resting provenances, side by side -->
  <text x="46" y="148" fill="#9b9082" font-size="11" letter-spacing="1.2">METADATA GRID — the same field's curation row, three provenances (owner view = visitor view + the badge)</text>

  <!-- card: container tag -->
  <rect x="46" y="160" width="262" height="86" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="178" fill="#9b9082" font-size="9" letter-spacing="1">FROM THE CONTAINER TAG</text>
  <text x="58" y="202" fill="#9b9082" font-size="11">Edition:</text>
  <text x="58" y="222" fill="#f3ece1" font-size="12">Director's Edition</text>
  <rect x="176" y="210" width="30" height="16" rx="8" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="191" y="221" fill="#9b9082" font-size="9" text-anchor="middle">file</text>
  <text x="58" y="238" fill="#9b9082" font-size="8.5">MKV EDITION / MP4 XMP-prism:Edition → in sync</text>

  <!-- card: filename marker -->
  <rect x="320" y="160" width="262" height="86" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="332" y="178" fill="#9b9082" font-size="9" letter-spacing="1">FROM THE FILENAME MARKER</text>
  <text x="332" y="202" fill="#9b9082" font-size="11">Edition:</text>
  <text x="332" y="222" fill="#f3ece1" font-size="12">Director's Edition</text>
  <rect x="450" y="210" width="54" height="16" rx="8" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="477" y="221" fill="#9b9082" font-size="9" text-anchor="middle">filename</text>
  <text x="332" y="238" fill="#9b9082" font-size="8.5">…{edition-Director's Edition}.mkv → F48 candidate</text>

  <!-- card: custom -->
  <rect x="594" y="160" width="262" height="86" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="606" y="178" fill="#9b9082" font-size="9" letter-spacing="1">TYPED BY THE OWNER</text>
  <text x="606" y="202" fill="#9b9082" font-size="11">Edition:</text>
  <text x="606" y="222" fill="#f3ece1" font-size="12">Director's Edition</text>
  <rect x="724" y="210" width="46" height="16" rx="8" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="747" y="221" fill="#9b9082" font-size="9" text-anchor="middle">custom</text>
  <rect x="776" y="210" width="72" height="16" rx="8" fill="none" stroke="#e2603f" stroke-width="1"/>
  <text x="812" y="221" fill="#e2603f" font-size="8.5" text-anchor="middle">file out of sync</text>
  <text x="606" y="238" fill="#9b9082" font-size="8.5">curated in the DB; the pill clears after Write to file…</text>

  <text x="46" y="266" fill="#9b9082" font-size="9">The badge is the affordance and it renders in all three — single-source rows included (RD12). Click expands the chip row below.</text>

  <line x1="46" y1="280" x2="854" y2="280" stroke="#2a2622" stroke-width="1"/>

  <!-- A2 landed via deep link, expanded -->
  <text x="46" y="302" fill="#9b9082" font-size="11" letter-spacing="1.2">LANDED FROM THE FILM PAGE — /media/{id}#field-edition, row scrolled into view, badge already expanded</text>

  <rect x="46" y="314" width="808" height="140" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="338" fill="#9b9082" font-size="11">Edition:</text>
  <text x="58" y="358" fill="#f3ece1" font-size="12">Director's Edition</text>
  <rect x="176" y="346" width="54" height="16" rx="8" fill="#15110e" stroke="#e8a33d" stroke-width="1"/>
  <text x="203" y="357" fill="#9b9082" font-size="9" text-anchor="middle">filename</text>

  <!-- chip row (radiogroup) -->
  <rect x="58" y="372" width="74" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="70" y="389" fill="#9b9082" font-size="11">—</text>
  <text x="86" y="389" fill="#9b9082" font-size="9">· file</text>

  <rect x="140" y="372" width="164" height="26" rx="13" fill="#181310" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="152" y="389" fill="#f3ece1" font-size="11">Director's Edition</text>
  <text x="262" y="389" fill="#9b9082" font-size="9">· filename</text>

  <rect x="312" y="372" width="78" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="324" y="389" fill="#9b9082" font-size="11">+ Custom</text>

  <rect x="58" y="410" width="64" height="24" rx="6" fill="#e8a33d"/>
  <text x="90" y="426" fill="#1a1206" font-size="11" text-anchor="middle">Confirm</text>
  <rect x="130" y="410" width="56" height="24" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="158" y="426" fill="#9b9082" font-size="11" text-anchor="middle">Cancel</text>

  <text x="420" y="380" fill="#9b9082" font-size="9">The "— · file" chip is the F37 blank-pin and stays (the pre-build mockup dropped it — corrected).</text>
  <text x="420" y="396" fill="#9b9082" font-size="9">A file with no tag, no marker and no decision has no row at all — the landing renders one</text>
  <text x="420" y="412" fill="#9b9082" font-size="9">from its completeness facet ("— · file" and "+ Custom" only); Confirm on a typed value</text>
  <text x="420" y="428" fill="#9b9082" font-size="9">makes it a real row. Edition is an optional facet: never scored, never queued.</text>

  <line x1="46" y1="470" x2="854" y2="470" stroke="#2a2622" stroke-width="1"/>

  <!-- A3 writeback dialog line -->
  <text x="46" y="492" fill="#9b9082" font-size="11" letter-spacing="1.2">WRITE DECISIONS TO FILE… — the dialog lists Edition like any other writable field</text>
  <rect x="46" y="504" width="808" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <rect x="58" y="513" width="14" height="14" rx="3" fill="#e8a33d"/>
  <text x="65" y="524" fill="#1a1206" font-size="10" text-anchor="middle">✓</text>
  <text x="82" y="525" fill="#f3ece1" font-size="11">Edition</text>
  <rect x="126" y="513" width="46" height="16" rx="8" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="149" y="524" fill="#9b9082" font-size="9" text-anchor="middle">custom</text>
  <text x="182" y="525" fill="#9b9082" font-size="11">→</text>
  <text x="198" y="525" fill="#f3ece1" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Edition</text>
  <text x="252" y="525" fill="#9b9082" font-size="10">was: —</text>
  <text x="560" y="525" fill="#9b9082" font-size="9">MKV → EDITION · MP4 → XMP-prism:Edition · both read back as Edition</text>

  <text x="46" y="562" fill="#9b9082" font-size="9">No helper line under the row (owner ruling): the out-of-sync pill and this dialog are the mechanism.</text>
  <text x="46" y="578" fill="#9b9082" font-size="9">Visitors see the value and the provenance badge only — no chip row, no dialog.</text>

  <circle cx="850" cy="62" r="10" fill="#181310" stroke="#e8a33d" stroke-width="1"/>
  <text x="850" y="66" fill="#e8a33d" font-size="11" text-anchor="middle">A</text>

  <!-- ─────────── B. Film detail page: Full film list, as built ─────────── -->
  <text x="30" y="626" fill="#e8a33d" font-size="11" letter-spacing="1.2">B — FILM DETAIL: FULL FILM LIST, EDITION PILL PER FILE, AS BUILT (377)</text>
  <rect x="30" y="638" width="840" height="240" rx="10" fill="#15110e" stroke="#2a2622" stroke-width="1"/>

  <!-- owner column -->
  <text x="46" y="664" fill="#9b9082" font-size="11" letter-spacing="1.2">FULL FILM — owner</text>

  <rect x="46" y="676" width="480" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="697" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="96" y="685" width="94" height="18" rx="9" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="143" y="697" fill="#9b9082" font-size="9" text-anchor="middle">Director's Edition</text>
  <rect x="384" y="685" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="402" y="697" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">FHD</text>
  <rect x="426" y="683" width="90" height="22" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="471" y="697" fill="#9b9082" font-size="9" text-anchor="middle">Write to file…</text>

  <rect x="46" y="718" width="480" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="739" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="96" y="727" width="78" height="18" rx="9" fill="none" stroke="#9b9082" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="135" y="739" fill="#e8a33d" font-size="9" text-anchor="middle">+ Set edition</text>
  <rect x="384" y="727" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="402" y="739" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">4K</text>
  <rect x="426" y="725" width="90" height="22" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="471" y="739" fill="#9b9082" font-size="9" text-anchor="middle">Write to file…</text>

  <rect x="46" y="760" width="480" height="52" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="781" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="58" y="788" width="252" height="18" rx="9" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="184" y="800" fill="#9b9082" font-size="9" text-anchor="middle">Director's Edition, Remastered 2007 Anniversary</text>
  <rect x="384" y="769" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="402" y="781" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">FHD</text>
  <rect x="426" y="767" width="90" height="22" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="471" y="781" fill="#9b9082" font-size="9" text-anchor="middle">Write to file…</text>

  <text x="46" y="830" fill="#9b9082" font-size="9">row 1: the file's resolved edition, read-only pill directly beside the title · row 2: no edition + owner →</text>
  <text x="46" y="844" fill="#9b9082" font-size="9">dashed link to /media/{id}#field-edition (panel A, landed) · row 3: a long edition is never truncated — it drops</text>
  <text x="46" y="858" fill="#9b9082" font-size="9">beneath the title and wraps inside the row; resolution and Write to file… keep the title line. One row shape, no banner.</text>

  <!-- visitor column -->
  <line x1="544" y1="654" x2="544" y2="862" stroke="#2a2622" stroke-width="1"/>
  <text x="560" y="664" fill="#9b9082" font-size="11" letter-spacing="1.2">FULL FILM — visitor</text>

  <rect x="560" y="676" width="294" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="572" y="697" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="610" y="685" width="94" height="18" rx="9" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="657" y="697" fill="#9b9082" font-size="9" text-anchor="middle">Director's Edition</text>
  <rect x="806" y="685" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="824" y="697" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">FHD</text>

  <rect x="560" y="718" width="294" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="572" y="739" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="806" y="727" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="824" y="739" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">4K</text>

  <text x="560" y="780" fill="#9b9082" font-size="9">Same pill, beside the title. No "+ Set edition",</text>
  <text x="560" y="794" fill="#9b9082" font-size="9">no Write to file… — an empty slot is an</text>
  <text x="560" y="808" fill="#9b9082" font-size="9">empty slot. The film page never resolves</text>
  <text x="560" y="822" fill="#9b9082" font-size="9">edition itself; it renders what the full-film</text>
  <text x="560" y="836" fill="#9b9082" font-size="9">payload carries from the media resolver.</text>

  <circle cx="850" cy="658" r="10" fill="#181310" stroke="#e8a33d" stroke-width="1"/>
  <text x="850" y="662" fill="#e8a33d" font-size="11" text-anchor="middle">B</text>
</svg>
