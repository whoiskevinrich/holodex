<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Edition as built (HOLODEX-377) — "Director's Edition" on the media detail and film detail pages</title>
  <desc>Two panels drawn from the shipped components. Panel A, the media detail page's Metadata field grid: the Edition row in its three resting provenances (container tag, filename marker, typed custom value with the out-of-sync pill), then the row as it lands from the film page's deep link — expanded, with the blank file chip, the filename candidate selected and the Custom opener — and the Write-to-file dialog line. Panel B, the film detail page's Full film list: one file with a Director's Edition pill, one with no edition showing the dashed Set edition link, one with a long edition truncated at eighteen characters, and the visitor rendering with pills but no link or write button.</desc>

  <rect width="900" height="820" fill="#0c0a09"/>

  <!-- ─────────── A. Media detail page: Edition row, as built ─────────── -->
  <text x="30" y="30" fill="#e8a33d" font-size="11" letter-spacing="1.2">A — MEDIA DETAIL: EDITION ROW IN THE METADATA GRID, AS BUILT (377)</text>
  <rect x="30" y="42" width="840" height="470" rx="10" fill="#15110e" stroke="#2a2622" stroke-width="1"/>

  <!-- A1 three resting provenances, side by side -->
  <text x="46" y="68" fill="#9b9082" font-size="11" letter-spacing="1.2">AT REST — one row, three provenances (owner view = visitor view + the badge)</text>

  <!-- card: container tag -->
  <rect x="46" y="80" width="262" height="86" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="98" fill="#9b9082" font-size="9" letter-spacing="1">FROM THE CONTAINER TAG</text>
  <text x="58" y="122" fill="#9b9082" font-size="11">Edition:</text>
  <text x="58" y="142" fill="#f3ece1" font-size="12">Director's Edition</text>
  <rect x="176" y="130" width="30" height="16" rx="8" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="191" y="141" fill="#9b9082" font-size="9" text-anchor="middle">file</text>
  <text x="58" y="158" fill="#9b9082" font-size="8.5">MKV EDITION / MP4 XMP-prism:Edition → in sync</text>

  <!-- card: filename marker -->
  <rect x="320" y="80" width="262" height="86" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="332" y="98" fill="#9b9082" font-size="9" letter-spacing="1">FROM THE FILENAME MARKER</text>
  <text x="332" y="122" fill="#9b9082" font-size="11">Edition:</text>
  <text x="332" y="142" fill="#f3ece1" font-size="12">Director's Edition</text>
  <rect x="450" y="130" width="54" height="16" rx="8" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="477" y="141" fill="#9b9082" font-size="9" text-anchor="middle">filename</text>
  <text x="332" y="158" fill="#9b9082" font-size="8.5">…{edition-Director's Edition}.mkv → F48 candidate</text>

  <!-- card: custom -->
  <rect x="594" y="80" width="262" height="86" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="606" y="98" fill="#9b9082" font-size="9" letter-spacing="1">TYPED BY THE OWNER</text>
  <text x="606" y="122" fill="#9b9082" font-size="11">Edition:</text>
  <text x="606" y="142" fill="#f3ece1" font-size="12">Director's Edition</text>
  <rect x="724" y="130" width="46" height="16" rx="8" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="747" y="141" fill="#9b9082" font-size="9" text-anchor="middle">custom</text>
  <rect x="776" y="130" width="72" height="16" rx="8" fill="none" stroke="#e2603f" stroke-width="1"/>
  <text x="812" y="141" fill="#e2603f" font-size="8.5" text-anchor="middle">file out of sync</text>
  <text x="606" y="158" fill="#9b9082" font-size="8.5">curated in the DB; the pill clears after Write to file…</text>

  <text x="46" y="186" fill="#9b9082" font-size="9">The badge is the affordance and it renders in all three — single-source rows included (RD12). Click expands the chip row below.</text>

  <line x1="46" y1="200" x2="854" y2="200" stroke="#2a2622" stroke-width="1"/>

  <!-- A2 landed via deep link, expanded -->
  <text x="46" y="222" fill="#9b9082" font-size="11" letter-spacing="1.2">LANDED FROM THE FILM PAGE — /media/{id}#field-edition, row scrolled into view, badge already expanded</text>

  <rect x="46" y="234" width="808" height="140" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="258" fill="#9b9082" font-size="11">Edition:</text>
  <text x="58" y="278" fill="#f3ece1" font-size="12">Director's Edition</text>
  <rect x="176" y="266" width="54" height="16" rx="8" fill="#15110e" stroke="#e8a33d" stroke-width="1"/>
  <text x="203" y="277" fill="#9b9082" font-size="9" text-anchor="middle">filename</text>

  <!-- chip row (radiogroup) -->
  <rect x="58" y="292" width="74" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="70" y="309" fill="#9b9082" font-size="11">—</text>
  <text x="86" y="309" fill="#9b9082" font-size="9">· file</text>

  <rect x="140" y="292" width="164" height="26" rx="13" fill="#181310" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="152" y="309" fill="#f3ece1" font-size="11">Director's Edition</text>
  <text x="262" y="309" fill="#9b9082" font-size="9">· filename</text>

  <rect x="312" y="292" width="78" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="324" y="309" fill="#9b9082" font-size="11">+ Custom</text>

  <rect x="58" y="330" width="64" height="24" rx="6" fill="#e8a33d"/>
  <text x="90" y="346" fill="#1a1206" font-size="11" text-anchor="middle">Confirm</text>
  <rect x="130" y="330" width="56" height="24" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="158" y="346" fill="#9b9082" font-size="11" text-anchor="middle">Cancel</text>

  <text x="420" y="300" fill="#9b9082" font-size="9">The "— · file" chip is the F37 blank-pin and stays (the pre-build mockup dropped it — corrected).</text>
  <text x="420" y="316" fill="#9b9082" font-size="9">A file with no tag, no marker and no decision has no row at all — the landing renders one</text>
  <text x="420" y="332" fill="#9b9082" font-size="9">from its completeness facet ("— · file" and "+ Custom" only); Confirm on a typed value</text>
  <text x="420" y="348" fill="#9b9082" font-size="9">makes it a real row. Edition is an optional facet: never scored, never queued.</text>

  <line x1="46" y1="390" x2="854" y2="390" stroke="#2a2622" stroke-width="1"/>

  <!-- A3 writeback dialog line -->
  <text x="46" y="412" fill="#9b9082" font-size="11" letter-spacing="1.2">WRITE DECISIONS TO FILE… — the dialog lists Edition like any other writable field</text>
  <rect x="46" y="424" width="808" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <rect x="58" y="433" width="14" height="14" rx="3" fill="#e8a33d"/>
  <text x="65" y="444" fill="#1a1206" font-size="10" text-anchor="middle">✓</text>
  <text x="82" y="445" fill="#f3ece1" font-size="11">Edition</text>
  <rect x="126" y="433" width="46" height="16" rx="8" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="149" y="444" fill="#9b9082" font-size="9" text-anchor="middle">custom</text>
  <text x="182" y="445" fill="#9b9082" font-size="11">→</text>
  <text x="198" y="445" fill="#f3ece1" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Edition</text>
  <text x="252" y="445" fill="#9b9082" font-size="10">was: —</text>
  <text x="560" y="445" fill="#9b9082" font-size="9">MKV → EDITION · MP4 → XMP-prism:Edition · both read back as Edition</text>

  <text x="46" y="482" fill="#9b9082" font-size="9">No helper line under the row (owner ruling): the out-of-sync pill and this dialog are the mechanism.</text>
  <text x="46" y="498" fill="#9b9082" font-size="9">Visitors see the value and the provenance badge only — no chip row, no dialog.</text>

  <circle cx="850" cy="62" r="10" fill="#181310" stroke="#e8a33d" stroke-width="1"/>
  <text x="850" y="66" fill="#e8a33d" font-size="11" text-anchor="middle">A</text>

  <!-- ─────────── B. Film detail page: Full film list, as built ─────────── -->
  <text x="30" y="546" fill="#e8a33d" font-size="11" letter-spacing="1.2">B — FILM DETAIL: FULL FILM LIST, EDITION PILL PER FILE, AS BUILT (377)</text>
  <rect x="30" y="558" width="840" height="240" rx="10" fill="#15110e" stroke="#2a2622" stroke-width="1"/>

  <!-- owner column -->
  <text x="46" y="584" fill="#9b9082" font-size="11" letter-spacing="1.2">FULL FILM — owner</text>

  <rect x="46" y="596" width="480" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="617" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="284" y="605" width="94" height="18" rx="9" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="331" y="617" fill="#9b9082" font-size="9" text-anchor="middle">Director's Edition</text>
  <rect x="384" y="605" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="402" y="617" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">FHD</text>
  <rect x="426" y="603" width="90" height="22" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="471" y="617" fill="#9b9082" font-size="9" text-anchor="middle">Write to file…</text>

  <rect x="46" y="638" width="480" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="659" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="300" y="647" width="78" height="18" rx="9" fill="none" stroke="#9b9082" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="339" y="659" fill="#e8a33d" font-size="9" text-anchor="middle">+ Set edition</text>
  <rect x="384" y="647" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="402" y="659" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">4K</text>
  <rect x="426" y="645" width="90" height="22" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="471" y="659" fill="#9b9082" font-size="9" text-anchor="middle">Write to file…</text>

  <rect x="46" y="680" width="480" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="58" y="701" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="270" y="689" width="108" height="18" rx="9" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="324" y="701" fill="#9b9082" font-size="9" text-anchor="middle">Director's Edition,…</text>
  <rect x="384" y="689" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="402" y="701" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">FHD</text>
  <rect x="426" y="687" width="90" height="22" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="471" y="701" fill="#9b9082" font-size="9" text-anchor="middle">Write to file…</text>

  <text x="46" y="738" fill="#9b9082" font-size="9">row 1: the file's resolved edition, read-only pill between title and resolution · row 2: no edition + owner →</text>
  <text x="46" y="752" fill="#9b9082" font-size="9">dashed link to /media/{id}#field-edition (panel A, landed) · row 3: "Director's Edition, Remastered" truncated</text>
  <text x="46" y="766" fill="#9b9082" font-size="9">at 18ch with the full value in the title tooltip. Three files with mixed states share one row shape — no banner.</text>

  <!-- visitor column -->
  <line x1="544" y1="574" x2="544" y2="782" stroke="#2a2622" stroke-width="1"/>
  <text x="560" y="584" fill="#9b9082" font-size="11" letter-spacing="1.2">FULL FILM — visitor</text>

  <rect x="560" y="596" width="294" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="572" y="617" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="706" y="605" width="94" height="18" rx="9" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="753" y="617" fill="#9b9082" font-size="9" text-anchor="middle">Director's Edition</text>
  <rect x="806" y="605" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="824" y="617" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">FHD</text>

  <rect x="560" y="638" width="294" height="34" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="572" y="659" fill="#f3ece1" font-size="12">Dune</text>
  <rect x="806" y="647" width="36" height="18" rx="4" fill="#e8a33d"/>
  <text x="824" y="659" fill="#1a1206" font-size="9" font-weight="600" text-anchor="middle">4K</text>

  <text x="560" y="700" fill="#9b9082" font-size="9">Same pill, same slot. No "+ Set edition",</text>
  <text x="560" y="714" fill="#9b9082" font-size="9">no Write to file… — an empty slot is an</text>
  <text x="560" y="728" fill="#9b9082" font-size="9">empty slot. The film page never resolves</text>
  <text x="560" y="742" fill="#9b9082" font-size="9">edition itself; it renders what the full-film</text>
  <text x="560" y="756" fill="#9b9082" font-size="9">payload carries from the media resolver.</text>

  <circle cx="850" cy="578" r="10" fill="#181310" stroke="#e8a33d" stroke-width="1"/>
  <text x="850" y="582" fill="#e8a33d" font-size="11" text-anchor="middle">B</text>
</svg>
