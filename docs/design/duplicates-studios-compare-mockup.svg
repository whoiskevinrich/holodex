  <line x1="8" y1="66" x2="712" y2="66" stroke="#2a2622" stroke-width="1"/>
  <text x="8.0" y="478.25" class="cap">“Name came from” lists each source that carries this name on some video now, with how many (one video can count for two). It says nothing</text>
  <text x="8.0" y="492.25" class="cap">about which won or which came first. Posters (OQ7): up to 3, one per source first, then newest; each names the source that won its studio.</text>
  <text x="8.0" y="506.25" class="cap">Aliases name their origin: a provider, or “you” (typed, or kept by a merge or rename). Provider badges open the provider’s page in a new tab.</text>
  <text x="8.0" y="520.25" class="cap">No videos: no posters, no space. A match-kind label opens the well as on People (RD10); this pair matched on canonical names, so has none.</text>
  <text x="8.0" y="550.25" class="ttl">2 · Confirmations — ConfirmDialog, the destructive (warn) variant: a merge cannot be undone</text>
  <rect x="8" y="560.25" width="348" height="188.0" rx="2" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="24.0" y="592.25" class="s18 ink serif">Merge into Dana Whitlock?</text>
  <text x="24.0" y="612.25" class="s14 ink">Dana Whitlok’s 2 videos, films and links</text>
  <text x="24.0" y="632.25" class="s14 ink">move to Dana Whitlock. “Dana Whitlok”</text>
  <text x="24.0" y="652.25" class="s14 ink">stays as an alias, so it still finds this person.</text>
  <text x="24.0" y="678.25" class="s14 muted">This can’t be undone.</text>
  <rect x="279.6" y="702.25" width="60.4" height="30" rx="2" fill="#e2603f" stroke="#e2603f" stroke-width="1"/>
  <text x="309.8" y="722.25" class="s14 wai b" text-anchor="middle">Merge</text>
  <rect x="203.92000000000002" y="702.25" width="67.68" height="30" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
  <text x="237.8" y="722.25" class="s14 ink" text-anchor="middle">Cancel</text>
  <rect x="364" y="560.25" width="348" height="284.0" rx="2" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
  <text x="380.0" y="592.25" class="s18 ink serif">Merge into Northlight Pictures?</text>
  <text x="380.0" y="612.25" class="s14 ink">Northlite Pics’s 3 videos and links move to</text>
  <text x="380.0" y="632.25" class="s14 ink">Northlight Pictures.</text>
  <text x="380.0" y="660.25" class="s14 muted">Show the studio as</text>
