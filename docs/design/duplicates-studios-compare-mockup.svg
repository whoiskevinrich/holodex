  <line x1="20" y1="412.25" x2="700" y2="412.25" stroke="#2a2622" stroke-width="1"/>
  <rect x="602.88" y="424.25" width="97.12" height="22" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
