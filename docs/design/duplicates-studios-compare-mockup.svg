  <text x="513.7" y="1154.25" class="s14 ink" text-anchor="middle">Cancel</text>
  <text x="16.0" y="876.25" class="cap">Below: the same studio dialog with the other</text>
  <text x="16.0" y="890.25" class="cap">spelling picked. The writeback line follows the pick,</text>
  <text x="16.0" y="904.25" class="cap">the rename consequence is spelled out, and the</text>
  <text x="16.0" y="918.25" class="cap">button names both acts.</text>
