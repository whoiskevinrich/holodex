  <text x="380.0" y="908.25" class="s14 ink">Northlite Pics’s 3 videos and links move to</text>
  <text x="380.0" y="928.25" class="s14 ink">Northlight Pictures.</text>
  <text x="380.0" y="956.25" class="s14 muted">Show the studio as</text>
