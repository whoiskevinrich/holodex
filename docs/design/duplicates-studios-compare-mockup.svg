<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1196.25" width="720" height="1196.25" role="img" aria-labelledby="t d">
  <title id="t">Duplicates Studios compare panel and merge confirmations (F70, HOLODEX-598)</title>
  <desc id="d">Two panels in Cinematheque tokens. 1: an expanded studio pair, Northlight Pictures with 40 videos against Northlite Pics with 3. Each bordered column has the name with a new-tab mark, its video count, a Name came from list of sources with video counts (provider-1 38 and file tags 2 on the left, file tags 3 on the right), three 16 by 9 sample posters each captioned with the source that won its studio name, an Also known as list giving each alias its origin (a provider or you) or No other names, a link row of Videos and the providers that know the studio, with new-tab marks, and a Merge into this one accent pill; a footer repeats Keep separate. 2: three confirmation dialogs with a warn-coloured confirm button. The person dialog names the survivor and the name that becomes an alias. The studio dialog adds a Show the studio as radio choice defaulting to the survivor&#x27;s name and says which name writeback will offer; with the other spelling picked it says the studio is renamed as from its own page and the button reads Merge and rename.</desc>
