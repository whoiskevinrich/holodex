  <circle cx="386" cy="992.25" r="3" fill="#e8a33d"/>
  <text x="400.0" y="996.25" class="s14 ink">Northlite Pics</text>
  <text x="380.0" y="1024.25" class="s14 ink">This renames the studio, as renaming it on its</text>
  <text x="380.0" y="1044.25" class="s14 ink">own page would. “Northlight Pictures” stays as</text>
  <text x="380.0" y="1064.25" class="s14 ink">an alias. Writeback will offer Northlite Pics</text>
  <text x="380.0" y="1084.25" class="s14 ink">for these files.</text>
  <text x="380.0" y="1110.25" class="s14 muted">This can’t be undone.</text>
