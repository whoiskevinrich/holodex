<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 594" width="760" height="594" role="img" aria-labelledby="t d">
<title id="t">Person hover card — F68 mockup, six panels in the default skin</title>
<desc id="d">All panels use the default Cinémathèque skin. Top row: the card opened from each v1 surface — a film page “Billed on the release” dashed chip as the owner, a /search page person row as a visitor, a “More with” shelf title as the owner. Each card: 48px 1:1 headshot at left; the name in the display font with a nationality flag and, for the owner only, the 12px completeness ring (muted track, accent arc for the required band, ink lap for extras once required is 100); a muted meta line “41 · 27 titles · 3 films”; an italic “also credited as” alias line; a rule; a link row Titles · Films · TMDB provider badge. The headshot-and-name block is the profile link. Bottom row: the loading state (name line only, no spinner), a sparse state (no age, no films → those segments and the Films link are simply absent; the headshot is the backend’s themed placeholder), and the corner case where the chip sits at the bottom-right of the viewport so the card opens above it, end-aligned.</desc>
