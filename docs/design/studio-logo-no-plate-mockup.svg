<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" font-family="Archivo, Helvetica, Arial, sans-serif">
<title>StudioLinkCard plate options on the Cinémathèque skin, HOLODEX-411</title>
<rect width="720" height="200" fill="#0c0a09"/>
<text x="20" y="30" font-size="12" fill="#9b9082">A · Current — cream plate (rejected)</text>
<rect x="20" y="50" width="120" height="48" rx="2" fill="#e9e0d0" stroke="#2a2622" stroke-width="1"/>
<text x="80" y="80" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" letter-spacing="2" fill="#f8f4ee">AURORA</text>
<text x="152" y="71" font-size="13" fill="#f3ece1">Aurora Pictures</text>
<text x="152" y="87" font-size="11" fill="#9b9082">12 videos</text>
<rect x="20" y="116" width="120" height="48" rx="2" fill="#e9e0d0" stroke="#2a2622" stroke-width="1"/>
<text x="80" y="146" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" letter-spacing="2" fill="#1a1410">KESTREL</text>
<text x="152" y="137" font-size="13" fill="#f3ece1">Kestrel Films</text>
<text x="152" y="153" font-size="11" fill="#9b9082">4 videos</text>
<text x="250" y="30" font-size="12" fill="#9b9082">B · No plate — page background (chosen)</text>
<rect x="250" y="50" width="120" height="48" rx="2" fill="none"/>
<text x="310" y="80" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" letter-spacing="2" fill="#f8f4ee">AURORA</text>
<text x="382" y="71" font-size="13" fill="#f3ece1">Aurora Pictures</text>
<text x="382" y="87" font-size="11" fill="#9b9082">12 videos</text>
<rect x="250" y="116" width="120" height="48" rx="2" fill="none"/>
<text x="310" y="146" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" letter-spacing="2" fill="#1a1410">KESTREL</text>
<text x="382" y="137" font-size="13" fill="#f3ece1">Kestrel Films</text>
<text x="382" y="153" font-size="11" fill="#9b9082">4 videos</text>
<text x="480" y="30" font-size="12" fill="#9b9082">C · Frame only — no fill (rejected)</text>
<rect x="480" y="50" width="120" height="48" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="540" y="80" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" letter-spacing="2" fill="#f8f4ee">AURORA</text>
<text x="612" y="71" font-size="13" fill="#f3ece1">Aurora Pictures</text>
<text x="612" y="87" font-size="11" fill="#9b9082">12 videos</text>
<rect x="480" y="116" width="120" height="48" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="540" y="146" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" letter-spacing="2" fill="#1a1410">KESTREL</text>
<text x="612" y="137" font-size="13" fill="#f3ece1">Kestrel Films</text>
<text x="612" y="153" font-size="11" fill="#9b9082">4 videos</text>
<text x="20" y="188" font-size="11" fill="#9b9082">Light mark (Aurora) and dark-on-transparent mark (Kestrel) in each treatment. B accepts that Kestrel reads faint; the name beside it is the fallback label.</text>
</svg>
