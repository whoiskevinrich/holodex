    <text x="152" y="577" class="muted" font-size="10">changed by this issue</text>

    <rect class="gateOwner" x="300" y="566" width="120" height="14" />
    <text x="428" y="577" class="muted" font-size="10">owner-only (effectiveOwner)</text>

    <rect class="window" x="600" y="566" width="120" height="14" />
    <text x="728" y="577" class="muted" font-size="10">breaks max-w-stage, window-scoped</text>
  </g>

  <text x="24" y="608" class="ink" font-size="11" font-weight="600">Visitor differences</text>
  <text x="24" y="624" class="muted" font-size="10">Metadata renders values only — no SourceBadge, no Enrich, no writeback. Manage, Completeness, File and Enrichment data do not render at all.</text>
  <text x="24" y="638" class="muted" font-size="10">Tags, Films, People and the shelves are unchanged from owner. Block order is identical in both roles; only the owner-gated blocks drop out.</text>

  <text x="24" y="664" class="ink" font-size="11" font-weight="600">Free win on one column</text>
  <text x="24" y="680" class="muted" font-size="10">Moving the shelves out of the subject column lifts Tags, Films and People above them in DOM order below lg — the old stack put the recommendation</text>
  <text x="24" y="692" class="muted" font-size="10">shelves ahead of the entity links on every phone. No order-* needed: visual and focus order still match the DOM.</text>

  <text x="24" y="718" class="ink" font-size="11" font-weight="600">Cost of the unconditional overview rule</text>
  <text x="24" y="734" class="muted" font-size="10">On one column the synopsis now reads after the studio card rather than directly under the title. Accepted as the price of one rule instead of two: the</text>
  <text x="24" y="746" class="muted" font-size="10">viewport-conditional version could not be a second render (#field-overview is a deep link), so it needed a named-areas restructure of the shared stage-grid.</text>
</svg>
