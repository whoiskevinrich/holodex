  <rect class="bg" width="1000" height="760" />

  <text x="24" y="30" class="ink title" font-size="19" font-weight="600">Media detail — stage layout (HOLODEX-363)</text>
  <text x="24" y="49" class="muted" font-size="11">Cinematheque tokens · block order and width scope · owner and visitor · widths are the exact 1.4fr / 1fr resolution of stage-grid</text>

  <rect class="surface2" x="24" y="62" width="952" height="30" />
  <rect class="rule" x="24" y="62" width="952" height="30" />
  <text x="36" y="81" class="ink" font-size="11">Threshold <tspan class="accent" font-weight="600">2648px</tspan> = --container-stage (2600) + main padding (48). At or above it the stage stops growing, gutters open and the shelf box centres. The overview move is unconditional — it is not keyed to this.</text>

