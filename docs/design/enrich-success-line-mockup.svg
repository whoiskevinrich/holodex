<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-labelledby="t d">
  <title id="t">Enrich success line (HOLODEX-86)</title>
  <desc id="d">The person page Details panel after an enrich: the provider chip row, the field list with provenance, and below it a muted line reading "Enriched from alpha · 6 fields" that clears after four seconds.</desc>
  <rect width="560" height="230" fill="#0c0a09"/>
  <rect x="16" y="16" width="528" height="198" rx="4" fill="#15110e" stroke="#2a2622"/>
  <text x="32" y="44" font-family="Archivo, sans-serif" font-size="12" letter-spacing="1.5" fill="#9b9082">DETAILS</text>
  <g font-family="Archivo, sans-serif" font-size="12">
    <rect x="32" y="56" width="92" height="24" rx="4" fill="none" stroke="#e8a33d"/>
    <text x="42" y="72" fill="#e8a33d">alpha  Refresh</text>
    <rect x="132" y="56" width="92" height="24" rx="4" fill="none" stroke="#2a2622"/>
    <text x="142" y="72" fill="#f3ece1">bravo  Enrich</text>
    <rect x="232" y="56" width="80" height="24" rx="4" fill="none" stroke="#2a2622"/>
    <text x="244" y="72" fill="#f3ece1">Refresh all</text>
  </g>
  <g font-family="Archivo, sans-serif" font-size="14">
    <text x="32" y="112" fill="#9b9082">Born</text>
    <text x="150" y="112" fill="#f3ece1">1962-07-03</text>
    <text x="250" y="112" font-size="11" fill="#e8a33d">alpha</text>
    <text x="32" y="138" fill="#9b9082">Birthplace</text>
    <text x="150" y="138" fill="#f3ece1">Syracuse, New York</text>
    <text x="290" y="138" font-size="11" fill="#e8a33d">alpha</text>
    <text x="32" y="164" fill="#9b9082">Height</text>
    <text x="150" y="164" fill="#f3ece1">170 cm</text>
    <text x="210" y="164" font-size="11" fill="#e8a33d">alpha</text>
    <text x="32" y="196" fill="#9b9082">Enriched from alpha · 6 fields</text>
  </g>
  <text x="300" y="196" font-family="ui-monospace, monospace" font-size="11" fill="#5c544b">← aria-live, clears after 4 s</text>
</svg>
