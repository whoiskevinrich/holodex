<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>PeopleGrid mockup</title>
<desc>Before/after of the Media page's People grid (denser grid-cols-4/5/8 tiles growing to grid-cols-3/4/6, matching the Films section's tile size), the empty-state dashed box replaced by a "+ Add person" text CTA, and the Film page's Cast section rendering through the same component read-only.</desc>
<rect width="900" height="700" fill="#f4f2ee"/>

<text x="24" y="30" font-size="11" letter-spacing="1" fill="#8a8478">1 · MEDIA PAGE PEOPLE — BEFORE (grid-cols-4/5/8, dense small tiles)</text>
<rect x="24" y="42" width="852" height="140" rx="6" fill="#15110e" stroke="#2a2622"/>
<text x="48" y="66" font-size="11" letter-spacing="1" fill="#9b9082">PEOPLE</text>
<g transform="translate(48,78)">
  <g transform="translate(0,0)"><rect width="76" height="76" rx="4" fill="#2a2622"/><circle cx="38" cy="30" r="12" fill="#4a453e"/><rect x="20" y="48" width="36" height="18" rx="9" fill="#4a453e"/><rect y="82" width="76" height="9" fill="#5a554c"/></g>
  <g transform="translate(92,0)"><rect width="76" height="76" rx="4" fill="#2a2622"/><circle cx="38" cy="30" r="12" fill="#4a453e"/><rect x="20" y="48" width="36" height="18" rx="9" fill="#4a453e"/><rect y="82" width="60" height="9" fill="#5a554c"/></g>
  <g transform="translate(184,0)"><rect width="76" height="76" rx="4" fill="#2a2622"/><circle cx="38" cy="30" r="12" fill="#4a453e"/><rect x="20" y="48" width="36" height="18" rx="9" fill="#4a453e"/><rect y="82" width="68" height="9" fill="#5a554c"/></g>
  <g transform="translate(276,0)"><rect width="76" height="76" rx="4" fill="#2a2622"/><circle cx="38" cy="30" r="12" fill="#4a453e"/><rect x="20" y="48" width="36" height="18" rx="9" fill="#4a453e"/><rect y="82" width="72" height="9" fill="#5a554c"/></g>
  <g transform="translate(368,0)"><rect width="76" height="76" rx="4" fill="#2a2622"/><circle cx="38" cy="30" r="12" fill="#4a453e"/><rect x="20" y="48" width="36" height="18" rx="9" fill="#4a453e"/><rect y="82" width="56" height="9" fill="#5a554c"/></g>
  <g transform="translate(460,0)"><rect width="76" height="76" rx="4" fill="#e9e0d0" stroke="#c9c0ac" stroke-dasharray="3,2"/><line x1="30" y1="38" x2="46" y2="38" stroke="#9b9082" stroke-width="2"/><line x1="38" y1="30" x2="38" y2="46" stroke="#9b9082" stroke-width="2"/><text x="38" y="66" font-size="8" fill="#8a8478" text-anchor="middle">Add person</text></g>
</g>
<text x="48" y="182" font-size="10" fill="#8a8478">8 tiles fit per row at desktop width — cramped next to the Films section's much larger poster cards below it</text>

<text x="24" y="222" font-size="11" letter-spacing="1" fill="#8a8478">2 · AFTER — PeopleGrid (grid-cols-3/4/6, matches Films' tile size)</text>
<rect x="24" y="234" width="852" height="200" rx="6" fill="#15110e" stroke="#2a2622"/>
<text x="48" y="258" font-size="11" letter-spacing="1" fill="#9b9082">PEOPLE</text>
<g transform="translate(48,270)">
  <g transform="translate(0,0)"><rect width="130" height="130" rx="6" fill="#2a2622"/><circle cx="65" cy="52" r="20" fill="#4a453e"/><rect x="35" y="82" width="60" height="30" rx="15" fill="#4a453e"/><rect y="140" width="110" height="10" fill="#f3ece1"/></g>
  <g transform="translate(150,0)"><rect width="130" height="130" rx="6" fill="#2a2622"/><circle cx="65" cy="52" r="20" fill="#4a453e"/><rect x="35" y="82" width="60" height="30" rx="15" fill="#4a453e"/><rect y="140" width="90" height="10" fill="#f3ece1"/></g>
  <g transform="translate(300,0)"><rect width="130" height="130" rx="6" fill="#2a2622"/><circle cx="65" cy="52" r="20" fill="#4a453e"/><rect x="35" y="82" width="60" height="30" rx="15" fill="#4a453e"/><rect y="140" width="100" height="10" fill="#f3ece1"/>
    <circle cx="112" cy="18" r="12" fill="#15110e" stroke="#2a2622"/><text x="112" y="23" font-size="14" fill="#f3ece1" text-anchor="middle">×</text>
  </g>
  <g transform="translate(450,0)"><rect width="130" height="130" rx="6" fill="#e9e0d0" stroke="#c9c0ac" stroke-dasharray="4,3"/><line x1="53" y1="65" x2="77" y2="65" stroke="#8a8478" stroke-width="2.5"/><line x1="65" y1="53" x2="65" y2="77" stroke="#8a8478" stroke-width="2.5"/><text x="65" y="112" font-size="11" fill="#8a8478" text-anchor="middle">Add person</text></g>
</g>
<text x="48" y="418" font-size="10" fill="#8a8478">Fewer, larger tiles per row (6 at desktop) — visually consistent weight with the Films grid; hover reveals the × remove badge, top right</text>

<text x="24" y="458" font-size="11" letter-spacing="1" fill="#8a8478">3 · EMPTY STATE — BEFORE (dashed box) vs AFTER (text CTA)</text>
<rect x="24" y="470" width="420" height="90" rx="6" fill="#ffffff" stroke="#d8d4cc"/>
<text x="40" y="492" font-size="10" font-weight="bold" fill="#5f5e5a">BEFORE</text>
<rect x="40" y="500" width="76" height="76" rx="4" fill="#f4f2ee" stroke="#c9c0ac" stroke-dasharray="3,2"/>
<line x1="66" y1="536" x2="90" y2="536" stroke="#8a8478" stroke-width="2"/><line x1="78" y1="524" x2="78" y2="548" stroke="#8a8478" stroke-width="2"/>
<text x="140" y="530" font-size="11" fill="#8a8478">A lone dashed square floating with</text>
<text x="140" y="544" font-size="11" fill="#8a8478">nothing beside it — reads as less</text>
<text x="140" y="558" font-size="11" fill="#8a8478">fluid than an inline button.</text>

<rect x="456" y="470" width="420" height="90" rx="6" fill="#ffffff" stroke="#d8d4cc"/>
<text x="472" y="492" font-size="10" font-weight="bold" fill="#5f5e5a">AFTER</text>
<rect x="472" y="508" width="104" height="26" rx="4" fill="none" stroke="#8a8478"/>
<text x="524" y="525" font-size="11" fill="#5f5e5a" text-anchor="middle">+ Add person</text>
<text x="472" y="552" font-size="11" fill="#8a8478">Bare text CTA (.btn-quiet), matching</text>
<text x="472" y="566" font-size="11" fill="#8a8478">StudioPicker's hasStudio empty branch.</text>

<text x="24" y="600" font-size="11" letter-spacing="1" fill="#8a8478">4 · FILM PAGE CAST — same component, read-only (no attach/detach passed, so no remove badge)</text>
<rect x="24" y="612" width="852" height="70" rx="6" fill="#15110e" stroke="#2a2622"/>
<text x="48" y="636" font-size="11" letter-spacing="1" fill="#9b9082">CAST</text>
<g transform="translate(48,648)">
  <g transform="translate(0,0)"><rect width="42" height="42" rx="3" fill="#2a2622"/><circle cx="21" cy="16" r="6.5" fill="#4a453e"/><rect x="10" y="27" width="22" height="10" rx="5" fill="#4a453e"/></g>
  <g transform="translate(50,0)"><rect width="42" height="42" rx="3" fill="#2a2622"/><circle cx="21" cy="16" r="6.5" fill="#4a453e"/><rect x="10" y="27" width="22" height="10" rx="5" fill="#4a453e"/></g>
  <g transform="translate(100,0)"><rect width="42" height="42" rx="3" fill="#2a2622"/><circle cx="21" cy="16" r="6.5" fill="#4a453e"/><rect x="10" y="27" width="22" height="10" rx="5" fill="#4a453e"/></g>
  <g transform="translate(150,0)"><rect width="42" height="42" rx="3" fill="#2a2622"/><circle cx="21" cy="16" r="6.5" fill="#4a453e"/><rect x="10" y="27" width="22" height="10" rx="5" fill="#4a453e"/></g>
  <text x="215" y="26" font-size="10" fill="#8a8478">no × badge on hover — Cast is a derived union of the film's scenes' people, not an editable link</text>
</g>
</svg>
