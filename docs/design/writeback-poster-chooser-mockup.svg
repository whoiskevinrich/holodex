<svg xmlns="http://www.w3.org/2000/svg" width="814" height="1520" viewBox="0 0 814 1520" role="img" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Writeback dialog — Poster row grouped by source (HOLODEX-599, F85)</title>
<desc>The writeback dialog's Poster row in Cinémathèque, at real sizes: 80px tiles, 0.65rem labels. Tiles sit in captioned groups: In the file, Holodex (frame and upload), Automatic (only when a generated frame exists) and one group per provider, with a no-poster caption for a provider that has none. A: arrival after Pick a frame, the frame tile checked and the gutter will-write. B: after Write, collapsed as matches the file. C: a file with no cover art, Automatic shown, a pending provider tile. D: only one source. E: every group at dialog width; whole groups wrap and provider-3 starts a second line. F: phone width, groups wrap as units onto three lines. Notes give the keyboard order and the removed copy.</desc>
