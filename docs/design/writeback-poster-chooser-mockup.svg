<svg width="900" height="470" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Writeback dialog — Poster row as an image-tile chooser (HOLODEX-403)</title>
<desc>Four states of the writeback dialog's Poster row. 1: undecided — file tile and a dashed pending tmdb tile, hollow-circle gutter, footer disabled. 2: the owner picked the tmdb tile — accent border, filled dot, arrow-into-bar gutter, footer "Write 1 field to file". 3: after one Write, the ledger witnesses the URL — equals-sign gutter, "matches the file", tiles collapsed behind change. 4: an owner upload is on the page — the file tile is a placeholder and a note says the upload keeps the page; this row is the cover art inside the file. Left of each row the gutter glyph is drawn; a legend at the bottom names the glyphs.</desc>
<rect width="900" height="470" fill="#f4f2ee"/>

<text x="24" y="28" font-size="11" letter-spacing="1" fill="#8a8478">POSTER ROW — FOUR STATES (writeback dialog, cockpit revision)</text>

<!-- ===== 1 undecided ===== -->
<rect x="24" y="44" width="416" height="150" rx="8" fill="#ffffff" stroke="#d9d4cb"/>
<text x="40" y="62" font-size="10" fill="#8a8478">1 · undecided (RD6 pending winner)</text>
<circle cx="48" cy="84" r="5" fill="none" stroke="#8a8478" stroke-width="1.4"/>
<text x="64" y="88" font-size="11" font-weight="600" fill="#6b655b">Poster</text>
<text x="104" y="88" font-size="9" fill="#2f6fed">·tmdb</text>
<text x="132" y="88" font-size="9" fill="#8a8478">→ cover.jpg</text>
<rect x="64" y="98" width="52" height="74" rx="4" fill="#f7f5f1" stroke="#c9c3b8"/>
<path d="M76 140 l8 -10 l8 10 M92 126 l6 -6 l8 8" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
<circle cx="70" cy="184" r="3.5" fill="none" stroke="#6b655b" stroke-width="1.4"/>
<text x="77" y="187" font-size="10" fill="#6b655b">·file</text>
<rect x="132" y="98" width="52" height="74" rx="4" fill="#e9f0ff" stroke="#2f6fed" stroke-width="2" stroke-dasharray="4 2"/>
<path d="M144 140 l8 -10 l8 10 M160 126 l6 -6 l8 8" stroke="#2f6fed" stroke-width="1.5" fill="none"/>
<circle cx="138" cy="184" r="3.5" fill="none" stroke="#2f6fed" stroke-width="1.6"/>
<text x="145" y="187" font-size="10" fill="#2f6fed">·tmdb, pending</text>
<text x="230" y="120" font-size="10" fill="#8a8478">Nothing happens on Write</text>
<text x="230" y="134" font-size="10" fill="#8a8478">until a tile is picked.</text>
<text x="230" y="160" font-size="10" fill="#8a8478">Footer: Write 0 fields to file</text>

<!-- ===== 2 picked ===== -->
<rect x="460" y="44" width="416" height="150" rx="8" fill="#ffffff" stroke="#d9d4cb"/>
<text x="476" y="62" font-size="10" fill="#8a8478">2 · picked ·tmdb — the pick is the confirm</text>
<path d="M484 78 v8 m-3 -3 l3 3 l3 -3 M480 90 h8" stroke="#2f6fed" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="500" y="88" font-size="11" font-weight="600" fill="#6b655b">Poster</text>
<text x="540" y="88" font-size="9" fill="#2f6fed">·tmdb</text>
<text x="568" y="88" font-size="9" fill="#8a8478">→ cover.jpg</text>
<rect x="500" y="98" width="52" height="74" rx="4" fill="#f7f5f1" stroke="#c9c3b8"/>
<path d="M512 140 l8 -10 l8 10 M528 126 l6 -6 l8 8" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
<circle cx="506" cy="184" r="3.5" fill="none" stroke="#6b655b" stroke-width="1.4"/>
<text x="513" y="187" font-size="10" fill="#6b655b">·file</text>
<rect x="568" y="98" width="52" height="74" rx="4" fill="#e9f0ff" stroke="#2f6fed" stroke-width="2"/>
<path d="M580 140 l8 -10 l8 10 M596 126 l6 -6 l8 8" stroke="#2f6fed" stroke-width="1.5" fill="none"/>
<circle cx="574" cy="184" r="3.5" fill="#2f6fed"/>
<text x="581" y="187" font-size="10" fill="#2f6fed">·tmdb</text>
<text x="666" y="120" font-size="10" fill="#8a8478">Write: decision provider:tmdb,</text>
<text x="666" y="134" font-size="10" fill="#8a8478">then download + embed cover.jpg</text>
<text x="666" y="160" font-size="10" fill="#8a8478">Footer: Write 1 field to file</text>

<!-- ===== 3 written (ledger witness) ===== -->
<rect x="24" y="214" width="416" height="96" rx="8" fill="#ffffff" stroke="#d9d4cb"/>
<text x="40" y="232" font-size="10" fill="#8a8478">3 · next open, after one Write — the ledger witnesses the URL (ADR-101)</text>
<path d="M43 252 h10 M43 257 h10" stroke="#8a8478" stroke-width="1.6"/>
<text x="64" y="258" font-size="11" font-weight="600" fill="#6b655b">Poster</text>
<text x="104" y="258" font-size="9" fill="#2f6fed">·tmdb</text>
<text x="132" y="258" font-size="9" fill="#8a8478">→ cover.jpg</text>
<text x="408" y="258" font-size="10" fill="#6b655b" text-anchor="end" text-decoration="underline">change</text>
<rect x="64" y="266" width="24" height="34" rx="3" fill="#e9f0ff" stroke="#2f6fed"/>
<text x="96" y="286" font-size="10" fill="#1d1a16">tmdb poster <tspan fill="#8a8478">— matches the file</tspan></text>

<!-- ===== 4 upload present ===== -->
<rect x="460" y="214" width="416" height="150" rx="8" fill="#ffffff" stroke="#d9d4cb"/>
<text x="476" y="232" font-size="10" fill="#8a8478">4 · an owner upload is on the page (ADR-049)</text>
<circle cx="484" cy="254" r="5" fill="none" stroke="#8a8478" stroke-width="1.4"/>
<text x="500" y="258" font-size="11" font-weight="600" fill="#6b655b">Poster</text>
<text x="540" y="258" font-size="9" fill="#2f6fed">·tmdb</text>
<text x="568" y="258" font-size="9" fill="#8a8478">→ cover.jpg</text>
<rect x="500" y="268" width="52" height="74" rx="4" fill="#f7f5f1" stroke="#c9c3b8" stroke-dasharray="3 2"/>
<text x="526" y="302" font-size="8" fill="#8a8478" text-anchor="middle">cover art</text>
<text x="526" y="312" font-size="8" fill="#8a8478" text-anchor="middle">in file</text>
<circle cx="506" cy="354" r="3.5" fill="none" stroke="#6b655b" stroke-width="1.4"/>
<text x="513" y="357" font-size="10" fill="#6b655b">·file</text>
<rect x="568" y="268" width="52" height="74" rx="4" fill="#e9f0ff" stroke="#2f6fed" stroke-width="2" stroke-dasharray="4 2"/>
<path d="M580 310 l8 -10 l8 10 M596 296 l6 -6 l8 8" stroke="#2f6fed" stroke-width="1.5" fill="none"/>
<circle cx="574" cy="354" r="3.5" fill="none" stroke="#2f6fed" stroke-width="1.6"/>
<text x="581" y="357" font-size="10" fill="#2f6fed">·tmdb, pending</text>
<text x="666" y="286" font-size="10" fill="#8a8478">Your uploaded poster stays on</text>
<text x="666" y="300" font-size="10" fill="#8a8478">the page; this row is the cover</text>
<text x="666" y="314" font-size="10" fill="#8a8478">art inside the file.</text>
<text x="666" y="340" font-size="10" fill="#8a8478">(upload overwrote the extracted</text>
<text x="666" y="354" font-size="10" fill="#8a8478">tier on disk — nothing to show)</text>

<!-- legend -->
<text x="24" y="392" font-size="10" fill="#8a8478">Tiles are the chooser: one per candidate (·file, each provider), no Custom (a pasted URL cannot pass the asset-host allowlist, ADR-039).</text>
<text x="24" y="406" font-size="10" fill="#8a8478">Accent border + filled dot = staged pick · dashed = RD6 pending (undecided). Gutter: ○ undecided · ↧ will write · = matches (ledger) · cylinder = decision only (·file pick).</text>
<text x="24" y="420" font-size="10" fill="#8a8478">Tiles are 56×80 (2:3), the same box HOLODEX-245's comparison used; keyboard = roving radiogroup, arrows move and stage.</text>
<text x="24" y="446" font-size="9" fill="#a39d92">Schematic — colours are illustrative; the component uses tokens only (bg-surface, text-ink, text-muted, border-rule, accent). QA all three skins.</text>
</svg>
