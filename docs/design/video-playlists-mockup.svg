<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-labelledby="t d">
  <title id="t">Video playlists (F69): the /playlists list, the playlist page, the detail rail's Playlists row with the Add-to-playlist picker, two placements for Save as playlist on the browse page, and the next-up strip under the player in its three states</title>
  <desc id="d">Five panels drawn in Cinémathèque tokens. 1: the Playlists list page with a new nav item, a New playlist action, three row cards showing name, visibility chip and count, and the visitor empty state. 2: a playlist page with the name and rename pencil, count and sort, a Private/Public segmented toggle, a solid Play all primary action, video tiles with an owner-only remove control on hover, and a quiet Delete playlist at the bottom. 3: the video detail rail gains a PLAYLISTS row that mirrors the TAGS row — member playlists as chips and a + Add to playlist button — and the picker it opens: a list with member checkmarks and a New playlist row that expands into a name input with Create and add. 4: option A places Save as playlist in the browse toolbar beside Clear filters and expands into an inline name form; option B places it as a link in the result-count line. 5: the next-up strip under the player in three states — playing from a playlist with previous, the next item's thumbnail and title, and next; last item with Play from start; current item not in the playlist — plus Chrome's Picture-in-Picture window showing the previous and next buttons that the Media Session handlers provide.</desc>
