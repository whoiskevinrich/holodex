<text x="20" y="600" font-size="11" fill="#9b9082">Decisions: D1 per-row + Dismiss all N · D2 dismissed runs leave the callout and the Errors count · D3 no confirm · D4 job_run_dismissals table, job_runs immutable</text>
<text x="20" y="618" font-size="11" fill="#9b9082">D5 muted error badge + · dismissed when the newest run is a dismissed error (rejected: badge stays warn; badge follows newest undismissed run — an old ok standing in for a failure).</text>
<text x="20" y="636" font-size="11" fill="#9b9082">Not in v1: undo, Log filter, auto-dismiss on next success. Owner-only; visitors see today's callout with server-side-excluded counts.</text>
