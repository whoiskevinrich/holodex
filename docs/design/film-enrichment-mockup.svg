<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Film provider enrichment — header, Details chips, and the cast difference</title>
  <desc>Three panels. One: the film detail header carrying both a 16:9 banner and the 2:3 poster, with a legibility scrim. Two: the Details section gaining the reused provider chip. Three: the cast section rendering the scene union followed only by billed names that appear in no owned scene.</desc>

  <rect width="900" height="820" fill="#0c0a09"/>

  <!-- ─────────── 1. Header: banner + poster ─────────── -->
  <text x="30" y="30" fill="#e8a33d" font-size="11" letter-spacing="1.2">1 — HEADER: BANNER BEHIND THE EXISTING POSTER ROW (D4)</text>
  <rect x="30" y="42" width="520" height="252" rx="10" fill="#15110e" stroke="#2a2622" stroke-width="1"/>

  <!-- banner band, 8:3 -->
  <rect x="42" y="54" width="496" height="130" rx="6" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="290" y="106" fill="#9b9082" font-size="11" text-anchor="middle" letter-spacing="1.2">BANNER · 16:9 SOURCE, 8:3 SLOT · TMDB</text>
  <!-- legibility scrim over the lower band -->
  <rect x="42" y="124" width="496" height="60" fill="#0c0a09" opacity="0.55"/>
  <!-- owner overlay control -->
  <rect x="512" y="62" width="18" height="18" rx="4" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="521" y="75" fill="#9b9082" font-size="10" text-anchor="middle">✎</text>

  <!-- poster, 2:3, overlapping the banner -->
  <rect x="60" y="124" width="74" height="111" rx="6" fill="#15110e" stroke="#2a2622" stroke-width="1.5"/>
  <text x="97" y="176" fill="#9b9082" font-size="10" text-anchor="middle">POSTER</text>
  <text x="97" y="190" fill="#9b9082" font-size="10" text-anchor="middle">2:3</text>
  <rect x="112" y="130" width="16" height="16" rx="4" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="120" y="142" fill="#9b9082" font-size="9" text-anchor="middle">✎</text>

  <text x="148" y="206" fill="#f3ece1" font-size="18" font-weight="600" font-family="'Fraunces Variable', serif">The Matrix</text>
  <text x="148" y="226" fill="#9b9082" font-size="11">1999</text>

  <rect x="148" y="240" width="118" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="207" y="257" fill="#f3ece1" font-size="11" text-anchor="middle">Warner Bros.</text>
  <rect x="274" y="244" width="18" height="18" rx="4" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="283" y="257" fill="#9b9082" font-size="10" text-anchor="middle">✎</text>

  <circle cx="502" cy="164" r="10" fill="#181310" stroke="#e8a33d" stroke-width="1"/>
  <text x="502" y="168" fill="#e8a33d" font-size="11" text-anchor="middle">1</text>

  <!-- ─────────── 2. Details section + provider chip ─────────── -->
  <text x="580" y="30" fill="#e8a33d" font-size="11" letter-spacing="1.2">2 — DETAILS (D5)</text>
  <rect x="580" y="42" width="290" height="252" rx="10" fill="#15110e" stroke="#2a2622" stroke-width="1"/>

  <text x="594" y="70" fill="#9b9082" font-size="11" letter-spacing="1.2">DETAILS</text>
  <rect x="744" y="56" width="112" height="24" rx="12" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <rect x="753" y="62" width="13" height="13" rx="3" fill="#e8a33d"/>
  <text x="789" y="72" fill="#f3ece1" font-size="10.5" text-anchor="middle">TMDB</text>
  <text x="831" y="72" fill="#e8a33d" font-size="10.5" text-anchor="middle">Enrich</text>

  <text x="594" y="100" fill="#9b9082" font-size="10.5">Description</text>
  <text x="594" y="118" fill="#f3ece1" font-size="12">A computer hacker learns the true…</text>
  <text x="594" y="132" fill="#e8a33d" font-size="9">TMDB</text>

  <text x="594" y="158" fill="#9b9082" font-size="10.5">Release date</text>
  <text x="594" y="176" fill="#f3ece1" font-size="12">1999-03-31</text>
  <text x="594" y="190" fill="#e8a33d" font-size="9">TMDB</text>

  <text x="594" y="216" fill="#9b9082" font-size="10.5">Year — identity, collision-checked</text>
  <text x="594" y="234" fill="#f3ece1" font-size="12">1999</text>

  <line x1="594" y1="252" x2="856" y2="252" stroke="#2a2622" stroke-width="1"/>
  <text x="594" y="270" fill="#9b9082" font-size="10">Title stays read-only — the other half of</text>
  <text x="594" y="284" fill="#9b9082" font-size="10">UNIQUE(name, year). See D3.</text>

  <circle cx="722" cy="68" r="10" fill="#181310" stroke="#e8a33d" stroke-width="1"/>
  <text x="722" y="72" fill="#e8a33d" font-size="11" text-anchor="middle">2</text>

  <!-- ─────────── 3. Cast: union, then the difference ─────────── -->
  <text x="30" y="326" fill="#e8a33d" font-size="11" letter-spacing="1.2">3 — CAST: THE SCENE UNION, THEN ONLY THE DIFFERENCE (D2)</text>
  <rect x="30" y="340" width="840" height="250" rx="10" fill="#15110e" stroke="#2a2622" stroke-width="1"/>

  <text x="44" y="368" fill="#9b9082" font-size="11" letter-spacing="1.2">CAST</text>
  <text x="856" y="368" fill="#9b9082" font-size="11" text-anchor="end">Your scenes cover 10 of 14 billed cast</text>

  <!-- union chips, row 1 -->
  <rect x="44" y="384" width="104" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="96" y="401" fill="#f3ece1" font-size="11.5" text-anchor="middle">Keanu Reeves</text>
  <rect x="156" y="384" width="126" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="219" y="401" fill="#f3ece1" font-size="11.5" text-anchor="middle">Carrie-Anne Moss</text>
  <rect x="290" y="384" width="140" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="360" y="401" fill="#f3ece1" font-size="11.5" text-anchor="middle">Laurence Fishburne</text>
  <rect x="438" y="384" width="108" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="492" y="401" fill="#f3ece1" font-size="11.5" text-anchor="middle">Hugo Weaving</text>
  <rect x="554" y="384" width="114" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="611" y="401" fill="#f3ece1" font-size="11.5" text-anchor="middle">Joe Pantoliano</text>

  <!-- union chips, row 2 -->
  <rect x="44" y="418" width="106" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="97" y="435" fill="#f3ece1" font-size="11.5" text-anchor="middle">Gloria Foster</text>
  <rect x="158" y="418" width="112" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="214" y="435" fill="#f3ece1" font-size="11.5" text-anchor="middle">Marcus Chong</text>
  <rect x="278" y="418" width="122" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="339" y="435" fill="#f3ece1" font-size="11.5" text-anchor="middle">Julian Arahanga</text>
  <rect x="408" y="418" width="96" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="456" y="435" fill="#f3ece1" font-size="11.5" text-anchor="middle">Matt Doran</text>
  <rect x="512" y="418" width="122" height="26" rx="13" fill="#181310" stroke="#2a2622" stroke-width="1"/>
  <text x="573" y="435" fill="#f3ece1" font-size="11.5" text-anchor="middle">Belinda McClory</text>

  <line x1="44" y1="470" x2="856" y2="470" stroke="#2a2622" stroke-width="1"/>

  <text x="44" y="494" fill="#e8a33d" font-size="11" letter-spacing="1.2">BILLED ON THE RELEASE — IN NO SCENE YOU OWN</text>
  <text x="856" y="494" fill="#9b9082" font-size="10" text-anchor="end">film_people_roles minus the union</text>

  <rect x="44" y="506" width="134" height="26" rx="13" fill="#181310" stroke="#e8a33d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="111" y="523" fill="#e8a33d" font-size="11.5" text-anchor="middle">Anthony Ray Parker</text>
  <rect x="186" y="506" width="104" height="26" rx="13" fill="#181310" stroke="#e8a33d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="238" y="523" fill="#e8a33d" font-size="11.5" text-anchor="middle">Paul Goddard</text>
  <rect x="298" y="506" width="110" height="26" rx="13" fill="#181310" stroke="#e8a33d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="353" y="523" fill="#e8a33d" font-size="11.5" text-anchor="middle">Robert Taylor</text>
  <rect x="416" y="506" width="100" height="26" rx="13" fill="#181310" stroke="#e8a33d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="466" y="523" fill="#e8a33d" font-size="11.5" text-anchor="middle">David Aston</text>

  <text x="44" y="562" fill="#9b9082" font-size="11">10 names appear in both sources. They render once, in Cast — never twice.</text>

  <circle cx="836" cy="518" r="10" fill="#181310" stroke="#e8a33d" stroke-width="1"/>
  <text x="836" y="522" fill="#e8a33d" font-size="11" text-anchor="middle">3</text>

  <!-- ─────────── Notes ─────────── -->
  <rect x="30" y="612" width="3" height="168" fill="#e8a33d"/>
  <rect x="33" y="612" width="837" height="168" fill="#181310"/>

  <circle cx="56" cy="638" r="10" fill="#0c0a09" stroke="#e8a33d" stroke-width="1"/>
  <text x="56" y="642" fill="#e8a33d" font-size="11" text-anchor="middle">1</text>
  <text x="78" y="634" fill="#f3ece1" font-size="12">The banner reuses the contract's existing 16:9 banner kind — no new asset kind, no migration.</text>
  <text x="78" y="650" fill="#9b9082" font-size="11">It replaces thumb, which lost its last consumer in PR #292 and which no provider ever emitted.</text>

  <circle cx="56" cy="692" r="10" fill="#0c0a09" stroke="#e8a33d" stroke-width="1"/>
  <text x="56" y="696" fill="#e8a33d" font-size="11" text-anchor="middle">2</text>
  <text x="78" y="688" fill="#f3ece1" font-size="12">EnrichProviderChips and EnrichPicker are reused unmodified.</text>
  <text x="78" y="704" fill="#9b9082" font-size="11">They take no entity id and no entity kind — the page injects resolve, apply and dismiss closures.</text>

  <circle cx="56" cy="746" r="10" fill="#0c0a09" stroke="#e8a33d" stroke-width="1"/>
  <text x="56" y="750" fill="#e8a33d" font-size="11" text-anchor="middle">3</text>
  <text x="78" y="742" fill="#f3ece1" font-size="12">Only the non-overlapping billed names render below the union.</text>
  <text x="78" y="758" fill="#9b9082" font-size="11">Two full lists would be roughly half duplicates; the difference is the only rendering that adds information.</text>

  <text x="30" y="802" fill="#9b9082" font-size="10">HOLODEX-308 · ADR-089 · docs/design/film-enrichment-handoff.md</text>
  <text x="870" y="802" fill="#9b9082" font-size="10" text-anchor="end">Skin shown: Cinémathèque.</text>
</svg>
