<svg viewBox="0 0 960 1500" xmlns="http://www.w3.org/2000/svg" font-family="'Archivo Variable', sans-serif">
  <defs>
    <style>
      .bg { fill: #0c0a09; }
      .panel { fill: #15110e; stroke: #2a2622; stroke-width: 1; }
      .field { fill: #15110e; stroke: #2a2622; stroke-width: 1; }
      .rowActive { fill: #1c1714; }
      .rowBar { fill: #e8a33d; }
      .rule { stroke: #2a2622; stroke-width: 1; fill: none; }
      .ink { fill: #f3ece1; }
      .muted { fill: #9b9082; }
      .accent { fill: #e8a33d; }
      .accentMark { stroke: #e8a33d; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .label { font-size: 11px; letter-spacing: 0.06em; }
      .title { font-family: 'Fraunces Variable', serif; }
      .xs { font-size: 12px; }
      .sm { font-size: 14px; }
      .dotted { text-decoration: underline dotted; }
    </style>
  </defs>

  <rect class="bg" width="960" height="1500" />

  <text x="24" y="34" class="title ink" font-size="17">Enrich picker &#8212; revealable candidate detail from /resolve candidates[].detail</text>
  <text x="24" y="54" class="muted xs">Skin 1 (Cin&#233;math&#232;que). Gold dashed outline marks what this change adds. HOLODEX-380 / F61 FR3&#8211;FR5.</text>

  <!-- ===== 1. NO COLLISION: EVERY ROW COLLAPSED, ONE NEW CONTROL PER ROW ===== -->
  <text x="24" y="92" class="label muted">1 &#183; DISTINCT LABELS &#8212; COLLAPSED BY DEFAULT (ROW HEIGHT UNCHANGED, ONE TEXT TOGGLE ADDED)</text>
  <rect x="24" y="104" width="560" height="300" class="panel" rx="2" />
  <text x="40" y="132" class="title ink" font-size="17">Enrich from acme</text>
  <text x="562" y="131" class="muted sm">&#10005;</text>
  <rect x="40" y="146" width="528" height="30" class="field" rx="2" />
  <text x="52" y="166" class="ink sm">Harbor Lights 2023</text>
  <text x="40" y="196" class="muted xs">3 matches for "Harbor Lights 2023".</text>
  <text x="40" y="214" class="xs"><tspan class="muted">Searched</tspan><tspan class="ink" dx="6">Harbor Lights 2023</tspan></text>

  <!-- row 1 (active) -->
  <rect x="40" y="226" width="528" height="52" class="rowActive" rx="2" />
  <rect x="40" y="226" width="2" height="52" class="rowBar" />
  <text x="52" y="243" class="ink sm">Harbor Lights</text>
  <text x="556" y="243" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="257" class="muted xs">Outlet B &#8250; Network X &#183; 2023-04-11 &#183; J. Doe, R. Roe</text>
  <text x="52" y="271" class="accent xs">view source &#8599;</text>
  <rect x="140" y="260" width="48" height="15" class="accentMark" rx="2" />
  <text x="144" y="271" class="muted xs dotted">details</text>
  <!-- row 2 -->
  <text x="52" y="299" class="ink sm">Harbor Lights II</text>
  <text x="556" y="299" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="313" class="muted xs">Outlet B &#8250; Network X &#183; 2024-02-02 &#183; J. Doe</text>
  <text x="52" y="327" class="accent xs">view source &#8599;</text>
  <text x="144" y="327" class="muted xs dotted">details</text>
  <!-- row 3 -->
  <text x="52" y="355" class="ink sm">Harbor Nights</text>
  <text x="556" y="355" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="369" class="muted xs">Outlet A &#183; 2019-09-30 &#183; R. Roe</text>
  <text x="52" y="383" class="accent xs">view source &#8599;</text>
  <text x="144" y="383" class="muted xs dotted">details</text>

  <text x="600" y="243" class="muted xs">&#8592; same .btn-quiet dotted-underline toggle as</text>
  <text x="600" y="259" class="muted xs">   "+N more" on the Searched caption. No icon.</text>
  <text x="600" y="283" class="muted xs">Row height is identical to a row with no</text>
  <text x="600" y="299" class="muted xs">detail &#8212; the toggle sits on the actions line</text>
  <text x="600" y="315" class="muted xs">that view source &#8599; already occupies.</text>
  <text x="600" y="339" class="muted xs">A candidate with no detail shows no toggle;</text>
  <text x="600" y="355" class="muted xs">nothing else on the row changes.</text>

  <!-- ===== 2. OWNER TOGGLES ONE ROW ===== -->
  <text x="24" y="440" class="label muted">2 &#183; OWNER OPENS ONE ROW &#8212; LINES EXPAND INLINE BENEATH IT, VERBATIM, ONE PER ENTRY</text>
  <rect x="24" y="452" width="560" height="358" class="panel" rx="2" />
  <text x="40" y="480" class="title ink" font-size="17">Enrich from acme</text>
  <text x="562" y="479" class="muted sm">&#10005;</text>
  <rect x="40" y="494" width="528" height="30" class="field" rx="2" />
  <text x="52" y="514" class="ink sm">Harbor Lights 2023</text>
  <text x="40" y="544" class="muted xs">3 matches for "Harbor Lights 2023".</text>
  <text x="40" y="562" class="xs"><tspan class="muted">Searched</tspan><tspan class="ink" dx="6">Harbor Lights 2023</tspan></text>

  <!-- row 1 -->
  <text x="52" y="591" class="ink sm">Harbor Lights</text>
  <text x="556" y="591" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="605" class="muted xs">Outlet B &#8250; Network X &#183; 2023-04-11 &#183; J. Doe, R. Roe</text>
  <text x="52" y="619" class="accent xs">view source &#8599;</text>
  <text x="144" y="619" class="muted xs dotted">details</text>
  <!-- row 2 (active, expanded) -->
  <rect x="40" y="630" width="528" height="110" class="rowActive" rx="2" />
  <rect x="40" y="630" width="2" height="110" class="rowBar" />
  <text x="52" y="647" class="ink sm">Harbor Lights II</text>
  <text x="556" y="647" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="661" class="muted xs">Outlet B &#8250; Network X &#183; 2024-02-02 &#183; J. Doe</text>
  <text x="52" y="675" class="accent xs">view source &#8599;</text>
  <text x="144" y="675" class="ink xs dotted">hide details</text>
  <rect x="48" y="682" width="512" height="54" class="accentMark" rx="2" />
  <line x1="56" y1="688" x2="56" y2="732" class="rule" />
  <text x="66" y="698" class="muted xs">Studio: Outlet B &#8250; Network X</text>
  <text x="66" y="714" class="muted xs">Record: 28 tags &#183; synopsis &#183; 3 images</text>
  <text x="66" y="730" class="muted xs">Id: acme:video:7f3a&#8230;</text>
  <!-- row 3 -->
  <text x="52" y="761" class="ink sm">Harbor Nights</text>
  <text x="556" y="761" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="775" class="muted xs">Outlet A &#183; 2019-09-30 &#183; R. Roe</text>
  <text x="52" y="789" class="accent xs">view source &#8599;</text>
  <text x="144" y="789" class="muted xs dotted">details</text>

  <text x="600" y="647" class="muted xs">&#8592; label flips to "hide details" and reads</text>
  <text x="600" y="663" class="muted xs">   in ink while open; aria-expanded=true.</text>
  <text x="600" y="687" class="muted xs">Lines: text-xs text-muted, one &lt;li&gt; per entry,</text>
  <text x="600" y="703" class="muted xs">verbatim (no Key: parsing), truncate + title=</text>
  <text x="600" y="719" class="muted xs">for the 256-char worst case, border-l border-rule</text>
  <text x="600" y="735" class="muted xs">as the visual indent. The row grows; nothing floats.</text>
  <text x="600" y="759" class="muted xs">Toggling never confirms the row (stopPropagation,</text>
  <text x="600" y="775" class="muted xs">same as view source &#8599;). Row Enter still confirms.</text>

  <!-- ===== 3. LABEL COLLISION: AUTO-EXPANDED ===== -->
  <text x="24" y="846" class="label muted">3 &#183; LABEL COLLISION &#8212; THE CASE IT EXISTS FOR: EVERY SAME-LABEL ROW OPENS BY DEFAULT</text>
  <rect x="24" y="858" width="560" height="482" class="panel" rx="2" />
  <text x="40" y="886" class="title ink" font-size="17">Enrich from acme</text>
  <text x="562" y="885" class="muted sm">&#10005;</text>
  <rect x="40" y="900" width="528" height="30" class="field" rx="2" />
  <text x="52" y="920" class="ink sm">Harbor Lights 2023</text>
  <text x="40" y="950" class="muted xs">4 matches for "Harbor Lights 2023".</text>
  <text x="40" y="968" class="xs"><tspan class="muted">Searched</tspan><tspan class="ink" dx="6">Harbor Lights 2023</tspan></text>

  <!-- row 1 (active, auto-expanded) -->
  <rect x="40" y="980" width="528" height="94" class="rowActive" rx="2" />
  <rect x="40" y="980" width="2" height="94" class="rowBar" />
  <text x="52" y="997" class="ink sm">Harbor Lights</text>
  <text x="556" y="997" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="1011" class="muted xs">Outlet B &#8250; Network X &#183; 2023-04-11 &#183; J. Doe, R. Roe</text>
  <text x="52" y="1025" class="accent xs">view source &#8599;</text>
  <text x="144" y="1025" class="ink xs dotted">hide details</text>
  <line x1="56" y1="1036" x2="56" y2="1066" class="rule" />
  <text x="66" y="1046" class="muted xs">Studio: Outlet B &#8250; Network X</text>
  <text x="66" y="1062" class="muted xs">Record: 28 tags &#183; synopsis &#183; 3 images</text>
  <!-- row 2 (auto-expanded) -->
  <text x="52" y="1095" class="ink sm">Harbor Lights</text>
  <text x="556" y="1095" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="1109" class="muted xs">Outlet A &#183; 2023-04-11 &#183; J. Doe, R. Roe</text>
  <text x="52" y="1123" class="accent xs">view source &#8599;</text>
  <text x="144" y="1123" class="ink xs dotted">hide details</text>
  <line x1="56" y1="1134" x2="56" y2="1164" class="rule" />
  <text x="66" y="1144" class="muted xs">Studio: Outlet A</text>
  <text x="66" y="1160" class="muted xs">Record: 16 tags &#183; synopsis &#183; 1 image</text>
  <!-- row 3 (auto-expanded) -->
  <text x="52" y="1193" class="ink sm">Harbor Lights</text>
  <text x="556" y="1193" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="1207" class="muted xs">Outlet C &#8250; Network Y &#183; 2023-04-11 &#183; J. Doe, R. Roe</text>
  <text x="52" y="1221" class="accent xs">view source &#8599;</text>
  <text x="144" y="1221" class="ink xs dotted">hide details</text>
  <line x1="56" y1="1232" x2="56" y2="1262" class="rule" />
  <text x="66" y="1242" class="muted xs">Studio: Outlet C &#8250; Network Y</text>
  <text x="66" y="1258" class="muted xs">Record: 18 tags &#183; synopsis &#183; 2 images</text>
  <!-- row 4 (outside the collision group, collapsed) -->
  <text x="52" y="1291" class="ink sm">Harbor Lights II</text>
  <text x="556" y="1291" class="muted xs" text-anchor="end">Possible match</text>
  <text x="52" y="1305" class="muted xs">Outlet B &#8250; Network X &#183; 2024-02-02 &#183; J. Doe</text>
  <text x="52" y="1319" class="accent xs">view source &#8599;</text>
  <text x="144" y="1319" class="muted xs dotted">details</text>
  <rect x="36" y="976" width="536" height="290" class="accentMark" rx="2" />

  <text x="600" y="997" class="muted xs">&#8592; three rows share the normalized label</text>
  <text x="600" y="1013" class="muted xs">   "harbor lights" &#8594; each opens on first render.</text>
  <text x="600" y="1037" class="muted xs">"Harbor Lights II" is outside the group and</text>
  <text x="600" y="1053" class="muted xs">stays collapsed. Each toggle still works; the</text>
  <text x="600" y="1069" class="muted xs">owner can close a row they've ruled out.</text>
  <text x="600" y="1093" class="muted xs">This is what the field exists for: the owner is</text>
  <text x="600" y="1109" class="muted xs">choosing which record to bind, not which video.</text>
  <text x="600" y="1133" class="muted xs">The Record: line is the tie-break the provider</text>
  <text x="600" y="1149" class="muted xs">already sorts by, made visible.</text>

  <!-- ===== 4. UNATTENDED PATH: ACTIVITY DETAIL ROW ===== -->
  <text x="24" y="1382" class="label muted">4 &#183; UNATTENDED REFRESH-ALL &#8212; ACTIVITY DETAIL ROW (NO NEW MARKUP; ONE MORE SEGMENT ON THE EXISTING LINE)</text>
  <rect x="24" y="1394" width="912" height="66" class="panel" rx="2" />
  <text x="40" y="1418" class="ink sm">enrich &#183; 2026-09-13 14:02 &#183; 0.8 s</text>
  <text x="40" y="1440" class="muted xs">acme &#8594; video #4120 (1 candidates) &#183; searched: Harbor Lights 2023</text>
  <rect x="428" y="1428" width="500" height="18" class="accentMark" rx="2" />
  <text x="434" y="1440" class="muted xs">&#183; applied: Harbor Lights &#8212; Studio: Outlet B &#8250; Network X &#183; Record: 28 tags &#183; synopsis &#183; 3 images</text>
  <text x="24" y="1484" class="muted xs">Written only when a lone strong candidate auto-applied and carried detail; needs_review / no_candidates add nothing. No file path can appear (provider text, sanitized).</text>
</svg>
