<svg viewBox="0 0 960 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Archivo Variable', sans-serif">
  <defs>
    <style>
      .bg { fill: #0c0a09; }
      .rule { stroke: #2a2622; stroke-width: 1; fill: none; }
      .ink { fill: #f3ece1; }
      .muted { fill: #9b9082; }
      .accent { fill: #e8a33d; }
      .accentPlate { fill: #181310; stroke: #e8a33d; stroke-width: 1.5; }
      .warnStroke { stroke: #e2603f; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .gone { stroke: #2a2622; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .label { font-size: 11px; letter-spacing: 0.06em; }
      .title { font-family: 'Fraunces Variable', serif; }
    </style>
  </defs>

  <rect class="bg" width="960" height="1000" />
  <text x="24" y="34" class="title ink" font-size="17">Media detail &#8212; Metadata moved up, trimmed, and folded</text>
  <text x="24" y="54" class="muted" font-size="12">Skin 1 (default). Accent outline marks what this change adds or moves.</text>
  <text x="24" y="92" class="label muted" font-size="11">BEFORE</text>
  <text x="320" y="92" class="label muted" font-size="11">AFTER</text>
  <rect x="24" y="104" width="272" height="346" rx="8" fill="#15110e" class="rule" />
  <rect x="320" y="104" width="336" height="376" rx="8" fill="#15110e" class="rule" />
  <text x="44" y="131" class="muted" font-size="12">Video player</text>
  <text x="44" y="161" class="muted" font-size="12">Title + meta line</text>
  <text x="44" y="191" class="muted" font-size="12">Studio</text>
  <text x="44" y="221" class="muted" font-size="12">Tags</text>
  <rect x="34" y="234" width="252" height="26" rx="4" fill="#15110e" class="rule" />
  <text x="44" y="251" class="ink" font-size="12">Films + People</text>
  <text x="44" y="281" class="muted" font-size="12">More with &#8230;</text>
  <text x="44" y="311" class="muted" font-size="12">Manage</text>
  <rect x="34" y="324" width="252" height="26" rx="4" fill="#15110e" class="rule" />
  <text x="44" y="341" class="ink" font-size="12">Metadata</text>
  <text x="44" y="371" class="muted" font-size="12">File</text>
  <text x="44" y="401" class="muted" font-size="12">Completeness</text>
  <text x="44" y="431" class="muted" font-size="12">Enrichment data</text>
  <text x="340" y="131" class="muted" font-size="12">Video player</text>
  <text x="340" y="161" class="muted" font-size="12">Title + meta line</text>
  <rect x="330" y="174" width="316" height="26" rx="4" class="accentPlate" />
  <text x="340" y="191" class="accent" font-size="12">Overview &#8212; moved out of Metadata</text>
  <text x="340" y="221" class="muted" font-size="12">Studio</text>
  <text x="340" y="251" class="muted" font-size="12">Tags</text>
  <rect x="330" y="264" width="316" height="26" rx="4" fill="#15110e" class="rule" />
  <text x="340" y="281" class="ink" font-size="12">Films + People</text>
  <rect x="330" y="294" width="316" height="26" rx="4" class="accentPlate" />
  <text x="340" y="311" class="accent" font-size="12">Metadata &#8212; moved up, collapsible</text>
  <text x="340" y="341" class="muted" font-size="12">More with &#8230;</text>
  <text x="340" y="371" class="muted" font-size="12">Manage</text>
  <text x="340" y="401" class="muted" font-size="12">File</text>
  <text x="340" y="431" class="muted" font-size="12">Completeness</text>
  <text x="340" y="461" class="muted" font-size="12">Enrichment data</text>
  <text x="680" y="128" class="label muted" font-size="11">WHAT MOVED</text>
  <text x="680" y="150" class="muted" font-size="12">Metadata now sits directly under Films + People,</text>
  <text x="680" y="168" class="muted" font-size="12">above the More-with shelves &#8212; all field curation</text>
  <text x="680" y="186" class="muted" font-size="12">is above the "related content" rails.</text>
  <text x="680" y="222" class="muted" font-size="12">Overview leaves the Metadata list for the header,</text>
  <text x="680" y="240" class="muted" font-size="12">where a synopsis reads as page content rather</text>
  <text x="680" y="258" class="muted" font-size="12">than a data-management row. It is the only one of</text>
  <text x="680" y="276" class="muted" font-size="12">the four removed fields that had nowhere else to go.</text>
  <text x="680" y="312" class="muted" font-size="12">Manage / File / Completeness / Enrichment keep</text>
  <text x="680" y="330" class="muted" font-size="12">their relative order; only Metadata jumped past</text>
  <text x="680" y="348" class="muted" font-size="12">them.</text>
  <text x="24" y="520" class="label muted" font-size="11">METADATA &#8212; COLLAPSED (RESTING STATE)</text>
  <rect x="24" y="534" width="632" height="52" rx="8" fill="#15110e" class="rule" />
  <text x="40" y="564" class="label muted" font-size="11">METADATA</text>
  <text x="112" y="564" class="muted" font-size="12">8 fields</text>
  <text x="300" y="564" class="muted" font-size="11">Refresh</text>
  <text x="352" y="564" class="muted" font-size="11">Extract from filename</text>
  <rect x="472" y="550" width="42" height="18" rx="4" fill="#181310" class="rule" />
  <text x="479" y="563" class="muted" font-size="11">tmdb</text>
  <text x="522" y="564" class="muted" font-size="11">Write decisions</text>
  <rect x="616" y="547" width="26" height="26" rx="4" class="accentPlate" />
  <path d="M623 557 l6 6 l6 -6" stroke="#e8a33d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="24" y="604" class="muted" font-size="12">The field count is the always-visible summary, the way the score is for Completeness. Refresh / Extract /</text>
  <text x="24" y="622" class="muted" font-size="12">provider chips / writeback stay outside the fold, and so does the extraction review panel.</text>
  <text x="24" y="648" class="label muted" font-size="11">METADATA &#8212; EXPANDED</text>
  <rect x="24" y="662" width="632" height="176" rx="8" fill="#15110e" class="rule" />
  <text x="40" y="692" class="label muted" font-size="11">METADATA</text>
  <text x="112" y="692" class="muted" font-size="12">8 fields</text>
  <rect x="616" y="675" width="26" height="26" rx="4" class="accentPlate" />
  <path d="M623 691 l6 -6 l6 6" stroke="#e8a33d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="40" y="708" width="600" height="116" rx="6" fill="#181310" class="rule" />
  <text x="56" y="730" class="muted" font-size="12">Tagline:</text>
  <text x="152" y="730" class="ink" font-size="12">It begins.</text>
  <text x="356" y="730" class="muted" font-size="12">Released:</text>
  <text x="452" y="730" class="ink" font-size="12">2021-09-15</text>
  <text x="56" y="756" class="muted" font-size="12">Runtime (min):</text>
  <text x="152" y="756" class="ink" font-size="12">155</text>
  <text x="356" y="756" class="muted" font-size="12">Status:</text>
  <text x="452" y="756" class="ink" font-size="12">Released</text>
  <text x="56" y="782" class="muted" font-size="12">Language:</text>
  <text x="152" y="782" class="ink" font-size="12">en</text>
  <text x="356" y="782" class="muted" font-size="12">Director:</text>
  <text x="452" y="782" class="ink" font-size="12">Denis Villeneuve</text>
  <text x="56" y="808" class="muted" font-size="12">Website:</text>
  <text x="152" y="808" class="ink" font-size="12">dunemovie.com</text>
  <text x="356" y="808" class="muted" font-size="12">External ID:</text>
  <text x="452" y="808" class="ink" font-size="12">tmdb:438631</text>
  <text x="680" y="534" class="label muted" font-size="11">REMOVED FROM THE LIST</text>
  <rect x="680" y="550" width="256" height="40" rx="6" fill="#15110e" class="gone" />
  <text x="694" y="568" class="muted" font-size="12" text-decoration="line-through">Genres</text>
  <text x="694" y="583" class="muted" font-size="11">&#8594; Tags section</text>
  <rect x="680" y="598" width="256" height="40" rx="6" fill="#15110e" class="gone" />
  <text x="694" y="616" class="muted" font-size="12" text-decoration="line-through">Actors</text>
  <text x="694" y="631" class="muted" font-size="11">&#8594; People grid</text>
  <rect x="680" y="646" width="256" height="40" rx="6" fill="#15110e" class="gone" />
  <text x="694" y="664" class="muted" font-size="12" text-decoration="line-through">Poster</text>
  <text x="694" y="679" class="muted" font-size="11">&#8594; player header</text>
  <rect x="680" y="694" width="256" height="40" rx="6" fill="#15110e" class="warnStroke" />
  <text x="694" y="712" class="muted" font-size="12" text-decoration="line-through">Overview</text>
  <text x="694" y="727" class="accent" font-size="11">&#8594; header, under the meta line</text>
  <text x="680" y="756" class="muted" font-size="12">Genres already materialize as Tag rows and</text>
  <text x="680" y="774" class="muted" font-size="12">actors already drive the People grid, so those</text>
  <text x="680" y="792" class="muted" font-size="12">three were duplicates. Overview was not &#8212; it</text>
  <text x="680" y="810" class="muted" font-size="12">gets a new home instead of being dropped.</text>
</svg>
