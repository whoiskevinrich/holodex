<svg viewBox="0 0 900 1156" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Entity Films row — current fixed shelf vs. proposed height-matched shelf with hover lift</title>
  <desc id="desc">Three panels. A: the current person-page Films row, a 4-column video grid above a shelf of fixed 80 by 120 poster tiles that are taller than the video frames. B: the proposed row, where each film poster is exactly as tall as the video frame above it, carries the same 1px rule border, and the third tile is drawn lifted and scaled 6 percent with an accent border to show the hover state. C: the same proposal rendered in the Broadcast and Brutalist skins at 2-column density.</desc>
