    <rect x="697" y="215" width="48" height="48" fill="#181310" stroke="#2a2622"/>
    <rect x="757" y="234" width="150" height="10" rx="2" fill="#2a2622"/><rect x="960" y="234" width="14" height="10" rx="2" fill="#2a2622"/>
