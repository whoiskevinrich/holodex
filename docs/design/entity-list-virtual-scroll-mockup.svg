<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" role="img" aria-labelledby="t d" font-family="'Archivo Variable', Archivo, sans-serif">
  <title id="t">Whole-list scroll on People and Studios: approved states (HOLODEX-601)</title>
  <desc id="d">People List view mid-scroll at 1024px with loaded rows, still placeholders, a failed page's retry row, the A–Z index tracking M, and the position chip. Below, the same placeholder in Poster and Table views.</desc>
  <rect width="1040" height="900" fill="#0c0a09"/>

  <!-- 1 · List view -->
  <text x="20" y="28" font-size="13" fill="#9b9082">1 · People, List view, name sort, mid-scroll (1024px, three columns, 70px rows, 8px gap). Studios rows are the same frame.</text>
  <rect x="20" y="40" width="1000" height="440" rx="12" fill="none" stroke="#2a2622"/>
  <text x="36" y="72" font-size="14" fill="#9b9082">1,512 people</text>
  <g font-size="12" font-weight="500" fill="#f3ece1">
    <text x="36" y="102">#</text><text x="56" y="102">A</text><text x="76" y="102">B</text><text x="96" y="102">C</text><text x="116" y="102">D</text><text x="136" y="102">E</text><text x="156" y="102">F</text><text x="176" y="102">G</text><text x="196" y="102">H</text><text x="216" y="102">I</text><text x="232" y="102">J</text><text x="250" y="102">K</text><text x="270" y="102">L</text>
    <text x="290" y="102" fill="#e8a33d">M</text>
    <text x="312" y="102">N</text><text x="332" y="102">O</text><text x="352" y="102">P</text>
    <text x="372" y="102" fill="#9b9082" opacity="0.3">Q</text>
