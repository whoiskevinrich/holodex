    <rect x="909.5" y="301.5" width="68" height="32" rx="2" fill="none" stroke="#2a2622"/>
    <text x="943" y="322" font-size="14" fill="#f3ece1" text-anchor="middle">Retry</text>
  </g>
  <!-- row 3: the rest of the failed page, still and dimmed -->
  <g opacity="0.55">
    <rect x="36.5" y="360.5" width="314" height="69" rx="2" fill="#15110e" stroke="#2a2622"/>
    <rect x="53" y="371" width="48" height="48" fill="#181310" stroke="#2a2622"/>
    <rect x="113" y="390" width="150" height="10" rx="2" fill="#2a2622"/>
    <rect x="358.5" y="360.5" width="314" height="69" rx="2" fill="#15110e" stroke="#2a2622"/>
    <rect x="375" y="371" width="48" height="48" fill="#181310" stroke="#2a2622"/>
    <rect x="435" y="390" width="150" height="10" rx="2" fill="#2a2622"/>
    <rect x="680.5" y="360.5" width="314" height="69" rx="2" fill="#15110e" stroke="#2a2622"/>
    <rect x="697" y="371" width="48" height="48" fill="#181310" stroke="#2a2622"/>
    <rect x="757" y="390" width="150" height="10" rx="2" fill="#2a2622"/>
  </g>
  <!-- position chip, beside the page scrollbar while scrolling -->
  <rect x="1000" y="190" width="8" height="40" rx="4" fill="#2a2622"/>
  <rect x="902.5" y="198.5" width="88" height="24" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="946" y="215" font-size="12" fill="#f3ece1" text-anchor="middle">412 of 1,512</text>
  <g font-size="12" fill="#9b9082">
    <text x="36" y="456">Loaded · arriving (still, same 70px frame) · failed page: one retry row, its rows dimmed · chip: every sort, fades 1s after a stop</text>
  </g>

  <!-- 2 · Poster and Table -->
  <text x="20" y="518" font-size="13" fill="#9b9082">2 · The same placeholder in Poster view (147px card at 6 columns, 1024px) and Table view (44px rows under a 28px header)</text>
  <rect x="20" y="530" width="1000" height="350" rx="12" fill="none" stroke="#2a2622"/>
  <g>
    <rect x="36.5" y="556.5" width="147" height="220" rx="2" fill="#15110e" stroke="#2a2622"/>
