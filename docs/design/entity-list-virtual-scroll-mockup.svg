    <line x1="560" y1="584.5" x2="1000" y2="584.5" stroke="#2a2622"/>
    <rect x="560" y="591" width="32" height="32" fill="#181310" stroke="#2a2622"/>
    <text x="604" y="612" fill="#f3ece1">Mara Lindqvist</text><text x="900" y="612" fill="#9b9082">14</text>
    <line x1="560" y1="628.5" x2="1000" y2="628.5" stroke="#2a2622"/>
    <rect x="560" y="635" width="32" height="32" fill="#181310" stroke="#2a2622"/>
    <rect x="604" y="646" width="140" height="10" rx="2" fill="#2a2622"/><rect x="900" y="646" width="14" height="10" rx="2" fill="#2a2622"/>
    <line x1="560" y1="672.5" x2="1000" y2="672.5" stroke="#2a2622"/>
    <rect x="560" y="679" width="32" height="32" fill="#181310" stroke="#2a2622"/>
    <rect x="604" y="690" width="140" height="10" rx="2" fill="#2a2622"/><rect x="900" y="690" width="14" height="10" rx="2" fill="#2a2622"/>
    <line x1="560" y1="716.5" x2="1000" y2="716.5" stroke="#2a2622"/>
