    <text x="36" y="814" font-size="12" fill="#9b9082">14</text>
    <rect x="199.5" y="556.5" width="147" height="220" rx="2" fill="#181310" stroke="#2a2622"/>
    <rect x="199" y="786" width="100" height="10" rx="2" fill="#2a2622"/><rect x="199" y="804" width="16" height="10" rx="2" fill="#2a2622"/>
    <rect x="362.5" y="556.5" width="147" height="220" rx="2" fill="#181310" stroke="#2a2622"/>
    <rect x="362" y="786" width="100" height="10" rx="2" fill="#2a2622"/><rect x="362" y="804" width="16" height="10" rx="2" fill="#2a2622"/>
