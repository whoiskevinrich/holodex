    <text x="514" y="102" fill="#9b9082" opacity="0.3">X</text>
    <text x="534" y="102">Y</text><text x="554" y="102">Z</text>
  </g>
  <rect x="288" y="107" width="13" height="2" fill="#e8a33d"/>
  <text x="590" y="102" font-size="12" fill="#9b9082">← active letter follows the first row in view</text>

  <!-- row 0: loaded -->
  <g>
    <rect x="36.5" y="126.5" width="314" height="69" rx="2" fill="#15110e" stroke="#2a2622"/>
    <rect x="53" y="137" width="48" height="48" fill="#181310" stroke="#2a2622"/>
    <text x="113" y="167" font-size="16" fill="#f3ece1">Mara Lindqvist</text><text x="330" y="166" font-size="12" fill="#9b9082" text-anchor="end">14</text>
    <rect x="358.5" y="126.5" width="314" height="69" rx="2" fill="#15110e" stroke="#2a2622"/>
    <rect x="375" y="137" width="48" height="48" fill="#181310" stroke="#2a2622"/>
    <text x="435" y="167" font-size="16" fill="#f3ece1">Marcus Oyelaran</text><text x="652" y="166" font-size="12" fill="#9b9082" text-anchor="end">3</text>
    <rect x="680.5" y="126.5" width="314" height="69" rx="2" fill="#15110e" stroke="#2a2622"/>
    <rect x="697" y="137" width="48" height="48" fill="#181310" stroke="#2a2622"/>
