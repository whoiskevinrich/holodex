<!-- legend -->
<text x="472" y="540" font-size="10" fill="#8a8478">● filled dot = staged pick · dashed ring = RD6 pending winner (undecided) · Write commits the staged</text>
<text x="472" y="554" font-size="10" fill="#8a8478">pick as the field's decision, then enqueues the write. Cancel discards every staged pick.</text>
<text x="472" y="576" font-size="10" fill="#8a8478">Row classes: ☑ will write · = matches file (change opens the chooser) · ⊖ no tag for container.</text>
<text x="472" y="590" font-size="10" fill="#8a8478">Amber note = in_sync unknown (ADR-093). image_url and merge rows are unchanged (HOLODEX-403 / 401).</text>

<text x="24" y="630" font-size="9" fill="#a39d92">Schematic — colours are illustrative; the component uses tokens only (bg-surface, text-ink, text-muted, border-rule, accent, warn). QA all three skins.</text>
