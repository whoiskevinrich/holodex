<text x="62" y="114" font-size="11" font-weight="600" fill="#6b655b">Year</text>
<text x="92" y="114" font-size="9" fill="#2f6fed">·tmdb</text>
<text x="118" y="114" font-size="9" fill="#8a8478">→ Year</text>
<text x="62" y="128" font-size="10" fill="#8a8478">was: 2009</text>
<rect x="62" y="134" width="346" height="22" rx="4" fill="#f7f5f1" stroke="#d9d4cb"/>
<text x="70" y="149" font-size="12" fill="#1d1a16">2010</text>

<!-- Overview row -->
<rect x="40" y="172" width="12" height="12" rx="2" fill="#2f6fed"/><path d="M42.5 178 l3 3 l5 -6" stroke="#fff" stroke-width="1.6" fill="none"/>
<text x="62" y="182" font-size="11" font-weight="600" fill="#6b655b">Overview</text>
<text x="118" y="182" font-size="9" fill="#2f6fed">·tmdb</text>
<text x="146" y="182" font-size="9" fill="#8a8478">→ Comment</text>
<text x="62" y="196" font-size="10" fill="#8a8478">was: Ripped from DVD, 2009.</text>
<rect x="62" y="202" width="346" height="40" rx="4" fill="#f7f5f1" stroke="#d9d4cb"/>
<text x="70" y="217" font-size="12" fill="#1d1a16">A masked vigilante hunts the syndicate that</text>
<text x="70" y="232" font-size="12" fill="#1d1a16">framed him and disappears into the night.</text>

<!-- Studio row (matches) -->
<path d="M41 262 h10 M41 267 h10" stroke="#8a8478" stroke-width="1.6"/>
<text x="62" y="268" font-size="11" font-weight="600" fill="#6b655b">Studio</text>
<text x="100" y="268" font-size="9" fill="#8a8478">·file</text>
<text x="120" y="268" font-size="9" fill="#8a8478">→ Publisher</text>
<text x="62" y="283" font-size="10" fill="#1d1a16">Nightfall Pictures <tspan fill="#8a8478">— already matches the file, nothing to write</tspan></text>

<!-- undecided disclosure -->
