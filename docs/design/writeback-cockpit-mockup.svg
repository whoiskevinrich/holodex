<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Writeback cockpit mockup (HOLODEX-400)</title>
<desc>Left: the writeback dialog today — every differing row is a seeded free-text input with a "was:" line, so the owner sees only the winner. Right: the cockpit — a differing row renders the field's candidate chooser (chip row for short fields, stacked radio rows for long text) and the Write button commits the staged pick as the decision. There are no checkboxes and no Select all: a standing decision that lags the file always writes (arrow glyph), an undecided row writes only once the owner picks a chip (hollow circle until then), a row that matches the file collapses to the "=" tier with a quiet "change" toggle, a field that is written but not read back shows "not read back" on its file chip instead of a warning, an unmapped field keeps its chooser and its pick is saved in Holodex only (cylinder glyph, "no file tag for this container" on the header); image_url and merge rows are read-only (nothing to decide here yet).</desc>
<rect width="900" height="640" fill="#f4f2ee"/>

<!-- ============ LEFT: TODAY ============ -->
<text x="24" y="28" font-size="11" letter-spacing="1" fill="#8a8478">1 · TODAY — WINNER ONLY, EDIT IN PLACE</text>
<rect x="24" y="40" width="400" height="330" rx="8" fill="#ffffff" stroke="#d9d4cb"/>
<text x="40" y="62" font-size="13" font-weight="600" fill="#1d1a16">Write metadata to file</text>
<line x1="24" y1="72" x2="424" y2="72" stroke="#e6e1d8"/>
<text x="40" y="90" font-size="10" fill="#8a8478" font-family="Consolas, monospace">E:/AMV/masked-vigilante-2009.mkv</text>

