<rect x="268" y="343" width="56" height="20" rx="4" fill="none" stroke="#d9d4cb"/>
<text x="296" y="357" font-size="11" fill="#1d1a16" text-anchor="middle">Cancel</text>
<rect x="330" y="343" width="78" height="20" rx="4" fill="#2f6fed"/>
<text x="369" y="357" font-size="11" fill="#ffffff" text-anchor="middle">Write 2 fields</text>

<text x="24" y="392" font-size="10" fill="#8a8478">Only the winner is visible. Other candidates aren't shown; changing the</text>
<text x="24" y="406" font-size="10" fill="#8a8478">applied value means typing over it (commits as `manual`).</text>

