<!-- legend -->
<text x="472" y="540" font-size="10" fill="#8a8478">● filled dot = staged pick · dashed ring = RD6 pending winner (undecided). Picking a chip — the pending</text>
<text x="472" y="554" font-size="10" fill="#8a8478">one included — is the confirm; Write records it as the decision, then enqueues one atomic write.</text>
<text x="472" y="576" font-size="10" fill="#8a8478">Gutter = what Write does: ↧ to the file · cylinder = saved in Holodex only (unmapped, or re-pointed at the file) ·</text>
<text x="472" y="590" font-size="10" fill="#8a8478">○ undecided · = matches file · ⊖ nothing to do. Header says → tag or "no file tag". "not read back" = ADR-093, no warning.</text>

<text x="24" y="630" font-size="9" fill="#a39d92">Schematic — colours are illustrative; the component uses tokens only (bg-surface, text-ink, text-muted, border-rule, accent, warn). QA all three skins.</text>
</svg>
