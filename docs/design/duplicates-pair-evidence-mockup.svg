  <text x="8.0" y="258" class="cap">The second row is hovered: the whole row is the disclosure’s hit area (pointer + surface-2 tint). Names open the profile in a new tab (↗);</text>
  <text x="8.0" y="272" class="cap">Keep separate resolves the pair. Neither toggles. The collapsed row carries no Merge — merging needs the evidence open.</text>
