<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1052" width="720" height="1052" role="img" aria-labelledby="t d">
  <title id="t">Duplicates pair evidence (F70): the collapsed person row with the verdict emphasis swapped, the expanded two-column compare panel, its loading, sparse and error states, and the narrow stacked layout</title>
  <desc id="d">Five panels drawn in Cinematheque tokens. 1: the People group of the Duplicates queue — a person row gains a chevron disclosure on the left, gives up its weak-signal match-kind label to the panel so the row stays one 40px line, and its verdicts swap so Keep separate is the outlined accent pill and Merge the bordered neutral; a Tags row below renders no disclosure and keeps its own match-kind label, having no panel to move it into. 2: an expanded person row. The panel is a recessed well under the row opening with the match-kind label the row gave up, then holding two identical bordered cards, each carrying a strip of five 44 pixel square image frames, the display name with nationality flags, a meta line of age, video count and film count, an aliases line, and a link row of Videos, Films and provider badges. A divider under the two cards carries the same two verdicts. 3: three states — loading, where both cards show empty frames and the names already known from the pair row; a sparse side with one image, no aliases and one provider; and a failed side showing an inline error while the verdicts stay usable. 4: the same panel below the stacking breakpoint — the cards stack, first side above second, each keeping its own border as the separator. 5: the same expanded panel in the Brutalist skin, where the theme radius is zero, so no corner is rounded except the verdict pill.</desc>
