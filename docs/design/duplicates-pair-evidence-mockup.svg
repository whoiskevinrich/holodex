<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1851" width="720" height="1851" role="img" aria-labelledby="t d">
  <title id="t">Duplicates lanes and the People compare panel (F70, HOLODEX-598)</title>
  <desc id="d">Four panels in Cinematheque tokens. 1: the Owner tabs, then a row of five lane tabs, Videos 2, People 31 (open), Studios 12, Tags 185, Films 0, and the People lane&#x27;s collapsed rows. Each row has a chevron, two names that open in a new tab with a small arrow mark, their video counts and the variation, and a single Keep separate button; the second row is hovered to show the whole row is the toggle. 2: an expanded person pair. A recessed well opens with the weak-signal match label, then two bordered columns, each with a 240 pixel square lead headshot above a strip of up to five 44 pixel frames, the ringed one being the current lead; then the name with its new-tab mark, a meta line, aliases, a link row of Videos, Films and provider badges with new-tab marks, and a Merge into this one accent pill. A footer repeats Keep separate. 3: the loading state, with empty lead and strip frames, beside a side that failed to load with an inline error and Retry while every verdict stays enabled. 4: the Films lane open with a count of 0 and an empty message, beside the Studios lane just opened and loading.</desc>
