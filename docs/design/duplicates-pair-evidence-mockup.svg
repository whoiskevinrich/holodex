    .cap { font-size: 11px; fill: #5f5e5a; }
    .ttl { font-size: 12px; font-weight: 600; fill: #2c2c2a; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .ink { fill: #f3ece1; } .muted { fill: #9b9082; } .accent { fill: #e8a33d; } .warn { fill: #e2603f; }
    .s9 { font-size: 9px; } .s10 { font-size: 10px; } .s11 { font-size: 11px; } .s12 { font-size: 12px; }
    .lab { font-size: 9px; letter-spacing: 1px; fill: #9b9082; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  </style>

