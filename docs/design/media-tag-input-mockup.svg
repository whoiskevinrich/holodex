<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="Archivo, 'Archivo Variable', system-ui, sans-serif" role="img">
  <title>HOLODEX-519 media page owner tag input</title>
  <desc>Three panels: Enter adds a tag and clears the input; an autocomplete listbox of existing tags; owner chips sorted by on-file status, pending changes first.</desc>
  <defs>
    <path id="doc" d="M9 1H3.5A1.5 1.5 0 0 0 2 2.5v11A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <g id="g-ok"><use href="#doc"/><path d="M5.5 10l2 2 3-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="g-add"><use href="#doc"/><path d="M8 7.5v5M5.5 10h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="g-rm"><use href="#doc"/><path d="M5.5 10h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="g-off"><use href="#doc"/><path d="M1 1l14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
  </defs>
  <rect width="760" height="640" fill="#0c0a09"/>

  <!-- Panel 1: Enter adds and clears -->
  <text x="24" y="32" font-size="11" letter-spacing="1" fill="#9b9082">1 · ENTER ADDS AND CLEARS — THE FORM STAYS OPEN</text>
  <text x="24" y="58" font-size="12" fill="#9b9082">before Enter</text>
  <g font-size="14" fill="#f3ece1">
    <rect x="24" y="68" width="62" height="28" rx="14" fill="#181310" stroke="#2a2622"/><text x="36" y="87">noir</text><text x="68" y="87" fill="#9b9082">×</text>
    <rect x="94" y="68" width="70" height="28" rx="14" fill="#181310" stroke="#2a2622"/><text x="106" y="87">1940s</text><text x="146" y="87" fill="#9b9082">×</text>
    <rect x="172" y="68" width="190" height="30" rx="2" fill="#15110e" stroke="#e8a33d"/><text x="184" y="88">heist</text><rect x="219" y="75" width="1.5" height="16" fill="#e8a33d"/>
    <rect x="370" y="68" width="48" height="30" rx="2" fill="none" stroke="#e8a33d"/><text x="381" y="88" fill="#e8a33d">Add</text>
    <text x="430" y="88" fill="#9b9082">Done</text>
  </g>
  <text x="490" y="88" font-size="12" fill="#9b9082">⏎ Enter</text>
  <text x="24" y="124" font-size="12" fill="#9b9082">after Enter</text>
  <g font-size="14" fill="#f3ece1">
    <rect x="24" y="134" width="62" height="28" rx="14" fill="#181310" stroke="#2a2622"/><text x="36" y="153">noir</text><text x="68" y="153" fill="#9b9082">×</text>
    <rect x="94" y="134" width="70" height="28" rx="14" fill="#181310" stroke="#2a2622"/><text x="106" y="153">1940s</text><text x="146" y="153" fill="#9b9082">×</text>
    <rect x="172" y="134" width="66" height="28" rx="14" fill="#181310" stroke="#2a2622"/><text x="184" y="153">heist</text><text x="220" y="153" fill="#9b9082">×</text>
    <rect x="246" y="134" width="190" height="30" rx="2" fill="#15110e" stroke="#e8a33d"/><text x="258" y="154" fill="#9b9082">Add a tag</text><rect x="257" y="141" width="1.5" height="16" fill="#e8a33d"/>
    <rect x="444" y="134" width="48" height="30" rx="2" fill="none" stroke="#e8a33d"/><text x="455" y="154" fill="#e8a33d">Add</text>
    <text x="504" y="154" fill="#9b9082">Done</text>
  </g>
  <text x="24" y="190" font-size="12" fill="#9b9082">Input cleared, focus kept. Esc or Done closes. “Cancel” is now “Done”.</text>

  <line x1="24" y1="208" x2="736" y2="208" stroke="#2a2622"/>

  <!-- Panel 2: Autocomplete -->
  <text x="24" y="236" font-size="11" letter-spacing="1" fill="#9b9082">2 · AUTOCOMPLETE FROM EXISTING TAGS</text>
  <g font-size="14" fill="#f3ece1">
    <rect x="24" y="250" width="62" height="28" rx="14" fill="#181310" stroke="#2a2622"/><text x="36" y="269">noir</text><text x="68" y="269" fill="#9b9082">×</text>
    <rect x="94" y="250" width="270" height="30" rx="2" fill="#15110e" stroke="#e8a33d"/><text x="106" y="270">ne</text><rect x="124" y="257" width="1.5" height="16" fill="#e8a33d"/>
    <rect x="372" y="250" width="48" height="30" rx="2" fill="none" stroke="#e8a33d"/><text x="383" y="270" fill="#e8a33d">Add</text>
    <text x="432" y="270" fill="#9b9082">Done</text>
    <!-- listbox -->
    <rect x="94" y="284" width="270" height="134" rx="2" fill="#15110e" stroke="#2a2622"/>
    <rect x="95" y="285" width="268" height="30" fill="#181310"/><rect x="95" y="285" width="2" height="30" fill="#e8a33d"/>
    <text x="106" y="305"><tspan fill="#e8a33d" font-weight="600">ne</tspan>o-noir</text><text x="352" y="305" font-size="12" fill="#9b9082" text-anchor="end">42</text>
    <text x="106" y="335"><tspan font-weight="600">ne</tspan>w wave</text><text x="352" y="335" font-size="12" fill="#9b9082" text-anchor="end">17</text>
    <text x="106" y="365">art <tspan font-weight="600">ne</tspan>cessity</text><text x="352" y="365" font-size="12" fill="#9b9082" text-anchor="end">3</text>
    <line x1="95" y1="380" x2="363" y2="380" stroke="#2a2622"/>
    <text x="106" y="404" fill="#9b9082">Add “ne” as a new tag</text>
  </g>
  <g font-size="12" fill="#9b9082">
    <text x="440" y="305">Prefix matches first, then substring.</text>
    <text x="440" y="323">Tags already on this video are left out.</text>
    <text x="440" y="341">Count = videos carrying the tag.</text>
    <text x="440" y="365">↑ ↓ move the highlight (aria-activedescendant;</text>
    <text x="440" y="383">focus stays in the input).</text>
    <text x="440" y="401">Shown after one ↓; none lit while typing.</text>
    <text x="440" y="419">Enter adds the lit row, else the typed text.</text>
    <text x="440" y="437">Tab adds the lit row, else the first match.</text>
  </g>

  <line x1="24" y1="450" x2="736" y2="450" stroke="#2a2622"/>

  <!-- Panel 3: Sorted by status, order A -->
  <text x="24" y="468" font-size="11" letter-spacing="1" fill="#9b9082">3 · OWNER CHIPS SORTED BY STATUS — PENDING CHANGES FIRST</text>
  <g font-size="14" fill="#f3ece1">
    <rect x="24" y="484" width="88" height="28" rx="14" fill="#181310" stroke="#2a2622"/>
    <g transform="translate(34 491) scale(.875)" color="#e8a33d"><use href="#g-add"/></g><text x="52" y="503">heist</text><text x="94" y="503" fill="#9b9082">×</text>
    <rect x="120" y="484" width="110" height="28" rx="14" fill="#181310" stroke="#2a2622"/>
    <g transform="translate(130 491) scale(.875)" color="#e2603f"><use href="#g-rm"/></g><text x="148" y="503">b-movie</text><text x="212" y="503" fill="#9b9082">×</text>
    <rect x="238" y="484" width="92" height="28" rx="14" fill="#181310" stroke="#2a2622"/>
    <g transform="translate(248 491) scale(.875)" color="#9b9082"><use href="#g-ok"/></g><text x="266" y="503">1940s</text><text x="312" y="503" fill="#9b9082">×</text>
    <rect x="338" y="484" width="82" height="28" rx="14" fill="#181310" stroke="#2a2622"/>
    <g transform="translate(348 491) scale(.875)" color="#9b9082"><use href="#g-ok"/></g><text x="366" y="503">noir</text><text x="402" y="503" fill="#9b9082">×</text>
    <rect x="428" y="484" width="118" height="28" rx="14" fill="#181310" stroke="#2a2622"/>
    <g transform="translate(438 491) scale(.875)" color="#9b9082"><use href="#g-off"/></g><text x="456" y="503">favourite</text><text x="528" y="503" fill="#9b9082">×</text>
    <text x="558" y="503" fill="#9b9082">+ Add tag</text>
  </g>
  <g font-size="12" fill="#9b9082">
    <text x="24" y="540">Pending add (accent +) → pending removal (warn −) → on the file (✓) → Holodex only (slash).</text>
    <text x="24" y="558">Alphabetical within each group. With the file's tags unknown (no glyph), plain name order.</text>
    <text x="24" y="576">The visitor branch has no glyphs and stays in name order.</text>
  </g>
</svg>
