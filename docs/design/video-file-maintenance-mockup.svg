<svg viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg" font-family="'Archivo Variable', sans-serif" role="img">
  <title>F77 video file maintenance: Maintenance section and dialogs on Media Details</title>
  <desc>Owner-only Maintenance rail section above Manage, shown at rest, running, with a held original, and failed; the flip confirm dialog, the refused dialog, and the keep-change confirm. Cinémathèque tokens.</desc>
  <defs>
    <style>
      .bg { fill: #0c0a09; }
      .surface { fill: #15110e; }
      .rule { stroke: #2a2622; stroke-width: 1; fill: none; }
      .ruleFill { fill: #15110e; stroke: #2a2622; stroke-width: 1; }
      .ink { fill: #f3ece1; }
      .muted { fill: #9b9082; }
      .accent { fill: #e8a33d; }
      .accentInk { fill: #1a1206; }
      .warn { fill: #e2603f; }
      .warnInk { fill: #170e08; }
      .warnStroke { stroke: #e2603f; stroke-width: 1; fill: none; }
      .h2 { font-size: 12px; letter-spacing: 0.3px; fill: #9b9082; }
      .t14 { font-size: 14px; }
      .t12 { font-size: 12px; }
      .pill { font-size: 10.4px; }
      .title { font-family: 'Fraunces Variable', serif; font-size: 18px; font-weight: 600; fill: #f3ece1; }
      .label { font-size: 11px; letter-spacing: 0.06em; fill: #e8a33d; }
      .note { font-size: 11px; fill: #6b6258; }
      .mono { font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #9b9082; }
    </style>
    <!-- mirror glyph: two triangles across a dashed axis, 16px -->
    <g id="flip">
      <path d="M7 2 L7 14 L1 14 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M11 2 L11 14 L17 14 Z" fill="currentColor" opacity="0.9"/>
      <line x1="9" y1="0" x2="9" y2="16" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
  </defs>

  <rect class="bg" width="960" height="960"/>
  <text x="20" y="30" class="label">F77 · MEDIA DETAILS RAIL · OWNER WITH ADMIN MODE ON · VISITORS SEE NONE OF THIS</text>

  <!-- ===== Row 1: rail states ===== -->
  <!-- 1 at rest -->
  <text x="20" y="62" class="note">1 · AT REST (placement)</text>
  <text x="20" y="88" class="h2">METADATA</text>
  <rect x="20.5" y="96.5" width="290" height="44" rx="2" class="ruleFill"/>
  <text x="36" y="123" class="t14 muted">Title · Year · Studio · …</text>

  <line x1="20" y1="160.5" x2="310" y2="160.5" class="rule"/>
  <text x="20" y="184" class="h2">MAINTENANCE</text>
  <rect x="20.5" y="194.5" width="168" height="32" rx="2" class="rule"/>
  <g transform="translate(32 202)" color="#9b9082"><use href="#flip"/></g>
  <text x="56" y="215" class="t14 muted">Flip horizontally…</text>

  <line x1="20" y1="246.5" x2="310" y2="246.5" class="rule"/>
  <text x="20" y="270" class="h2">MANAGE</text>
  <rect x="20.5" y="280.5" width="138" height="32" rx="2" class="warnStroke"/>
  <text x="32" y="301" class="t14 warn">Move to Trash</text>
  <line x1="126.5" y1="281" x2="126.5" y2="312" class="warnStroke"/>
  <path d="M136 293 l6 6 l6 -6" class="warnStroke" stroke-width="1.6"/>
  <text x="20" y="336" class="h2">COMPLETENESS …</text>

  <!-- 2 running -->
  <text x="335" y="62" class="note">2 · RUNNING (button replaced by status)</text>
  <line x1="335" y1="160.5" x2="625" y2="160.5" class="rule"/>
  <text x="335" y="184" class="h2">MAINTENANCE</text>
  <rect x="335" y="196" width="76" height="20" rx="10" class="accent"/>
  <circle cx="348" cy="206" r="4.5" fill="none" stroke="#1a1206" stroke-width="1.5" stroke-dasharray="20 8"/>
  <text x="358" y="210" class="pill accentInk">flipping</text>
  <text x="335" y="238" class="t12 muted">Started 14:02. You can leave this page.</text>
  <line x1="335" y1="258.5" x2="625" y2="258.5" class="rule"/>
  <text x="335" y="282" class="h2">MANAGE</text>

  <!-- 3 held original -->
  <text x="650" y="62" class="note">3 · ORIGINAL HELD</text>
  <line x1="650" y1="160.5" x2="940" y2="160.5" class="rule"/>
  <text x="650" y="184" class="h2">MAINTENANCE</text>
  <rect x="650.5" y="194.5" width="290" height="84" rx="2" class="ruleFill"/>
  <text x="662" y="216" class="t14 ink">Flipped 10 Oct. Original kept</text>
  <text x="662" y="234" class="t14 ink">until 17 Oct, then deleted.</text>
  <rect x="662.5" y="244.5" width="102" height="26" rx="2" class="rule"/>
  <text x="674" y="262" class="t14 ink">Keep change</text>
  <text x="778" y="262" class="t14 muted" text-decoration="underline">Restore original</text>
  <rect x="650.5" y="290.5" width="168" height="32" rx="2" class="rule"/>
  <g transform="translate(662 298)" color="#9b9082"><use href="#flip"/></g>
  <text x="686" y="311" class="t14 muted">Flip horizontally…</text>

  <!-- ===== Row 2: dialogs ===== -->
  <text x="20" y="384" class="note">4 · CONFIRM (ConfirmDialog, max-w-md 448px, variant accent)</text>
  <rect x="20.5" y="394.5" width="448" height="214" rx="2" class="ruleFill"/>
  <text x="36" y="426" class="title">Flip horizontally?</text>
  <text x="36" y="452" class="t14 ink">The picture in <tspan font-weight="600">Example (1999).mkv</tspan> is mirrored left</text>
  <text x="36" y="472" class="t14 ink">to right. The video is re-encoded; audio, subtitles,</text>
  <text x="36" y="492" class="t14 ink">chapters, cover art and every tag are kept as they are.</text>
  <text x="36" y="518" class="t12 muted">Needs 8.2 GB free · 41 GB available</text>
  <text x="36" y="536" class="t12 muted">Original kept until 17 Oct, then deleted. Restore it before then.</text>
  <rect x="318.5" y="560.5" width="66" height="32" rx="2" class="rule"/>
  <text x="333" y="581" class="t14 ink">Cancel</text>
  <rect x="394" y="560" width="58" height="33" rx="2" class="accent"/>
  <text x="410" y="581" class="t14 accentInk" font-weight="600">Flip</text>

  <text x="492" y="384" class="note">5 · REFUSED (same dialog, no confirm button)</text>
  <rect x="492.5" y="394.5" width="448" height="214" rx="2" class="ruleFill"/>
  <text x="508" y="426" class="title">Can't flip this file</text>
  <text x="508" y="452" class="t14 ink">The media library is mounted read-only. Remount it</text>
  <text x="508" y="472" class="t14 ink">read-write, then try again.</text>
  <text x="508" y="498" class="t12 muted">Same dialog, other reasons:</text>
  <text x="508" y="516" class="t12 muted">· Not enough free space — needs 8.2 GB, 3.1 GB available.</text>
  <text x="508" y="534" class="t12 muted">· No encoder for this file's video codec (VC-1).</text>
  <text x="508" y="552" class="t12 muted">· This file has no video stream.</text>
  <rect x="858.5" y="560.5" width="66" height="32" rx="2" class="rule"/>
  <text x="876" y="581" class="t14 ink">Close</text>

  <!-- ===== Row 3: failure + keep-change confirm ===== -->
  <text x="20" y="660" class="note">6 · FAILED (inline, like the writeback failure line)</text>
  <line x1="20" y1="676.5" x2="468" y2="676.5" class="rule"/>
  <text x="20" y="700" class="h2">MAINTENANCE</text>
  <text x="20" y="722" class="t12 warn">Couldn't flip: the new file's tags didn't match the original.</text>
  <text x="20" y="740" class="t12 warn">Your file wasn't changed.</text>
  <text x="174" y="740" class="t12 accent" text-decoration="underline">Retry</text>
  <text x="212" y="740" class="t12 muted" text-decoration="underline">Dismiss</text>
  <rect x="20.5" y="756.5" width="168" height="32" rx="2" class="rule"/>
  <g transform="translate(32 764)" color="#9b9082"><use href="#flip"/></g>
  <text x="56" y="777" class="t14 muted">Flip horizontally…</text>

  <text x="492" y="660" class="note">7 · KEEP CHANGE CONFIRM (variant warn)</text>
  <rect x="492.5" y="670.5" width="448" height="176" rx="2" class="ruleFill"/>
  <text x="508" y="702" class="title">Delete the original?</text>
  <text x="508" y="728" class="t14 ink">The original of <tspan font-weight="600">Example (1999).mkv</tspan> is deleted now</text>
  <text x="508" y="748" class="t14 ink">instead of on 17 Oct. You won't be able to restore it.</text>
  <text x="508" y="772" class="mono">/media/films/Example (1999).mkv</text>
  <rect x="738.5" y="798.5" width="66" height="32" rx="2" class="rule"/>
  <text x="753" y="819" class="t14 ink">Cancel</text>
  <rect x="814" y="798" width="112" height="33" rx="2" class="warn"/>
  <text x="826" y="819" class="t14 warnInk" font-weight="600">Delete original</text>

  <text x="20" y="900" class="note">Restore original opens the same dialog shape: "Restore the original?" — warns that tag writes to this file since 10 Oct will be undone</text>
  <text x="20" y="918" class="note">in the file (the library keeps its values), confirm button "Restore" (accent).</text>
</svg>
