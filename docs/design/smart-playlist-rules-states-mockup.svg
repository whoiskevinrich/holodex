<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d">
  <title id="t">Smart playlist rules: new chips, problem notices and the visitor header (HOLODEX-619)</title>
  <desc id="d">Panel 1: the new condition chips (relative dates, playlist references, owner-only watch conditions with a key glyph). Panel 2: the three new notices that replace the grid. Panel 3: what a visitor sees on a public smart playlist (no definition). Cinémathèque tokens only.</desc>
  <defs>
    <style>
      text { font-family: Archivo, 'Archivo Variable', sans-serif; fill: #f3ece1; font-size: 14px; }
      .serif { font-family: Fraunces, Georgia, serif; }
      .m { fill: #9b9082; } .a { fill: #e8a33d; } .w { fill: #e2603f; } .ai { fill: #1a1206; }
      .s12 { font-size: 12px; }
      .ttl { font-size: 12px; font-weight: 600; fill: #2c2c2a; }
      .note { font-size: 11px; fill: #5f5e5a; }
    </style>
    <symbol id="key" viewBox="0 0 12 12"><circle cx="4" cy="6" r="2.6" fill="none" stroke="#1a1206" stroke-width="1.4"/><path d="M6.6 6h4.4M9.4 6v2.2" stroke="#1a1206" stroke-width="1.4" fill="none"/></symbol>
  </defs>
  <rect width="720" height="700" fill="#ffffff"/>

  <!-- 1 · chips -->
  <text x="8" y="20" class="ttl">1 · New condition chips — owner, in Edit definition (FilterChip; negated keeps the outlined look)</text>
  <rect x="0" y="30" width="720" height="118" rx="4" fill="#0c0a09"/>
  <text x="16" y="54" class="m s12">Relative dates</text>
  <rect x="120" y="40" width="136" height="20" rx="2" fill="#e8a33d"/>
  <text x="126" y="54" class="ai s12">added: last 30 days  ×</text>
  <rect x="264" y="40" width="140" height="20" rx="2" fill="#e8a33d"/>
  <text x="270" y="54" class="ai s12">updated: last 7 days  ×</text>
  <rect x="412" y="40" width="166" height="20" rx="2" fill="#e8a33d"/>
  <text x="418" y="54" class="ai s12">released: last 12 months  ×</text>

  <text x="16" y="88" class="m s12">Playlists</text>
  <rect x="120" y="74" width="114" height="20" rx="2" fill="#e8a33d"/>
  <text x="126" y="88" class="ai s12">in: Favourites  ×</text>
  <rect x="242" y="74" width="140" height="20" rx="2" fill="none" stroke="#e8a33d"/>
  <text x="248" y="88" class="a s12">not in: Watch later  ×</text>

  <text x="16" y="122" class="m s12">Owner-only</text>
  <rect x="120" y="108" width="100" height="20" rx="2" fill="#e8a33d"/>
  <use href="#key" x="125" y="112" width="12" height="12"/>
  <text x="141" y="122" class="ai s12">unwatched  ×</text>
  <rect x="228" y="108" width="150" height="20" rx="2" fill="#e8a33d"/>
  <use href="#key" x="233" y="112" width="12" height="12"/>
  <text x="249" y="122" class="ai s12">played: last 7 days  ×</text>
  <rect x="386" y="108" width="132" height="20" rx="2" fill="#e8a33d"/>
  <use href="#key" x="391" y="112" width="12" height="12"/>
  <text x="407" y="122" class="ai s12">plays: 3 or more  ×</text>
  <rect x="526" y="108" width="132" height="20" rx="2" fill="#e8a33d"/>
  <use href="#key" x="531" y="112" width="12" height="12"/>
  <text x="547" y="122" class="ai s12">matched: any  ×</text>
  <text x="16" y="142" class="m s12">A chip’s label is cut at 12rem with a title tooltip, as today; the key sits before the label and never truncates.</text>

  <!-- 2 · notices -->
  <text x="8" y="172" class="ttl">2 · New notices — replace the grid on open (F75 stale-notice container); owner view</text>
  <rect x="0" y="182" width="720" height="236" rx="4" fill="#0c0a09"/>

  <rect x="16" y="198" width="688" height="62" rx="2" fill="#15110e" stroke="#e2603f"/>
  <text x="28" y="222" class="w">This playlist refers to a playlist that was deleted</text>
  <text x="28" y="242" class="m s12">(playlist #14). Nothing is shown until the definition is fixed.</text>
  <rect x="450" y="213" width="122" height="26" rx="2" fill="none" stroke="#e8a33d"/>
  <text x="462" y="231" class="a">Edit definition</text>
  <text x="586" y="231" class="m">Delete playlist</text>

  <rect x="16" y="272" width="688" height="62" rx="2" fill="#15110e" stroke="#e2603f"/>
  <text x="28" y="296" class="w">This playlist includes itself through another playlist</text>
  <text x="28" y="316" class="m s12">(Noir → Favourites → Noir). Nothing is shown until the definition is fixed.</text>
  <rect x="450" y="287" width="122" height="26" rx="2" fill="none" stroke="#e8a33d"/>
  <text x="462" y="305" class="a">Edit definition</text>
  <text x="586" y="305" class="m">Delete playlist</text>

  <rect x="16" y="346" width="688" height="62" rx="2" fill="#15110e" stroke="#e2603f"/>
  <text x="28" y="370" class="w">This public playlist uses an owner-only condition</text>
  <text x="28" y="390" class="m s12">(unwatched). Make it private or edit the definition.</text>
  <rect x="450" y="361" width="122" height="26" rx="2" fill="none" stroke="#e8a33d"/>
  <text x="462" y="379" class="a">Edit definition</text>
  <text x="586" y="379" class="m">Make private</text>

  <!-- 3 · visitor -->
  <text x="8" y="442" class="ttl">3 · Visitor on a public smart playlist — no definition, no cap readout, no editing</text>
  <rect x="0" y="452" width="720" height="150" rx="4" fill="#0c0a09"/>
  <text x="16" y="490" class="serif" font-size="24">Late-night noir, recently added</text>
  <rect x="590" y="468" width="114" height="30" rx="2" fill="#e8a33d"/>
  <text x="604" y="488" class="ai">▶ Play all  ▾</text>
  <text x="16" y="514" class="m">25 videos · Date added — newest · <tspan class="s12">updates automatically</tspan></text>
  <g fill="#15110e" stroke="#2a2622">
    <rect x="16" y="530" width="108" height="61" rx="2"/><rect x="132" y="530" width="108" height="61" rx="2"/>
    <rect x="248" y="530" width="108" height="61" rx="2"/><rect x="364" y="530" width="108" height="61" rx="2"/>
    <rect x="480" y="530" width="108" height="61" rx="2"/><rect x="596" y="530" width="108" height="61" rx="2"/>
  </g>
  <text x="8" y="626" class="note">A visitor who opens a playlist with a notice sees “This playlist can’t be shown right now.” and no actions (F75 copy, unchanged).</text>

  <text x="8" y="650" class="note">Cinémathèque tokens: bg #0c0a09 · surface #15110e · surface-2 #181310 · ink #f3ece1 · muted #9b9082 · rule #2a2622</text>
  <text x="8" y="664" class="note">· accent #e8a33d · accent-ink #1a1206 · warn #e2603f · radius 2px</text>
  <text x="8" y="682" class="note">Approved: owner, 2026-11-01 — chips “in:”, key glyph on owner-only conditions, visitors see no definition.</text>
</svg>
