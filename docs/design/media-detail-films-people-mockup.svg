<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="985" viewBox="0 0 1000 985" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="mockup-title mockup-desc">
<title id="mockup-title">Media detail — Films + People, four link states across owner and visitor</title>
<desc id="mockup-desc">Proposed layout for the Holodex media detail page's Films and People sections. Four rows show the neither-linked, people-only, film-only and both-linked states; the left column is the owner view and the right column the visitor view. Empty sections collapse to a text CTA with no heading; the film scene number renders as a corner pill overlaid on the poster.</desc>
<rect width="1000" height="985" fill="#0c0a09"/>

<text x="40" y="30" fill="#f3ece1" font-size="15">Media detail — Films + People (Cinémathèque skin)</text>
<text x="40" y="52" fill="#9b9082" font-size="11" letter-spacing="1.2">OWNER</text>
<text x="530" y="52" fill="#9b9082" font-size="11" letter-spacing="1.2">VISITOR</text>

<text x="40" y="80" fill="#f3ece1" font-size="12">1 · Neither linked</text>
