<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
<title id="t">HOLODEX-567 Media sort: the Updated pair in the sort list</title>
<desc id="d">Cinémathèque tokens at component sizes (14px options, 12px captions). Left: the Media sort list open for the owner, with Updated — newest and Updated — oldest directly after the Date added pair and the Owner optgroup last. Right: a playlist that follows a sort, whose header line names the chosen sort.</desc>
<g font-family="Archivo, 'Archivo Variable', sans-serif">
<rect x="0" y="0" width="760" height="470" fill="#0c0a09"/>

<text x="24" y="24" font-size="12" fill="#9b9082">Media (owner): sort list open, Updated — newest chosen</text>
<rect x="24" y="40" width="189" height="32" rx="2" fill="#15110e" stroke="#e8a33d"/>
<text x="36" y="61" font-size="14" fill="#f3ece1">Updated — newest</text>
<path d="M192.96 54 l4 4 l4 -4" fill="none" stroke="#9b9082" stroke-width="1.5"/>

<rect x="24" y="78" width="189" height="372" rx="2" fill="#15110e" stroke="#2a2622"/>
<text x="36" y="97" font-size="14" fill="#f3ece1">Date added — newest</text>
<text x="36" y="121" font-size="14" fill="#f3ece1">Date added — oldest</text>
<rect x="25" y="129" width="187" height="24" fill="#e8a33d"/>
<text x="36" y="145" font-size="14" fill="#1a1206">Updated — newest</text>
<text x="36" y="169" font-size="14" fill="#f3ece1">Updated — oldest</text>
<text x="36" y="193" font-size="14" fill="#f3ece1">Title — A→Z</text>
<text x="36" y="217" font-size="14" fill="#f3ece1">Title — Z→A</text>
<text x="36" y="241" font-size="14" fill="#f3ece1">Duration — longest</text>
<text x="36" y="265" font-size="14" fill="#f3ece1">Duration — shortest</text>
<text x="36" y="289" font-size="14" fill="#f3ece1">Resolution — highest</text>
<text x="36" y="313" font-size="14" fill="#f3ece1">Resolution — lowest</text>
<text x="36" y="337" font-size="14" fill="#f3ece1">Random</text>
<text x="30" y="361" font-size="12" fill="#9b9082">Owner</text>
<text x="36" y="385" font-size="14" fill="#f3ece1">Completeness — most</text>
<text x="36" y="409" font-size="14" fill="#f3ece1">Completeness — least</text>
<text x="36" y="438" font-size="12" fill="#9b9082">widest option unchanged (20 ch)</text>

<text x="226" y="145" font-size="12" fill="#e8a33d">← new pair, after Date added</text>
<path d="M222 141 l0 28" stroke="#e8a33d" stroke-width="1.5"/>

<text x="400" y="24" font-size="12" fill="#9b9082">Playlist that follows a sort: header names it</text>
<rect x="400" y="40" width="336" height="96" rx="2" fill="#15110e" stroke="#2a2622"/>
<text x="416" y="72" font-size="22" fill="#f3ece1">Recently touched</text>
<text x="416" y="98" font-size="14" fill="#9b9082">214 videos · Updated — newest</text>
<text x="416" y="122" font-size="12" fill="#9b9082">Same labels as Media; nothing else in the header changes</text>

<text x="400" y="176" font-size="12" fill="#9b9082">Unchanged: Recently Added shelf and the Date added labels</text>
<rect x="400" y="190" width="336" height="88" rx="2" fill="#15110e" stroke="#2a2622"/>
<text x="416" y="214" font-size="14" fill="#f3ece1">Recently Added</text>
<rect x="416" y="226" width="72" height="40" rx="2" fill="#2a2622"/>
<rect x="496" y="226" width="72" height="40" rx="2" fill="#2a2622"/>
<rect x="576" y="226" width="72" height="40" rx="2" fill="#2a2622"/>
<rect x="656" y="226" width="64" height="40" rx="2" fill="#2a2622"/>
<text x="400" y="300" font-size="12" fill="#9b9082">Now the newest arrivals; edited files no longer show here.</text>
</g>
</svg>
