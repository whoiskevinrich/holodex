<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Provider link badge — film and media header placement (F63, HOLODEX-390)</title>
<desc>Top: the film page header in all three skins with the provider pills appended to the year line after a middle-dot separator (DD4, ruled over a dedicated pill line). Middle: the owner's docked pencil lands after the pills, and the no-ids case renders the year alone. Bottom: the media header meta row with a single pill after the year (RD7, HOLODEX-394), and the person reference row the pattern generalises.</desc>
<rect width="900" height="560" fill="#f4f2ee"/>

<text x="24" y="28" font-size="11" letter-spacing="1" fill="#8a8478">1 · FILM HEADER — DD4: PILLS JOIN THE YEAR LINE (CHOSEN)</text>

