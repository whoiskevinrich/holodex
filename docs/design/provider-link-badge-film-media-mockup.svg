<text x="24" y="218" font-size="11" letter-spacing="1" fill="#8a8478">2 · OWNER ROW ON HOVER (PENCIL DOCKS AFTER THE PILLS) · NO-IDS ROW · REJECTED: OWN LINE</text>

<rect x="24" y="230" width="276" height="96" rx="4" fill="#0c0a09" stroke="#2a2622"/>
<text x="36" y="248" font-size="9" fill="#9b9082">Owner, row hovered — `1999 · IMDb TMDB ✎`</text>
<text x="36" y="276" font-size="12" fill="#9b9082">1999</text>
<text x="66" y="276" font-size="12" fill="#9b9082">·</text>
<rect x="76" y="264" width="50" height="18" rx="9" fill="none" stroke="#2a2622"/>
<rect x="82" y="268" width="10" height="10" rx="2" fill="#e9e0d0"/><text x="84" y="276" font-size="7" font-weight="600" fill="#2a2018">I</text>
<text x="96" y="276" font-size="10" fill="#9b9082">IMDb</text>
<rect x="132" y="264" width="54" height="18" rx="9" fill="none" stroke="#e8a33d"/>
<rect x="138" y="268" width="10" height="10" rx="2" fill="#e9e0d0"/><text x="140" y="276" font-size="7" font-weight="600" fill="#2a2018">T</text>
<text x="152" y="276" font-size="10" fill="#f3ece1">TMDB</text>
<rect x="194" y="262" width="22" height="22" rx="2" fill="none" stroke="#2a2622"/>
<path d="M200 278 l1.5-4 8-8 2.5 2.5-8 8z" fill="none" stroke="#9b9082" stroke-width="1.2"/>
<text x="36" y="308" font-size="9" fill="#6f6a5f">TMDB pill hovered: border → accent, text → ink. Pencil label stays "Change the year".</text>

<rect x="312" y="230" width="276" height="96" rx="4" fill="#0c0a09" stroke="#2a2622"/>
<text x="324" y="248" font-size="9" fill="#9b9082">No ids — visitor / owner at rest</text>
<text x="324" y="276" font-size="12" fill="#9b9082">1999</text>
<text x="324" y="308" font-size="9" fill="#6f6a5f">Line is byte-identical to today: no pill, no `·`.</text>

<rect x="600" y="230" width="276" height="96" rx="4" fill="#0c0a09" stroke="#2a2622" stroke-dasharray="4 3"/>
<text x="612" y="248" font-size="9" fill="#9b9082">Rejected — pills on their own line</text>
<text x="612" y="270" font-size="12" fill="#9b9082">1999</text>
<rect x="612" y="280" width="50" height="18" rx="9" fill="none" stroke="#2a2622"/>
<text x="632" y="292" font-size="10" fill="#9b9082">IMDb</text>
<rect x="668" y="280" width="54" height="18" rx="9" fill="none" stroke="#2a2622"/>
<text x="688" y="292" font-size="10" fill="#9b9082">TMDB</text>
<text x="612" y="316" font-size="9" fill="#6f6a5f">Costs a header line; breaks the one-placement rule.</text>

<text x="24" y="356" font-size="11" letter-spacing="1" fill="#8a8478">3 · MEDIA HEADER — RD7: ONE PILL AFTER THE YEAR (HOLODEX-394) · PERSON REFERENCE ROW</text>

<rect x="24" y="368" width="564" height="80" rx="4" fill="#0c0a09" stroke="#2a2622"/>
<text x="36" y="386" font-size="9" fill="#9b9082">Media page meta row — `1080p 1920×1080 · 2h 16m · 1999 · TMDB`</text>
<text x="36" y="412" font-size="16" font-family="Georgia, serif" font-weight="600" fill="#f3ece1">The Matrix (1999).mkv</text>
<rect x="36" y="424" width="42" height="16" rx="2" fill="#e8a33d"/><text x="42" y="436" font-size="10" fill="#1a1206">1080p</text>
<text x="86" y="436" font-size="11" fill="#9b9082">1920×1080</text>
<text x="146" y="436" font-size="11" fill="#9b9082">·</text>
<text x="156" y="436" font-size="11" fill="#9b9082">2h 16m</text>
<text x="196" y="436" font-size="11" fill="#9b9082">·</text>
<text x="206" y="436" font-size="11" fill="#9b9082">1999</text>
<text x="234" y="436" font-size="11" fill="#9b9082">·</text>
<rect x="244" y="423" width="54" height="18" rx="9" fill="none" stroke="#2a2622"/>
<rect x="250" y="427" width="10" height="10" rx="2" fill="#e9e0d0"/><text x="252" y="435" font-size="7" font-weight="600" fill="#2a2018">T</text>
<text x="264" y="435" font-size="10" fill="#9b9082">TMDB</text>

<rect x="600" y="368" width="276" height="80" rx="4" fill="#0c0a09" stroke="#2a2622"/>
<text x="612" y="386" font-size="9" fill="#9b9082">Person (shipped, HOLODEX-266) — `12 videos · IMDb TMDB`</text>
<text x="612" y="412" font-size="16" font-family="Georgia, serif" font-weight="600" fill="#f3ece1">Keanu Reeves</text>
<text x="612" y="436" font-size="11" fill="#9b9082">12 videos</text>
<text x="666" y="436" font-size="11" fill="#9b9082">·</text>
<rect x="676" y="423" width="50" height="18" rx="9" fill="none" stroke="#2a2622"/>
<text x="696" y="435" font-size="10" fill="#9b9082">IMDb</text>
<rect x="732" y="423" width="54" height="18" rx="9" fill="none" stroke="#2a2622"/>
<text x="752" y="435" font-size="10" fill="#9b9082">TMDB</text>

<text x="24" y="480" font-size="10" fill="#6f6a5f">One rule, four entities: pills trail the last passive fact on the entity's existing muted line after a `·` — never a new row, never a section.</text>
<text x="24" y="498" font-size="10" fill="#6f6a5f">Film's passive line is the year (an owner-editable NameEditControl); the pills ride its `trailing` slot, so they hide with the resting row while the year is being edited.</text>
<text x="24" y="516" font-size="10" fill="#6f6a5f">Tokens only — text-muted / border-rule / accent on hover — so the pill needs no per-skin work; the three panels above differ only by skin tokens and fonts.</text>
<text x="24" y="540" font-size="9" fill="#8a8478">docs/design/provider-link-badge-handoff.md §5 · HOLODEX-393 / HOLODEX-394 · 2026-09-17</text>
</svg>
