<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" font-family="Archivo, 'Archivo Variable', system-ui, sans-serif" role="img">
  <title>F82 Tags Posters view and tag poster upload, Cinémathèque</title>
  <desc>The Tags page in Posters view (All tab, owner): 16:9 cards like media thumbnails, a tag-glyph placeholder for tags without an image, categories as accent-glyph placeholder cards. Below, the poster control on a tag's own page, empty and filled.</desc>
  <defs>
