    <use href="#phCat" x="780" y="390"/><text x="780" y="543">weather</text>
  </g>
  <g font-size="12" fill="#9b9082">
    <text x="24" y="371">142 videos</text><text x="276" y="371">38 videos</text><text x="528" y="371">21 videos</text><text x="780" y="371">4 videos</text>
