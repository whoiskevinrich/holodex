  <text x="690" y="141" font-size="14" fill="#1a1206" font-weight="500">Posters</text>
  <g fill="none" stroke="#9b9082" stroke-width="1.3"><rect x="762" y="130" width="13" height="13"/><path d="M762 134.5h13M762 138.5h13M767 130v13"/></g>
  <text x="782" y="141" font-size="14" fill="#9b9082">Table</text>
