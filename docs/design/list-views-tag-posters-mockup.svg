  <text x="24" y="64" font-size="24" fill="#f3ece1" font-weight="600">Tags</text>
  <g font-size="14"><text x="24" y="98" fill="#e8a33d">All</text><text x="60" y="98" fill="#9b9082">Tags</text><text x="106" y="98" fill="#9b9082">Categories</text></g>
  <line x1="24" y1="105" x2="45" y2="105" stroke="#e8a33d" stroke-width="2"/>

  <rect x="24.5" y="120.5" width="120" height="32" rx="2" fill="#15110e" stroke="#2a2622"/>
