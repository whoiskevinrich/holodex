  <rect x="862" y="134.5" width="100" height="3" rx="1.5" fill="#2a2622"/><rect x="862" y="134.5" width="20" height="3" rx="1.5" fill="#e8a33d"/><circle cx="882" cy="136" r="7" fill="#e8a33d"/>
  <rect x="970" y="128" width="16" height="16" rx="2" fill="#9b9082"/>
