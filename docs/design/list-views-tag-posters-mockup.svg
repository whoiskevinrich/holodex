    <text x="188" y="40" font-size="14" font-weight="500" fill="#f3ece1">Poster</text>
    <rect x="188.5" y="54.5" width="62" height="22" rx="2" fill="#15110e" stroke="#2a2622"/><text x="198" y="70" font-size="12" fill="#f3ece1">Replace</text>
    <rect x="258.5" y="54.5" width="62" height="22" rx="2" fill="#15110e" stroke="#2a2622"/><text x="268" y="70" font-size="12" fill="#9b9082">Remove</text>
  </g>
  <text x="24" y="800" font-size="12" fill="#6f665b">the existing image slot control at 16:9 · Remove asks “Remove?” first, as on studios · visitors see the image with no controls, and no slot when there is none</text>
