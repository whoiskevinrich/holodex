  <text x="24" y="590" font-size="12" fill="#6f665b">16:9 frame, the media thumbnail shape · tag rows first, then categories (accent glyph) · ⋯ shows on hover or focus while Manage tags is on</text>

  <!-- tag page control -->
  <text x="24" y="640" font-size="12" fill="#6f665b" letter-spacing=".04em">TAG PAGE · OWNER · THE POSTER CONTROL, EMPTY AND FILLED</text>
  <g transform="translate(24 656)">
    <rect x=".5" y=".5" width="380" height="114" rx="2" fill="#15110e" stroke="#2a2622"/>
    <rect x="12.5" y="12.5" width="160" height="90" rx="2" fill="none" stroke="#2a2622" stroke-dasharray="4 3"/>
