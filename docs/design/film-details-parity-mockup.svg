<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Film Details parity (HOLODEX-95): owner and visitor film pages</title>
  <desc>Three panels. One: the owner's film page at lg, with the Details section carrying Released, Runtime, Tagline and Genres as film fields, each with its provider badge, genres as outline chips with an Add pill. Two: the visitor's film page, where Details now renders with one section-level "Enriched from TMDB" note and no controls. Three: two stressed states — a visitor whose rows come from two providers (per-row badges, no header note), and an owner whose provider sent a non-canonical key, which lands under Additional details with Promote and Attach.</desc>

  <rect width="960" height="1040" fill="#0c0a09"/>

  <!-- ─────────── 1. Owner ─────────── -->
  <text x="20" y="28" fill="#e8a33d" font-size="11" letter-spacing="1.2">1 — OWNER · FILM PAGE AT LG · CHANGED: DETAILS (OUTLINED)</text>
  <rect x="20" y="40" width="920" height="440" rx="4" fill="#0c0a09" stroke="#2a2622"/>

  <!-- subject column -->
  <rect x="32" y="52" width="522" height="112" rx="2" fill="#181310" stroke="#2a2622"/>
  <text x="293" y="100" fill="#9b9082" font-size="10" text-anchor="middle" letter-spacing="1.2">BANNER · 8:3 · UNCHANGED</text>
  <rect x="32" y="124" width="522" height="40" fill="#0c0a09" opacity="0.55"/>
  <rect x="48" y="120" width="72" height="108" rx="2" fill="#221b16" stroke="#2a2622"/>
  <text x="136" y="178" fill="#f3ece1" font-size="22" font-family="Georgia, 'Fraunces', serif">The Third Man</text>
  <text x="136" y="196" fill="#9b9082" font-size="11">On record as “The Third Man”</text>
  <rect x="290" y="186" width="12" height="12" rx="3" fill="#01b4e4"/>
  <text x="136" y="214" fill="#9b9082" font-size="12">1949 ·</text>
  <rect x="176" y="203" width="52" height="16" rx="8" fill="none" stroke="#2a2622"/>
  <text x="202" y="215" fill="#9b9082" font-size="10" text-anchor="middle">TMDB ↗</text>
  <text x="136" y="232" fill="#9b9082" font-size="11">Release date says 1949.</text>
  <rect x="48" y="246" width="160" height="22" rx="11" fill="#181310" stroke="#2a2622"/>
  <text x="128" y="261" fill="#f3ece1" font-size="11" text-anchor="middle">London Film Productions</text>
  <text x="48" y="300" fill="#9b9082" font-size="10" letter-spacing="1">SCENES · FULL FILM · MANAGE — UNCHANGED</text>

  <!-- rail -->
  <text x="574" y="64" fill="#9b9082" font-size="10" letter-spacing="1">DESCRIPTION ✎</text>
  <text x="574" y="82" fill="#f3ece1" font-size="12">An American writer arrives in postwar Vienna to</text>
  <text x="574" y="98" fill="#f3ece1" font-size="12">find his friend dead… <tspan fill="#e8a33d">more</tspan></text>
  <text x="574" y="124" fill="#9b9082" font-size="10" letter-spacing="1">TAGS · CAST · BILLED COVERAGE — UNCHANGED</text>
  <rect x="574" y="132" width="48" height="20" rx="10" fill="#181310" stroke="#2a2622"/>
  <text x="598" y="146" fill="#f3ece1" font-size="11" text-anchor="middle">noir</text>
  <rect x="626" y="132" width="56" height="20" rx="10" fill="#181310" stroke="#2a2622"/>
  <text x="654" y="146" fill="#f3ece1" font-size="11" text-anchor="middle">vienna</text>
  <text x="690" y="146" fill="#9b9082" font-size="10">← filled, linked tag chips</text>
  <circle cx="590" cy="178" r="14" fill="#221b16" stroke="#2a2622"/>
  <circle cx="624" cy="178" r="14" fill="#221b16" stroke="#2a2622"/>
  <circle cx="658" cy="178" r="14" fill="#221b16" stroke="#2a2622"/>
  <circle cx="692" cy="178" r="14" fill="#221b16" stroke="#2a2622"/>

  <!-- Details (owner) -->
  <rect x="570" y="206" width="362" height="262" rx="3" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
  <rect x="574" y="210" width="354" height="254" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="588" y="230" fill="#9b9082" font-size="10" letter-spacing="1">DETAILS</text>
  <rect x="862" y="219" width="54" height="16" rx="8" fill="#181310" stroke="#2a2622"/>
  <text x="889" y="231" fill="#9b9082" font-size="10" text-anchor="middle">TMDB ↻</text>
  <text x="588" y="254" fill="#9b9082" font-size="13">Released:</text>
  <text x="588" y="272" fill="#f3ece1" font-size="13">1949-08-31</text>
  <rect x="664" y="261" width="13" height="13" rx="3" fill="#01b4e4"/>
  <text x="588" y="296" fill="#9b9082" font-size="13">Runtime (min):</text>
  <text x="588" y="314" fill="#f3ece1" font-size="13">104</text>
  <rect x="616" y="303" width="13" height="13" rx="3" fill="#01b4e4"/>
  <text x="740" y="314" fill="#e8a33d" font-size="10">NEW · film field</text>
  <text x="588" y="338" fill="#9b9082" font-size="13">Tagline:</text>
  <text x="588" y="356" fill="#f3ece1" font-size="13">A one-line tagline reads here.</text>
  <rect x="765" y="345" width="13" height="13" rx="3" fill="#01b4e4"/>
  <text x="788" y="356" fill="#e8a33d" font-size="10">NEW</text>
  <text x="588" y="380" fill="#9b9082" font-size="13">Genres:</text>
  <rect x="588" y="390" width="54" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="615" y="405" fill="#f3ece1" font-size="12" text-anchor="middle">Drama</text>
  <rect x="648" y="390" width="64" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="680" y="405" fill="#f3ece1" font-size="12" text-anchor="middle">Thriller</text>
  <rect x="718" y="390" width="62" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="749" y="405" fill="#f3ece1" font-size="12" text-anchor="middle">Mystery</text>
  <rect x="786" y="392" width="48" height="18" rx="9" fill="none" stroke="#2a2622"/>
  <text x="810" y="405" fill="#9b9082" font-size="11" text-anchor="middle">+ Add</text>
  <text x="840" y="405" fill="#e8a33d" font-size="10">NEW</text>
  <text x="588" y="434" fill="#9b9082" font-size="10">Outline value chips — not tags. Each value badge</text>
  <text x="588" y="448" fill="#9b9082" font-size="10">opens the source picker, as on a video.</text>

  <!-- ─────────── 2. Visitor ─────────── -->
  <text x="20" y="510" fill="#e8a33d" font-size="11" letter-spacing="1.2">2 — VISITOR · DETAILS NOW RENDERS (WAS OWNER-ONLY) · ONE SECTION NOTE</text>
  <rect x="20" y="522" width="920" height="330" rx="4" fill="#0c0a09" stroke="#2a2622"/>
  <rect x="32" y="534" width="522" height="112" rx="2" fill="#181310" stroke="#2a2622"/>
  <rect x="32" y="606" width="522" height="40" fill="#0c0a09" opacity="0.55"/>
  <rect x="48" y="602" width="72" height="108" rx="2" fill="#221b16" stroke="#2a2622"/>
  <text x="136" y="662" fill="#f3ece1" font-size="22" font-family="Georgia, 'Fraunces', serif">The Third Man</text>
  <text x="136" y="682" fill="#9b9082" font-size="12">1949 ·</text>
  <rect x="176" y="671" width="52" height="16" rx="8" fill="none" stroke="#2a2622"/>
  <text x="202" y="683" fill="#9b9082" font-size="10" text-anchor="middle">TMDB ↗</text>
  <rect x="48" y="724" width="160" height="22" rx="11" fill="#181310" stroke="#2a2622"/>
  <text x="128" y="739" fill="#f3ece1" font-size="11" text-anchor="middle">London Film Productions</text>

  <text x="574" y="546" fill="#9b9082" font-size="10" letter-spacing="1">DESCRIPTION · TAGS · CAST — UNCHANGED</text>
  <rect x="570" y="560" width="362" height="282" rx="3" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
  <rect x="574" y="564" width="354" height="274" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="588" y="584" fill="#9b9082" font-size="10" letter-spacing="1">DETAILS</text>
  <text x="914" y="584" fill="#9b9082" font-size="11" text-anchor="end">Enriched from <tspan fill="#e8a33d">TMDB</tspan></text>
  <text x="588" y="610" fill="#9b9082" font-size="13">Released: <tspan fill="#f3ece1">1949-08-31</tspan></text>
  <text x="588" y="634" fill="#9b9082" font-size="13">Runtime (min): <tspan fill="#f3ece1">104</tspan></text>
  <text x="588" y="658" fill="#9b9082" font-size="13">Tagline:</text>
  <text x="588" y="676" fill="#f3ece1" font-size="13">A one-line tagline reads here.</text>
  <text x="588" y="700" fill="#9b9082" font-size="13">Genres:</text>
  <rect x="588" y="710" width="54" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="615" y="725" fill="#f3ece1" font-size="12" text-anchor="middle">Drama</text>
  <rect x="648" y="710" width="64" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="680" y="725" fill="#f3ece1" font-size="12" text-anchor="middle">Thriller</text>
  <rect x="718" y="710" width="62" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="749" y="725" fill="#f3ece1" font-size="12" text-anchor="middle">Mystery</text>
  <text x="588" y="760" fill="#9b9082" font-size="10">No badges per row, no pencils, no Add — every row came</text>
  <text x="588" y="774" fill="#9b9082" font-size="10">from one provider, so one header note says so.</text>
  <text x="588" y="798" fill="#9b9082" font-size="10">Hidden when no field has a value. Not shown: Original</text>
  <text x="588" y="812" fill="#9b9082" font-size="10">title (it is an alias), director, actors, studio.</text>

  <!-- ─────────── 3. Stressed states ─────────── -->
  <text x="20" y="882" fill="#e8a33d" font-size="11" letter-spacing="1.2">3 — STRESSED STATES</text>
  <!-- 3a visitor, two providers -->
  <rect x="20" y="894" width="450" height="136" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="34" y="914" fill="#9b9082" font-size="10" letter-spacing="1">DETAILS · VISITOR · TWO PROVIDERS</text>
  <text x="34" y="938" fill="#9b9082" font-size="13">Released: <tspan fill="#f3ece1">1949-08-31</tspan></text>
  <rect x="166" y="927" width="13" height="13" rx="3" fill="#01b4e4"/>
  <text x="34" y="962" fill="#9b9082" font-size="13">Runtime (min): <tspan fill="#f3ece1">93</tspan></text>
  <rect x="144" y="951" width="34" height="14" rx="7" fill="#181310"/>
  <text x="161" y="962" fill="#9b9082" font-size="9" text-anchor="middle">P-2</text>
  <text x="34" y="986" fill="#9b9082" font-size="13">Genres:</text>
  <rect x="90" y="974" width="54" height="20" rx="10" fill="none" stroke="#2a2622"/>
  <text x="117" y="988" fill="#f3ece1" font-size="12" text-anchor="middle">Drama</text>
  <rect x="152" y="977" width="13" height="13" rx="3" fill="#01b4e4"/>
  <text x="34" y="1014" fill="#9b9082" font-size="10">No header note; each row carries its provenance badge.</text>

  <!-- 3b owner, non-canonical extra -->
  <rect x="490" y="894" width="450" height="136" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="504" y="914" fill="#9b9082" font-size="10" letter-spacing="1">DETAILS · OWNER · PROVIDER SENT AN EXTRA KEY</text>
  <text x="504" y="938" fill="#9b9082" font-size="13">Released: <tspan fill="#f3ece1">1949-08-31</tspan></text>
  <line x1="504" y1="952" x2="926" y2="952" stroke="#2a2622"/>
  <text x="504" y="968" fill="#9b9082" font-size="12">Additional details</text>
  <text x="504" y="992" fill="#9b9082" font-size="13">Region rating: <tspan fill="#f3ece1">PG</tspan></text>
  <rect x="612" y="981" width="34" height="14" rx="7" fill="#181310"/>
  <text x="629" y="992" fill="#9b9082" font-size="9" text-anchor="middle">P-2</text>
  <rect x="654" y="979" width="70" height="18" rx="9" fill="none" stroke="#2a2622"/>
  <text x="689" y="992" fill="#9b9082" font-size="11" text-anchor="middle">↑ Promote</text>
  <rect x="730" y="979" width="78" height="18" rx="9" fill="none" stroke="#2a2622"/>
  <text x="769" y="992" fill="#9b9082" font-size="11" text-anchor="middle">Attach to…</text>
  <text x="504" y="1018" fill="#9b9082" font-size="10">Same rows and pills as the studio page. TMDB sends no such key today.</text>
</svg>
