<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Media parts — part badge on the video card, and the part pill beside the title on the media header, film list and queue row</title>
  <desc>Four panels. One: three browse cards for the same concert, each with a neutral "Part N" badge in the poster's bottom-left corner beside the duration badge, under the accent resolution badge top-left. Two: the media page header with the title followed by an Extended edition pill and a Part 2 pill, and beneath it the Metadata Part row expanded into the source chip row with a custom value chip. Three: a film page full-film row with the title, edition pill, part pill, resolution badge and duration. Four: an enrichment queue row with the video title followed by the part pill.</desc>

  <rect width="900" height="620" fill="#0c0a09"/>

  <!-- ─────────── 1. Browse grid: VideoCard, bottom-left part badge (RD9 / handoff §1) ─────────── -->
  <text x="30" y="30" fill="#e8a33d" font-size="11" letter-spacing="1.2">1 — VIDEOCARD: PART BADGE, BOTTOM-LEFT CORNER, DURATION-STYLE (§1)</text>

  <g id="card1">
    <rect x="30" y="42" width="200" height="150" rx="8" fill="#15110e" stroke="#2a2622"/>
    <rect x="30" y="42" width="200" height="112" rx="8" fill="#1c1714"/>
    <rect x="30" y="146" width="200" height="8" fill="#1c1714"/>
    <rect x="36" y="48" width="38" height="14" rx="3" fill="#e8a33d"/>
    <text x="55" y="58.5" fill="#1a1207" font-size="9" font-weight="700" text-anchor="middle">1080p</text>
    <rect x="36" y="134" width="38" height="14" rx="3" fill="#000" fill-opacity="0.7"/>
    <text x="55" y="144.5" fill="#f3ece1" font-size="9.5" text-anchor="middle">Part 1</text>
    <rect x="182" y="134" width="42" height="14" rx="3" fill="#000" fill-opacity="0.7"/>
    <text x="203" y="144.5" fill="#f3ece1" font-size="9.5" text-anchor="middle">1:02:10</text>
    <text x="42" y="176" fill="#f3ece1" font-size="12" font-weight="500">Live at Budokan</text>
  </g>
  <g id="card2">
    <rect x="250" y="42" width="200" height="150" rx="8" fill="#15110e" stroke="#2a2622"/>
    <rect x="250" y="42" width="200" height="112" rx="8" fill="#1c1714"/>
    <rect x="250" y="146" width="200" height="8" fill="#1c1714"/>
    <rect x="256" y="48" width="38" height="14" rx="3" fill="#e8a33d"/>
    <text x="275" y="58.5" fill="#1a1207" font-size="9" font-weight="700" text-anchor="middle">1080p</text>
    <rect x="256" y="134" width="38" height="14" rx="3" fill="#000" fill-opacity="0.7"/>
    <text x="275" y="144.5" fill="#f3ece1" font-size="9.5" text-anchor="middle">Part 2</text>
    <rect x="408" y="134" width="36" height="14" rx="3" fill="#000" fill-opacity="0.7"/>
    <text x="426" y="144.5" fill="#f3ece1" font-size="9.5" text-anchor="middle">58:41</text>
    <text x="262" y="176" fill="#f3ece1" font-size="12" font-weight="500">Live at Budokan</text>
  </g>
  <g id="card3">
    <rect x="470" y="42" width="200" height="150" rx="8" fill="#15110e" stroke="#2a2622"/>
    <rect x="470" y="42" width="200" height="112" rx="8" fill="#1c1714"/>
    <rect x="470" y="146" width="200" height="8" fill="#1c1714"/>
    <rect x="476" y="48" width="38" height="14" rx="3" fill="#e8a33d"/>
    <text x="495" y="58.5" fill="#1a1207" font-size="9" font-weight="700" text-anchor="middle">1080p</text>
    <rect x="476" y="134" width="38" height="14" rx="3" fill="#000" fill-opacity="0.7"/>
    <text x="495" y="144.5" fill="#f3ece1" font-size="9.5" text-anchor="middle">Part 3</text>
    <rect x="628" y="134" width="36" height="14" rx="3" fill="#000" fill-opacity="0.7"/>
    <text x="646" y="144.5" fill="#f3ece1" font-size="9.5" text-anchor="middle">47:03</text>
    <text x="482" y="176" fill="#f3ece1" font-size="12" font-weight="500">Live at Budokan</text>
  </g>
  <g id="card-noparts">
    <rect x="690" y="42" width="180" height="150" rx="8" fill="#15110e" stroke="#2a2622" stroke-dasharray="3 3"/>
    <rect x="690" y="42" width="180" height="112" rx="8" fill="#1c1714"/>
    <rect x="690" y="146" width="180" height="8" fill="#1c1714"/>
    <rect x="696" y="48" width="34" height="14" rx="3" fill="#e8a33d"/>
    <text x="713" y="58.5" fill="#1a1207" font-size="9" font-weight="700" text-anchor="middle">720p</text>
    <rect x="828" y="134" width="36" height="14" rx="3" fill="#000" fill-opacity="0.7"/>
    <text x="846" y="144.5" fill="#f3ece1" font-size="9.5" text-anchor="middle">12:04</text>
    <text x="702" y="176" fill="#f3ece1" font-size="12" font-weight="500">No part → no badge</text>
  </g>
  <text x="30" y="212" fill="#9b9082" font-size="10">Top-left = resolution (accent). Top-right = scene badge, Films grids only. Bottom-left = part. Bottom-right = duration. Bottom edge is file facts; both badges share bg-black/70 · text-ink · text-xs · rounded-theme.</text>

  <!-- ─────────── 2. Media page header + Metadata row (handoff §2) ─────────── -->
  <text x="30" y="250" fill="#e8a33d" font-size="11" letter-spacing="1.2">2 — MEDIA PAGE: PILL BESIDE THE H1, EDITION THEN PART; METADATA ROW IS THE CURATION MOUNT (§2)</text>
  <rect x="30" y="262" width="840" height="150" rx="10" fill="#15110e" stroke="#2a2622"/>
  <text x="46" y="292" fill="#f3ece1" font-size="20" font-weight="600" font-family="'Fraunces Variable', serif">Live at Budokan</text>
  <rect x="216" y="278" width="66" height="18" rx="9" fill="#181310" stroke="#2a2622"/>
  <text x="249" y="290.5" fill="#9b9082" font-size="10.5" text-anchor="middle">Extended</text>
  <rect x="290" y="278" width="50" height="18" rx="9" fill="#181310" stroke="#2a2622"/>
  <text x="315" y="290.5" fill="#9b9082" font-size="10.5" text-anchor="middle">Part 2</text>
  <rect x="46" y="304" width="38" height="14" rx="3" fill="#e8a33d"/>
  <text x="65" y="314.5" fill="#1a1207" font-size="9" font-weight="700" text-anchor="middle">1080p</text>
  <text x="92" y="315" fill="#9b9082" font-size="11">1920×1080 · 58:41 · MKV</text>

  <line x1="46" y1="330" x2="854" y2="330" stroke="#2a2622"/>
  <text x="46" y="352" fill="#9b9082" font-size="10" letter-spacing="1">METADATA</text>
  <text x="46" y="376" fill="#9b9082" font-size="11">Part</text>
  <text x="180" y="376" fill="#f3ece1" font-size="12">2</text>
  <rect x="196" y="365" width="46" height="15" rx="3" fill="#181310" stroke="#2a2622"/>
  <text x="219" y="376" fill="#9b9082" font-size="9" text-anchor="middle">filename</text>
  <text x="180" y="400" fill="#9b9082" font-size="10">chip row (SourceBadge, expanded):</text>
  <rect x="350" y="389" width="58" height="16" rx="8" fill="#181310" stroke="#e8a33d"/>
  <text x="379" y="400.5" fill="#e8a33d" font-size="9.5" text-anchor="middle">file · 1</text>
  <rect x="414" y="389" width="78" height="16" rx="8" fill="#e8a33d"/>
  <text x="453" y="400.5" fill="#1a1207" font-size="9.5" font-weight="600" text-anchor="middle">filename · 2 ✓</text>
  <rect x="498" y="389" width="66" height="16" rx="8" fill="#181310" stroke="#2a2622" stroke-dasharray="2 2"/>
  <text x="531" y="400.5" fill="#9b9082" font-size="9.5" text-anchor="middle">custom…</text>
  <text x="580" y="400.5" fill="#6f665b" font-size="9.5">no provider chip, ever — part has no provider source (RD2)</text>

  <!-- ─────────── 3. Film page full-film row (handoff §3) ─────────── -->
  <text x="30" y="440" fill="#e8a33d" font-size="11" letter-spacing="1.2">3 — FILM PAGE FULL-FILM ROW: PILL BESIDE THE EDITION PILL; NO "+ SET PART" LINK (§3)</text>
  <rect x="30" y="452" width="840" height="40" rx="8" fill="#15110e" stroke="#2a2622"/>
  <text x="46" y="477" fill="#f3ece1" font-size="12">Live at Budokan</text>
  <rect x="150" y="465" width="56" height="16" rx="8" fill="#181310" stroke="#2a2622"/>
  <text x="178" y="476" fill="#9b9082" font-size="9.5" text-anchor="middle">Extended</text>
  <rect x="212" y="465" width="44" height="16" rx="8" fill="#181310" stroke="#2a2622"/>
  <text x="234" y="476" fill="#9b9082" font-size="9.5" text-anchor="middle">Part 2</text>
  <rect x="770" y="465" width="34" height="14" rx="3" fill="#e8a33d"/>
  <text x="787" y="475.5" fill="#1a1207" font-size="9" font-weight="700" text-anchor="middle">1080p</text>
  <text x="814" y="476" fill="#9b9082" font-size="11">58:41</text>

  <!-- ─────────── 4. Enrichment queue row (handoff §4) ─────────── -->
  <text x="30" y="522" fill="#e8a33d" font-size="11" letter-spacing="1.2">4 — OWNER QUEUE ROW (/owner/enrichment, F48 REVIEW QUEUE): PILL AFTER THE TRUNCATED TITLE (§4)</text>
  <rect x="30" y="534" width="840" height="72" rx="8" fill="#15110e" stroke="#2a2622"/>
  <text x="46" y="558" fill="#f3ece1" font-size="12" text-decoration="underline">Live at Budokan</text>
  <rect x="150" y="547" width="44" height="16" rx="8" fill="#181310" stroke="#2a2622"/>
  <text x="172" y="558" fill="#9b9082" font-size="9.5" text-anchor="middle">Part 1</text>
  <text x="620" y="558" fill="#9b9082" font-size="10.5">TMDB · Cheap Trick at Budokan (1979)</text>
  <line x1="46" y1="570" x2="854" y2="570" stroke="#2a2622"/>
  <text x="46" y="592" fill="#f3ece1" font-size="12" text-decoration="underline">Live at Budokan</text>
  <rect x="150" y="581" width="44" height="16" rx="8" fill="#181310" stroke="#2a2622"/>
  <text x="172" y="592" fill="#9b9082" font-size="9.5" text-anchor="middle">Part 2</text>
  <text x="620" y="592" fill="#9b9082" font-size="10.5">TMDB · Cheap Trick at Budokan (1979)</text>
</svg>
