<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Archivo, 'Archivo Variable', sans-serif">
  <!-- HOLODEX-144 chip-row provenance, option B (owner pick 2026-10-24). Cinémathèque tokens:
       bg #0c0a09, surface-2 #181310, rule #2a2622, ink #f3ece1, muted #9b9082, accent #e8a33d,
       logo-plate #e9e0d0 / ink #2a2018. Text widths measured in the app (Archivo Variable 12px);
       chips are 24px tall (min-h-6, HOLODEX-357), px-2, gap-1 inside, gap-1.5 between chips.
       The field is Director, a standard one with a file-tag baseline that the media page renders
       as a chip row (Actors render in the People section, not as chips); the provider is a
       generic "provider-1" with its monogram "P" (docs/reference/doc-types.md, "Examples"). -->
  <rect width="900" height="260" fill="#0c0a09"/>
  <text x="20" y="30" fill="#f3ece1" font-size="14" font-weight="500">Today</text>
  <text x="470" y="30" fill="#e8a33d" font-size="14" font-weight="500">After: one row badge, icons only when mixed</text>
  <line x1="450" y1="14" x2="450" y2="190" stroke="#2a2622"/>

  <!-- row labels + the scenario each row shows -->
  <g font-size="12" fill="#9b9082">
    <text x="20" y="68">Director</text><text x="20" y="116">Director</text><text x="20" y="164">Director</text>
    <text x="470" y="68">Director</text><text x="470" y="116">Director</text><text x="470" y="164">Director</text>
  </g>
  <g font-size="10" fill="#9b9082">
    <text x="20" y="82">mixed</text><text x="20" y="130">all provider-1</text><text x="20" y="178">all file</text>
    <text x="470" y="82">mixed</text><text x="470" y="130">all provider-1</text><text x="470" y="178">all file</text>
  </g>

  <!-- ===== Today: every chip ends in a ·source suffix ===== -->
  <g font-size="12">
    <rect x="80" y="56" width="131.4" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="89" y="72" fill="#f3ece1">Ana Keßler</text><text x="151.9" y="72" fill="#e8a33d" font-size="10.4">·provider-1</text>
    <rect x="217.4" y="56" width="83.5" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="226.4" y="72" fill="#f3ece1">Rui Dias</text><text x="275.1" y="72" fill="#9b9082" font-size="10.4">·file</text>
    <rect x="306.9" y="56" width="128.4" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="315.9" y="72" fill="#f3ece1">Mara Voss</text><text x="375.8" y="72" fill="#e8a33d" font-size="10.4">·provider-1</text>

    <rect x="80" y="104" width="127" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="89" y="120" fill="#f3ece1">Lena Ortiz</text><text x="147.5" y="120" fill="#e8a33d" font-size="10.4">·provider-1</text>
    <rect x="213" y="104" width="128.4" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="222" y="120" fill="#f3ece1">Mara Voss</text><text x="281.9" y="120" fill="#e8a33d" font-size="10.4">·provider-1</text>

    <rect x="80" y="152" width="83.5" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="89" y="168" fill="#f3ece1">Rui Dias</text><text x="137.7" y="168" fill="#9b9082" font-size="10.4">·file</text>
  </g>

  <!-- ===== After ===== -->
  <g font-size="12" fill="#f3ece1">
    <!-- mixed: provider values carry a 12px icon, the file value carries nothing, no row badge -->
    <rect x="530" y="56" width="92.9" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="539" y="72">Ana Keßler</text>
    <rect x="601.9" y="62" width="12" height="12" rx="2" fill="#e9e0d0"/><text x="607.9" y="71.5" fill="#2a2018" font-size="8.5" text-anchor="middle" font-family="Fraunces, Georgia, serif">P</text>
    <rect x="628.9" y="56" width="62.7" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="637.9" y="72">Rui Dias</text>
    <rect x="697.6" y="56" width="89.9" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="706.6" y="72">Mara Voss</text>
    <rect x="766.5" y="62" width="12" height="12" rx="2" fill="#e9e0d0"/><text x="772.5" y="71.5" fill="#2a2018" font-size="8.5" text-anchor="middle" font-family="Fraunces, Georgia, serif">P</text>

    <!-- one provider for the whole row: plain chips + one trailing 16px ProvenanceBadge (ml-2 after the row gap) -->
    <rect x="530" y="104" width="72.5" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="539" y="120">Lena Ortiz</text>
    <rect x="608.5" y="104" width="73.9" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="617.5" y="120">Mara Voss</text>
    <rect x="696.4" y="108" width="16" height="16" rx="2" fill="#e9e0d0"/><text x="704.4" y="120.5" fill="#2a2018" font-size="11" text-anchor="middle" font-family="Fraunces, Georgia, serif">P</text>

    <!-- all baseline: plain chips + the same muted "file" pill a single file value shows -->
    <rect x="530" y="152" width="62.7" height="24" rx="12" fill="#181310" stroke="#2a2622"/><text x="539" y="168">Rui Dias</text>
    <rect x="606.7" y="154" width="31.3" height="20" rx="10" fill="#181310"/><text x="614.7" y="168" fill="#9b9082">file</text>
  </g>

  <g font-size="11" fill="#9b9082">
    <text x="20" y="220">Every chip repeats its source as text.</text>
    <text x="470" y="220">A row of one source reads like a single value.</text>
    <text x="470" y="236">Only a mixed row marks values, and only the provider ones.</text>
    <text x="20" y="252">"P" is the monogram fallback; a cached brand icon replaces it.</text>
  </g>
</svg>
