<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">Add an Overview (HOLODEX-471)</title>
  <desc id="d">Row 1: the Media Details rail, owner view, with no overview from any source, in the three skins: the OVERVIEW heading and pencil stay, and a dashed "+ Add overview" pill fills the empty body. Row 2, left: the existing Edit Overview dialog opened from the pill, with Custom pre-selected. Row 2, right: the Write metadata to file dialog, where the Overview row is now present with File "No value" and a typed Custom value that will be written.</desc>
  <defs>
    <symbol id="pen" viewBox="0 0 24 24"><path d="M16.9 3.6a2 2 0 0 1 2.8 2.8L8 18.1l-3.6.8.8-3.6L16.9 3.6zM15 5.5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
  <rect width="960" height="620" fill="#1e1e1e"/>
  <text x="16" y="26" font-family="system-ui, sans-serif" font-size="14" fill="#cfcfcf">1 · Media Details rail, owner, no overview from the file or any provider (option B)</text>

  <!-- Cinémathèque -->
  <g font-family="Archivo, system-ui, sans-serif">
    <rect x="16" y="40" width="296" height="160" rx="2" fill="#0c0a09" stroke="#2a2622"/>
    <text x="28" y="60" font-size="11" fill="#9b9082">cinematheque</text>
    <text x="28" y="86" font-size="12" letter-spacing="0.72" fill="#9b9082">OVERVIEW</text>
    <use href="#pen" x="100" y="76" width="12" height="12" color="#9b9082"/>
    <rect x="28" y="96" width="106" height="22" rx="11" fill="none" stroke="#9b9082" stroke-dasharray="3 2"/>
    <use href="#plus" x="37" y="101" width="12" height="12" color="#e8a33d"/>
    <text x="53" y="111" font-size="12" fill="#e8a33d">Add overview</text>
    <text x="28" y="146" font-size="12" letter-spacing="0.72" fill="#9b9082">TAGS</text>
    <rect x="28" y="156" width="54" height="22" rx="11" fill="#181310"/>
    <text x="40" y="171" font-size="12" fill="#f3ece1">horror</text>
  </g>

  <!-- Broadcast -->
  <g font-family="'Share Tech Mono', ui-monospace, monospace">
    <rect x="332" y="40" width="296" height="160" fill="#060814" stroke="#1a2240"/>
    <text x="344" y="60" font-size="11" fill="#6f7da6">broadcast</text>
    <text x="344" y="86" font-size="12" letter-spacing="0.72" fill="#6f7da6">OVERVIEW</text>
    <use href="#pen" x="422" y="76" width="12" height="12" color="#6f7da6"/>
    <rect x="344" y="96" width="126" height="22" rx="11" fill="none" stroke="#6f7da6" stroke-dasharray="3 2"/>
    <use href="#plus" x="353" y="101" width="12" height="12" color="#36e0d0"/>
    <text x="369" y="111" font-size="12" fill="#36e0d0">Add overview</text>
    <text x="344" y="146" font-size="12" letter-spacing="0.72" fill="#6f7da6">TAGS</text>
    <rect x="344" y="156" width="62" height="22" rx="11" fill="#0a0e1f"/>
    <text x="356" y="171" font-size="12" fill="#dfe9ff">horror</text>
  </g>

  <!-- Brutalist -->
  <g font-family="'Spline Sans Mono', ui-monospace, monospace">
    <rect x="648" y="40" width="296" height="160" fill="#0a0a0a" stroke="#333333"/>
    <text x="660" y="60" font-size="11" fill="#8a8a8a">brutalist</text>
    <text x="660" y="86" font-size="12" letter-spacing="0.72" fill="#8a8a8a">OVERVIEW</text>
    <use href="#pen" x="738" y="76" width="12" height="12" color="#8a8a8a"/>
    <rect x="660" y="96" width="126" height="22" rx="11" fill="none" stroke="#8a8a8a" stroke-dasharray="3 2"/>
    <use href="#plus" x="669" y="101" width="12" height="12" color="#d6ff3f"/>
    <text x="685" y="111" font-size="12" fill="#d6ff3f">Add overview</text>
    <text x="660" y="146" font-size="12" letter-spacing="0.72" fill="#8a8a8a">TAGS</text>
    <rect x="660" y="156" width="62" height="22" rx="11" fill="#111111"/>
    <text x="672" y="171" font-size="12" fill="#fafafa">horror</text>
  </g>

  <text x="16" y="232" font-family="system-ui, sans-serif" font-size="14" fill="#cfcfcf">2 · Pill or pencil → the existing Edit Overview dialog</text>
  <text x="496" y="232" font-family="system-ui, sans-serif" font-size="14" fill="#cfcfcf">3 · Write metadata to file: the Overview row is present</text>

  <!-- Edit Overview dialog (cinematheque) -->
  <g font-family="Archivo, system-ui, sans-serif">
    <rect x="16" y="244" width="464" height="300" fill="#0c0a09" fill-opacity="0.7" stroke="#2a2622"/>
    <rect x="24" y="258" width="448" height="272" rx="2" fill="#15110e" stroke="#2a2622"/>
    <text x="40" y="288" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600" fill="#f3ece1">Edit Overview</text>
    <rect x="40" y="302" width="416" height="52" rx="2" fill="none" stroke="#2a2622"/>
    <circle cx="54" cy="318" r="6" fill="none" stroke="#9b9082"/>
    <text x="68" y="322" font-size="12" letter-spacing="0.72" fill="#9b9082">FILE</text>
    <text x="68" y="342" font-size="14" fill="#9b9082">No value</text>
    <rect x="40" y="362" width="416" height="118" rx="2" fill="#e8a33d" fill-opacity="0.1" stroke="#e8a33d"/>
    <circle cx="54" cy="378" r="6" fill="none" stroke="#e8a33d"/>
    <circle cx="54" cy="378" r="3" fill="#e8a33d"/>
    <text x="68" y="382" font-size="12" letter-spacing="0.72" fill="#e8a33d">CUSTOM</text>
    <rect x="64" y="392" width="384" height="80" rx="2" fill="#0c0a09" stroke="#e8a33d"/>
    <text x="72" y="412" font-size="14" fill="#f3ece1">A lighthouse keeper on a storm-cut island begins</text>
    <text x="72" y="432" font-size="14" fill="#f3ece1">to suspect the relief boat is never coming.<tspan fill="#e8a33d">|</tspan></text>
    <rect x="316" y="492" width="68" height="28" rx="2" fill="none" stroke="#2a2622"/>
    <text x="350" y="510" font-size="14" fill="#f3ece1" text-anchor="middle">Cancel</text>
    <rect x="392" y="492" width="64" height="28" rx="2" fill="#e8a33d"/>
    <text x="424" y="510" font-size="14" font-weight="600" fill="#0c0a09" text-anchor="middle">Save</text>
  </g>

  <!-- Writeback dialog (cinematheque) -->
  <g font-family="Archivo, system-ui, sans-serif">
    <rect x="496" y="244" width="448" height="360" rx="2" fill="#15110e" stroke="#2a2622"/>
    <text x="510" y="268" font-size="14" font-weight="600" fill="#f3ece1">Write metadata to file</text>
    <path d="M922 258l10 10M932 258l-10 10" stroke="#9b9082" stroke-width="1.5"/>
    <line x1="496" y1="280" x2="944" y2="280" stroke="#2a2622"/>
    <text x="510" y="300" font-family="ui-monospace, monospace" font-size="12" fill="#9b9082">/media/films/the-keeper-1974.mkv</text>
    <path d="M518 316v8M514 320l4 4 4-4M512 328h12" fill="none" stroke="#e8a33d" stroke-width="1.5" stroke-linecap="round"/>
    <text x="536" y="326" font-size="12" font-weight="500" fill="#9b9082">Overview <tspan font-size="11" font-weight="400">·custom → {write target}</tspan></text>
    <rect x="536" y="336" width="392" height="50" rx="2" fill="none" stroke="#2a2622"/>
    <circle cx="550" cy="352" r="6" fill="none" stroke="#9b9082"/>
    <text x="564" y="356" font-size="12" letter-spacing="0.72" fill="#9b9082">FILE</text>
    <text x="564" y="376" font-size="14" fill="#9b9082">No value</text>
    <rect x="536" y="394" width="392" height="104" rx="2" fill="#e8a33d" fill-opacity="0.1" stroke="#e8a33d"/>
    <circle cx="550" cy="410" r="6" fill="none" stroke="#e8a33d"/>
    <circle cx="550" cy="410" r="3" fill="#e8a33d"/>
    <text x="564" y="414" font-size="12" letter-spacing="0.72" fill="#e8a33d">CUSTOM</text>
    <rect x="560" y="424" width="360" height="66" rx="2" fill="#0c0a09" stroke="#2a2622"/>
    <text x="568" y="444" font-size="14" fill="#f3ece1">A lighthouse keeper on a storm-cut island</text>
    <text x="568" y="464" font-size="14" fill="#f3ece1">begins to suspect the relief boat is never</text>
    <text x="568" y="484" font-size="14" fill="#f3ece1">coming.</text>
    <line x1="510" y1="510" x2="930" y2="510" stroke="#2a2622"/>
    <text x="518" y="530" font-size="14" fill="#9b9082" text-anchor="middle">=</text>
    <text x="536" y="530" font-size="12" font-weight="500" fill="#9b9082">Tagline</text>
    <text x="536" y="548" font-size="12" fill="#9b9082"><tspan fill="#f3ece1">The sea keeps what it takes.</tspan> — matches the file</text>
    <line x1="496" y1="562" x2="944" y2="562" stroke="#2a2622"/>
    <rect x="690" y="572" width="68" height="26" rx="2" fill="none" stroke="#2a2622"/>
    <text x="724" y="589" font-size="14" fill="#f3ece1" text-anchor="middle">Cancel</text>
    <rect x="766" y="572" width="164" height="26" rx="2" fill="#e8a33d"/>
    <text x="848" y="589" font-size="14" font-weight="500" fill="#0c0a09" text-anchor="middle">Write 1 field to file</text>
  </g>
</svg>
