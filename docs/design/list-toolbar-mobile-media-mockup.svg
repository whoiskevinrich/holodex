<title id="t">F73 list toolbar, mobile Media: the worst-case toolbar and the Filters sheet, three skins</title>
<desc id="d">375px viewport, main px-6. Toolbar: native sort select (flex, min-w-0) with the longest label, a compact funnel Filters button with the active count, and the owner ⋯ menu. Active-filter chips sit above the count line. The sheet is shown open over a bg/70 backdrop. Real Cinémathèque, Broadcast and Brutalist tokens at component sizes: 14px controls, 12px captions and chips, 18px sheet title.</desc>
