<text x="8" y="161" font-size="9.5" fill="#5f5e5a" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start" >Busy is the only arc that ever moves — motion, not length, marks it. No toast, no picker, no confirm.</text>
