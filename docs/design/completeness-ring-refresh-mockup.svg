<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
<title id="t">Completeness ring as a button — F65.8 states and hoisted mounts</title>
<desc id="d">Top: the ring button’s six states in the default skin — idle (cursor pointer, title “Refresh enrichment”), keyboard focus (accent focus ring), busy (a fixed quarter accent arc that spins, aria-busy, disabled), done (redrawn to the re-read bands), reduced motion (arc held still, ring dimmed), and failed or rate-limited (back to idle with the bands it had). Bottom: how each mount lifts the ring out of its link — the video card puts the bottom-left badge group in a sibling overlay that mirrors the frame’s aspect ratio; the person poster card wraps a stretched link whose ::after covers the card with the ring as a z-indexed sibling on the caption line; the people and studio rows carry the border on a wrapper div, stretch the link or select-mode label the same way, and render ring plus count as a trailing sibling snippet.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
