<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" font-family="Archivo, 'Archivo Variable', system-ui, sans-serif" role="img">
  <title>F82 Table view, desktop, Cinémathèque</title>
  <desc>Media, People and Tags in the shared Table view: 44px hairline rows, uppercase muted headers, the active sort header in accent with a direction arrow.</desc>
  <defs>
    <g id="ring70"><circle cx="7" cy="7" r="4.9" fill="none" stroke="#9b9082" stroke-width="2.1"/><circle cx="7" cy="7" r="4.9" fill="none" stroke="#e8a33d" stroke-width="2.1" stroke-dasharray="21.5 30.8" transform="rotate(-90 7 7)"/></g>
    <g id="ring30"><circle cx="7" cy="7" r="4.9" fill="none" stroke="#9b9082" stroke-width="2.1"/><circle cx="7" cy="7" r="4.9" fill="none" stroke="#e8a33d" stroke-width="2.1" stroke-dasharray="9.2 30.8" transform="rotate(-90 7 7)"/></g>
    <g id="ring100"><circle cx="7" cy="7" r="4.9" fill="none" stroke="#e8a33d" stroke-width="2.1"/></g>
    <rect id="thumb" width="48" height="27" rx="2" fill="#181310" stroke="#2a2622"/>
    <rect id="ava" width="32" height="32" rx="2" fill="#181310" stroke="#2a2622"/>
  </defs>
  <rect width="1040" height="900" fill="#0c0a09"/>

  <!-- Media -->
  <text x="24" y="22" font-size="12" fill="#6f665b" letter-spacing=".04em">MEDIA · OWNER · SORTED BY DATE ADDED (NEWEST FIRST)</text>
  <rect x="24.5" y="36.5" width="170" height="32" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="36" y="57" font-size="14" fill="#f3ece1">Recently added</text><path d="M176 50l4 4 4-4" fill="none" stroke="#9b9082" stroke-width="1.5"/>
  <rect x="202.5" y="36.5" width="84" height="32" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="216" y="57" font-size="14" fill="#f3ece1">Filters</text>
  <rect x="828.5" y="36.5" width="152" height="32" rx="2" fill="#15110e" stroke="#2a2622"/>
  <g fill="none" stroke="#9b9082" stroke-width="1.3"><rect x="841" y="46" width="5" height="5"/><rect x="849" y="46" width="5" height="5"/><rect x="841" y="54" width="5" height="5"/><rect x="849" y="54" width="5" height="5"/></g>
  <text x="861" y="57" font-size="14" fill="#9b9082">Grid</text>
  <rect x="902" y="37" width="78" height="31" fill="#e8a33d"/>
  <g fill="none" stroke="#1a1206" stroke-width="1.3"><rect x="914" y="46" width="13" height="13"/><path d="M914 50.5h13M914 54.5h13M919 46v13"/></g>
  <text x="934" y="57" font-size="14" fill="#1a1206" font-weight="500">Table</text>
  <rect x="988.5" y="36.5" width="28" height="32" rx="2" fill="#15110e" stroke="#2a2622"/><text x="996" y="57" font-size="14" fill="#9b9082">⋯</text>
  <text x="24" y="98" font-size="14" fill="#9b9082">38 videos</text>
  <text x="560" y="98" font-size="12" fill="#6f665b">density slider hidden in Table</text>

  <g font-size="12" fill="#9b9082" letter-spacing=".04em" font-weight="500">
    <text x="32" y="134">TITLE</text>
    <text x="650" y="134" text-anchor="end">DURATION</text>
    <text x="674" y="134">RES</text>
    <text x="744" y="134" fill="#e8a33d">ADDED ↓</text>
    <text x="920" y="134" text-anchor="end">SIZE</text>
    <text x="952" y="134">DONE</text>
  </g>
  <line x1="24" y1="144.5" x2="1016" y2="144.5" stroke="#2a2622"/>

  <rect x="24" y="189" width="992" height="43" fill="#181310"/>
  <rect x="24.5" y="233.5" width="991" height="42" fill="none" stroke="#e8a33d"/>
  <g font-size="14" fill="#f3ece1">
    <use href="#thumb" x="32" y="153"/><text x="92" y="171">Harbor at dusk</text>
    <use href="#thumb" x="32" y="197"/><text x="92" y="215">The long road north, part two</text>
    <use href="#thumb" x="32" y="241"/><text x="92" y="259">Interview, studio session</text>
    <use href="#thumb" x="32" y="285"/><text x="92" y="303">A very long title that keeps going past the end of its column and trunc…</text>
    <use href="#thumb" x="32" y="329"/><text x="92" y="347">Morning market</text>
  </g>
  <g font-size="14" fill="#9b9082" text-anchor="end" style="font-variant-numeric:tabular-nums">
    <text x="650" y="171">1:42:10</text><text x="650" y="215">48:03</text><text x="650" y="259">6:21</text><text x="650" y="303">22:40</text><text x="650" y="347">9:05</text>
    <text x="920" y="171">18.2 GB</text><text x="920" y="215">3.1 GB</text><text x="920" y="259">212 MB</text><text x="920" y="303">1.4 GB</text><text x="920" y="347">640 MB</text>
  </g>
  <g font-size="10" font-weight="600" fill="#1a1206">
    <rect x="674" y="158" width="24" height="16" rx="2" fill="#e8a33d"/><text x="679" y="170">4K</text>
    <rect x="674" y="202" width="30" height="16" rx="2" fill="#e8a33d"/><text x="679" y="214">FHD</text>
    <rect x="674" y="246" width="25" height="16" rx="2" fill="#e8a33d"/><text x="679" y="258">SD</text>
    <rect x="674" y="290" width="25" height="16" rx="2" fill="#e8a33d"/><text x="679" y="302">HD</text>
    <rect x="674" y="334" width="30" height="16" rx="2" fill="#e8a33d"/><text x="679" y="346">FHD</text>
  </g>
  <g font-size="14" fill="#f3ece1">
    <text x="744" y="171">12 Oct</text><text x="744" y="215">9 Oct</text><text x="744" y="259">2 Sep</text><text x="744" y="303">30 Aug</text><text x="744" y="347">3 Mar 2025</text>
  </g>
  <use href="#ring70" x="952" y="159"/><use href="#ring30" x="952" y="203"/><use href="#ring100" x="952" y="247"/><use href="#ring30" x="952" y="291"/><use href="#ring70" x="952" y="335"/>
  <g stroke="#2a2622"><line x1="24" y1="188.5" x2="1016" y2="188.5"/><line x1="24" y1="232.5" x2="1016" y2="232.5"/><line x1="24" y1="276.5" x2="1016" y2="276.5"/><line x1="24" y1="320.5" x2="1016" y2="320.5"/><line x1="24" y1="364.5" x2="1016" y2="364.5"/></g>
  <text x="24" y="384" font-size="12" fill="#6f665b">row 2: hover (surface-2) · row 3: keyboard focus (1px accent ring) · row 4: title truncates with an ellipsis, never wraps</text>

  <!-- People -->
  <text x="24" y="428" font-size="12" fill="#6f665b" letter-spacing=".04em">PEOPLE · OWNER · SORTED BY NAME (A–Z)</text>
  <g font-size="12" fill="#9b9082" letter-spacing=".04em" font-weight="500">
    <text x="32" y="460" fill="#e8a33d">NAME ↑</text>
    <text x="900" y="460" text-anchor="end">VIDEOS</text>
    <text x="952" y="460">DONE</text>
  </g>
  <line x1="24" y1="470.5" x2="1016" y2="470.5" stroke="#2a2622"/>
  <g font-size="14" fill="#f3ece1">
    <use href="#ava" x="32" y="476"/><text x="76" y="497">Ada Marlow</text>
    <use href="#ava" x="32" y="520"/><text x="76" y="541">Bea Okafor</text>
    <use href="#ava" x="32" y="564"/><text x="76" y="585">Cal Brennan</text>
  </g>
  <g font-size="14" fill="#9b9082" text-anchor="end"><text x="900" y="497">42</text><text x="900" y="541">7</text><text x="900" y="585">118</text></g>
  <use href="#ring100" x="952" y="485"/><use href="#ring30" x="952" y="529"/><use href="#ring70" x="952" y="573"/>
  <g stroke="#2a2622"><line x1="24" y1="514.5" x2="1016" y2="514.5"/><line x1="24" y1="558.5" x2="1016" y2="558.5"/><line x1="24" y1="602.5" x2="1016" y2="602.5"/></g>

  <!-- Tags -->
  <text x="24" y="646" font-size="12" fill="#6f665b" letter-spacing=".04em">TAGS · ALL TAB · VISITOR · SORTED BY VIDEOS (MOST FIRST) · TAG ROWS, THEN CATEGORY ROWS</text>
  <g font-size="12" fill="#9b9082" letter-spacing=".04em" font-weight="500">
    <text x="32" y="678">NAME</text>
    <text x="600" y="678" text-anchor="end" fill="#e8a33d">VIDEOS ↓</text>
    <text x="640" y="678">PARENT</text>
  </g>
  <line x1="24" y1="688.5" x2="1016" y2="688.5" stroke="#2a2622"/>
  <g font-size="14" fill="#f3ece1"><text x="32" y="715">noir</text><text x="32" y="759">rooftops</text><text x="640" y="759">city</text></g>
  <g font-size="14" fill="#9b9082" text-anchor="end"><text x="600" y="715">142</text><text x="600" y="759">38</text></g>
  <path d="M32 790.5h6.5l5 5-6.5 6.5-5-5z" fill="none" stroke="#e8a33d" stroke-width="1.3"/>
  <text x="52" y="803" font-size="14" fill="#f3ece1">city</text>
  <text x="600" y="803" font-size="14" fill="#9b9082" text-anchor="end">12 tags</text>
  <g stroke="#2a2622"><line x1="24" y1="732.5" x2="1016" y2="732.5"/><line x1="24" y1="776.5" x2="1016" y2="776.5"/><line x1="24" y1="820.5" x2="1016" y2="820.5"/></g>
  <text x="24" y="844" font-size="12" fill="#6f665b">category rows carry the accent tag icon, as category pills do · an empty parent cell stays blank · owner: Manage tags adds a ⋯ cell at the row's right end</text>
</svg>
