<rect x="910" y="380" width="14" height="3" fill="#9b9082" rx="1"/><rect x="930" y="380" width="14" height="3" fill="#9b9082" rx="1"/><rect x="950" y="380" width="14" height="3" fill="#9b9082" rx="1"/>
<rect x="520" y="392" width="77" height="218" fill="#100d0b"/>
<rect x="903" y="392" width="77" height="218" fill="#100d0b"/>
