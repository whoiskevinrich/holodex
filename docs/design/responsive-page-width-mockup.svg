<rect x="300" y="452" width="172" height="56" fill="#15110e" stroke="#2a2622" rx="2"/>
<text x="307" y="466" fill="#9b9082" font-size="10">Films</text>
<rect x="307" y="472" width="22" height="28" rx="2" fill="#1f1a16" stroke="#2a2622"/><rect x="333" y="472" width="22" height="28" rx="2" fill="#1f1a16" stroke="#2a2622"/><rect x="359" y="472" width="22" height="28" rx="2" fill="#1f1a16" stroke="#2a2622"/><rect x="385" y="472" width="22" height="28" rx="2" fill="#1f1a16" stroke="#2a2622"/>
<rect x="300" y="516" width="172" height="86" fill="#15110e" stroke="#2a2622" rx="2"/>
<text x="307" y="530" fill="#9b9082" font-size="10">Metadata</text>
<rect x="307" y="540" width="48" height="5" rx="2" fill="#332d27"/><rect x="361" y="540" width="80" height="5" rx="2" fill="#4a4239"/>
<rect x="307" y="554" width="42" height="5" rx="2" fill="#332d27"/><rect x="355" y="554" width="88" height="5" rx="2" fill="#4a4239"/>
<rect x="307" y="568" width="54" height="5" rx="2" fill="#332d27"/><rect x="367" y="568" width="72" height="5" rx="2" fill="#4a4239"/>
