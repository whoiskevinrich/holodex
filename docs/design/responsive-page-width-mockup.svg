<line x1="20" y1="609" x2="480" y2="609" stroke="#e8a33d" stroke-dasharray="4 3"/>

<text x="520" y="360" fill="#9b9082" font-size="12">D — wider cap: 1280px, still one column</text>
<rect x="520" y="370" width="460" height="240" fill="#0c0a09" stroke="#2a2622" rx="4"/>
<line x1="520" y1="392" x2="980" y2="392" stroke="#2a2622"/>
