<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="Archivo, 'Segoe UI', sans-serif">
  <title>Media title rename: clipped input today vs. edit in place (HOLODEX-512)</title>
  <rect width="760" height="640" fill="#0c0a09"/>

  <!-- 1 · today -->
  <text x="24" y="34" fill="#9b9082" font-size="13">1 · Today (desktop, 700px header row): the wrapper shrinks to the input's ~20ch intrinsic width</text>
  <rect x="24" y="48" width="700" height="44" fill="none" stroke="#2a2622" stroke-dasharray="4 4"/>
  <rect x="24" y="52" width="246" height="36" rx="2" fill="#15110e" stroke="#e8a33d"/>
  <text x="36" y="76" fill="#f3ece1" font-size="18">…Goes On and On (Remas</text>
  <rect x="278" y="55" width="54" height="30" rx="2" fill="none" stroke="#e8a33d"/>
  <text x="290" y="75" fill="#e8a33d" font-size="14">Save</text>
  <rect x="340" y="55" width="66" height="30" rx="2" fill="none" stroke="#2a2622"/>
  <text x="352" y="75" fill="#f3ece1" font-size="14">Cancel</text>
  <rect x="414" y="59" width="96" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="426" y="75" fill="#9b9082" font-size="12">4K Remaster</text>
  <text x="530" y="75" fill="#9b9082" font-size="12" font-style="italic">← ~290px of the row unused</text>

  <!-- 2 · B desktop -->
  <text x="24" y="134" fill="#f3ece1" font-size="13">2 · Approved (B): the field takes the whole row, wraps, and wears the heading's own type</text>
  <rect x="24" y="148" width="700" height="78" rx="2" fill="#15110e" stroke="#e8a33d"/>
  <text x="36" y="180" fill="#f3ece1" font-size="24" font-weight="600" font-family="Fraunces, Georgia, serif">The Extraordinarily Long Director's Cut Title of a Film</text>
  <text x="36" y="212" fill="#f3ece1" font-size="24" font-weight="600" font-family="Fraunces, Georgia, serif">That Goes On and On (Remastered Edition)</text>
  <rect x="24" y="236" width="54" height="30" rx="2" fill="none" stroke="#e8a33d"/>
  <text x="36" y="256" fill="#e8a33d" font-size="14">Save</text>
  <rect x="86" y="236" width="66" height="30" rx="2" fill="none" stroke="#2a2622"/>
  <text x="98" y="256" fill="#f3ece1" font-size="14">Cancel</text>
  <rect x="24" y="276" width="96" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="36" y="292" fill="#9b9082" font-size="12">4K Remaster</text>
  <text x="140" y="292" fill="#9b9082" font-size="12" font-style="italic">edition pill wraps beneath while editing; back beside the title at rest</text>

  <!-- 3 · B at rest, unchanged -->
  <text x="24" y="340" fill="#9b9082" font-size="13">3 · At rest: unchanged. Title (h1), docked pencil, edition pill beside it when it fits</text>
  <text x="24" y="376" fill="#f3ece1" font-size="24" font-weight="600" font-family="Fraunces, Georgia, serif">The Extraordinarily Long Director's Cut Title of a Film</text>
  <text x="24" y="408" fill="#f3ece1" font-size="24" font-weight="600" font-family="Fraunces, Georgia, serif">That Goes On and On (Remastered Edition)</text>
  <rect x="568" y="388" width="28" height="28" rx="2" fill="none" stroke="#2a2622"/>
  <path d="M576 409 l2-6 9-9 4 4-9 9z" fill="none" stroke="#9b9082" stroke-width="1.5"/>
  <rect x="606" y="392" width="96" height="22" rx="11" fill="none" stroke="#2a2622"/>
  <text x="618" y="408" fill="#9b9082" font-size="12">4K Remaster</text>

  <!-- 4 · B phone -->
  <text x="24" y="458" fill="#9b9082" font-size="13">4 · Phone (375px, 16px gutters): the same field, more lines; buttons below</text>
  <rect x="24" y="472" width="343" height="112" rx="2" fill="#15110e" stroke="#e8a33d"/>
  <text x="36" y="502" fill="#f3ece1" font-size="24" font-weight="600" font-family="Fraunces, Georgia, serif">The Extraordinarily</text>
  <text x="36" y="534" fill="#f3ece1" font-size="24" font-weight="600" font-family="Fraunces, Georgia, serif">Long Director's Cut</text>
  <text x="36" y="566" fill="#f3ece1" font-size="24" font-weight="600" font-family="Fraunces, Georgia, serif">Title of a Film That…</text>
  <rect x="24" y="594" width="54" height="30" rx="2" fill="none" stroke="#e8a33d"/>
  <text x="36" y="614" fill="#e8a33d" font-size="14">Save</text>
  <rect x="86" y="594" width="66" height="30" rx="2" fill="none" stroke="#2a2622"/>
  <text x="98" y="614" fill="#f3ece1" font-size="14">Cancel</text>
  <text x="400" y="500" fill="#9b9082" font-size="12">Enter saves · Esc cancels</text>
  <text x="400" y="520" fill="#9b9082" font-size="12">Shift+Enter does nothing special:</text>
  <text x="400" y="538" fill="#9b9082" font-size="12">a title is one line, so newlines</text>
  <text x="400" y="556" fill="#9b9082" font-size="12">(typed or pasted) are saved as spaces.</text>
  <text x="400" y="580" fill="#9b9082" font-size="12">The field grows with its text; no inner scroll.</text>
</svg>
