<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1212" width="960" height="1212" role="img" aria-labelledby="t d">
<title id="t">File names (F86): owner tab, mode, settle window and ordered template editor</title>
<desc id="d">Owner → File names tab in the Cinémathèque look. Panel 1: the Renaming card with a five-way mode control (Off, Plan, Manual, On writeback, Job) set to Manual, the ordered template list with per-template counts, move up and down and remove buttons, a fourth template refused with an inline error, + Add template, the token insert chips and an unsaved-changes footer whose Save is withdrawn until the error is fixed. Panel 2: Job selected, showing the settle window input. Panel 3: mode Off, with the plan hidden.</desc>
<style>
text{font-family:"Archivo",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.serif{font-family:"Fraunces",Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-weight:400}
.ttl{font-size:12px;font-weight:600;fill:#2c2c2a}
.cap{font-size:11px;fill:#5f5e5a}
</style>
<rect width="960" height="1212" fill="#ffffff"/>
<text class="ttl" x="16" y="22">1 · Owner → File names, Manual mode, a draft with one refused template</text>
<text class="cap" x="16" y="37">The plan below the card (mockup 2) shows the draft's names once Preview runs.</text>
<rect x="16" y="48" width="928" height="716" rx="2" fill="#0c0a09"/>
<text x="40" y="90" class="serif" font-size="24" fill="#f3ece1" font-weight="600">Owner</text>
<text x="40" y="112" font-size="14" fill="#9b9082">Library management. Only you see this.</text>
<text x="52" y="146" font-size="14" fill="#9b9082">Status</text>
<text x="124.3" y="146" font-size="14" fill="#9b9082">Metadata keys</text>
<text x="243.7" y="146" font-size="14" fill="#9b9082">Attached keys</text>
<text x="363" y="146" font-size="14" fill="#9b9082">Duplicates</text>
<text x="462.2" y="146" font-size="14" fill="#9b9082">Deny-list</text>
<text x="554.7" y="146" font-size="14" fill="#9b9082">Enrichment</text>
<text x="653.9" y="146" font-size="14" fill="#9b9082">Extraction</text>
<rect x="741.1" y="126" width="91.2" height="30" rx="2" fill="#181310"/>
<text x="753.1" y="146" font-size="14" fill="#f3ece1">File names</text>
<text x="52" y="182" font-size="14" fill="#9b9082">Completeness</text>
<text x="164.6" y="182" font-size="14" fill="#9b9082">Trash</text>
<line x1="40" y1="204" x2="920" y2="204" stroke="#2a2622"/>
<text x="40" y="228" font-size="14" fill="#9b9082">Give the files on disk names built from your metadata. A name stays in its own folder and keeps</text>
<text x="40" y="248" font-size="14" fill="#9b9082">its extension. Nothing on disk changes until you rename.</text>
<rect x="40" y="268" width="880" height="472" rx="2" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
<text x="56" y="296" font-size="12" fill="#9b9082" letter-spacing="0.6">RENAMING</text>
<rect x="56" y="308" width="308.2" height="30" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="68" y="327.9" font-size="14" fill="#9b9082">Off</text>
<line x1="100.2" y1="309" x2="100.2" y2="337" stroke="#2a2622"/>
<text x="112.2" y="327.9" font-size="14" fill="#9b9082">Plan</text>
<line x1="151" y1="309" x2="151" y2="337" stroke="#2a2622"/>
<rect x="152" y="309" width="62.3" height="28" rx="1" fill="#181310"/>
<text x="163" y="327.9" font-size="14" fill="#f3ece1">Manual</text>
<line x1="215.4" y1="309" x2="215.4" y2="337" stroke="#2a2622"/>
<text x="227.4" y="327.9" font-size="14" fill="#9b9082">On writeback</text>
<line x1="320" y1="309" x2="320" y2="337" stroke="#2a2622"/>
<text x="332" y="327.9" font-size="14" fill="#9b9082">Job</text>
<text x="56" y="360" font-size="12" fill="#9b9082">Manual: preview every name, then rename one video, a selection or everything. Nothing renames on its own.</text>
<line x1="40" y1="380" x2="920" y2="380" stroke="#2a2622"/>
<text x="56" y="408" font-size="12" fill="#9b9082" letter-spacing="0.6">TEMPLATES</text>
<text x="148" y="408" font-size="12" fill="#9b9082">The first template whose every token has a value names the file. The extension never changes.</text>
<text x="60" y="445" class="mono" font-size="12" fill="#9b9082">1</text>
<rect x="78" y="424" width="420" height="32" rx="2" fill="#0c0a09" stroke="#2a2622" stroke-width="1"/>
<text x="88" y="445" class="mono" font-size="13" fill="#f3ece1">[{studio}] {title} ({year})</text>
<text x="512" y="445" font-size="12" fill="#9b9082">names 2,890</text>
<text x="575.4" y="445" font-size="12" fill="#9b9082"> · </text>
<text x="592.6" y="445" font-size="12" fill="#e2603f">15 won't read back</text>
<text x="834" y="445" font-size="14" fill="#2a2622" text-anchor="middle">↑</text>
<text x="862" y="445" font-size="14" fill="#9b9082" text-anchor="middle">↓</text>
<text x="890" y="445" font-size="14" fill="#9b9082" text-anchor="middle">×</text>
<text x="60" y="485" class="mono" font-size="12" fill="#9b9082">2</text>
<rect x="78" y="464" width="420" height="32" rx="2" fill="#0c0a09" stroke="#2a2622" stroke-width="1"/>
<text x="88" y="485" class="mono" font-size="13" fill="#f3ece1">{title} ({year})</text>
<text x="512" y="485" font-size="12" fill="#9b9082">names 640</text>
<text x="834" y="485" font-size="14" fill="#9b9082" text-anchor="middle">↑</text>
<text x="862" y="485" font-size="14" fill="#9b9082" text-anchor="middle">↓</text>
<text x="890" y="485" font-size="14" fill="#9b9082" text-anchor="middle">×</text>
<text x="60" y="525" class="mono" font-size="12" fill="#9b9082">3</text>
<rect x="78" y="504" width="420" height="32" rx="2" fill="#0c0a09" stroke="#2a2622" stroke-width="1"/>
<text x="88" y="525" class="mono" font-size="13" fill="#f3ece1">{title}</text>
<text x="512" y="525" font-size="12" fill="#9b9082">names 121</text>
<text x="834" y="525" font-size="14" fill="#9b9082" text-anchor="middle">↑</text>
<text x="862" y="525" font-size="14" fill="#9b9082" text-anchor="middle">↓</text>
<text x="890" y="525" font-size="14" fill="#9b9082" text-anchor="middle">×</text>
<text x="60" y="565" class="mono" font-size="12" fill="#9b9082">4</text>
<rect x="78" y="544" width="420" height="32" rx="2" fill="#0c0a09" stroke="#e2603f" stroke-width="1"/>
<text x="88" y="565" class="mono" font-size="13" fill="#f3ece1">{studio} {year}</text>
<line x1="206" y1="552" x2="206" y2="568" stroke="#e8a33d"/>
<text x="834" y="565" font-size="14" fill="#9b9082" text-anchor="middle">↑</text>
<text x="862" y="565" font-size="14" fill="#2a2622" text-anchor="middle">↓</text>
<text x="890" y="565" font-size="14" fill="#9b9082" text-anchor="middle">×</text>
<text x="78" y="586" font-size="12" fill="#e2603f">Add {title} or an identity token. Without one, unrelated videos could get the same name.</text>
<text x="78" y="623.9" font-size="14" fill="#9b9082">+ Add template</text>
<text x="56" y="648" font-size="12" fill="#9b9082">Insert a token:</text>
<rect x="152" y="634" width="66.4" height="20" rx="10" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="160" y="648" class="mono" font-size="12" fill="#f3ece1">{title}</text>
<rect x="224.4" y="634" width="73.6" height="20" rx="10" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="232.4" y="648" class="mono" font-size="12" fill="#f3ece1">{studio}</text>
<rect x="304" y="634" width="73.6" height="20" rx="10" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="312" y="648" class="mono" font-size="12" fill="#f3ece1">{people}</text>
<rect x="383.6" y="634" width="59.2" height="20" rx="10" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="391.6" y="648" class="mono" font-size="12" fill="#f3ece1">{year}</text>
<rect x="448.8" y="634" width="80.8" height="20" rx="10" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="456.8" y="648" class="mono" font-size="12" fill="#f3ece1">{edition}</text>
<rect x="535.6" y="634" width="59.2" height="20" rx="10" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="543.6" y="648" class="mono" font-size="12" fill="#f3ece1">{part}</text>
<rect x="600.8" y="634" width="124" height="20" rx="10" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="608.8" y="648" class="mono" font-size="12" fill="#f3ece1">{provider-1-id}</text>
<rect x="730.8" y="634" width="124" height="20" rx="10" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="738.8" y="648" class="mono" font-size="12" fill="#f3ece1">{provider-2-id}</text>
<text x="56" y="670" font-size="12" fill="#9b9082">Inserts at the cursor in the template you were last editing.</text>
<line x1="40" y1="688" x2="920" y2="688" stroke="#2a2622"/>
<text x="56" y="719" font-size="14" fill="#9b9082">Unsaved changes. The plan shows these templates after Preview.</text>
<rect x="785.9" y="699" width="118.1" height="30" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="797.9" y="718.9" font-size="14" fill="#9b9082">Save templates</text>
<rect x="706.9" y="699" width="71" height="30" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="718.9" y="718.9" font-size="14" fill="#f3ece1">Preview</text>
<text x="643.8" y="718.9" font-size="14" fill="#9b9082">Discard</text>
<text x="623.8" y="719" font-size="12" fill="#e2603f" text-anchor="end">Fix template 4 to save.</text>
<text class="ttl" x="16" y="804">2 · Job selected: the settle window appears under the mode control</text>
<text class="cap" x="16" y="819">On writeback and Job each say what they add; the window is shown only for Job.</text>
<rect x="16" y="830" width="928" height="150" rx="2" fill="#0c0a09"/>
<rect x="40" y="848" width="880" height="114" rx="2" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
<text x="56" y="876" font-size="12" fill="#9b9082" letter-spacing="0.6">RENAMING</text>
<rect x="56" y="888" width="308.2" height="30" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
<text x="68" y="907.9" font-size="14" fill="#9b9082">Off</text>
<line x1="100.2" y1="889" x2="100.2" y2="917" stroke="#2a2622"/>
<text x="112.2" y="907.9" font-size="14" fill="#9b9082">Plan</text>
<line x1="151" y1="889" x2="151" y2="917" stroke="#2a2622"/>
<text x="163" y="907.9" font-size="14" fill="#9b9082">Manual</text>
<line x1="215.4" y1="889" x2="215.4" y2="917" stroke="#2a2622"/>
<text x="227.4" y="907.9" font-size="14" fill="#9b9082">On writeback</text>
<line x1="320" y1="889" x2="320" y2="917" stroke="#2a2622"/>
<rect x="321" y="889" width="42.2" height="28" rx="1" fill="#181310"/>
<text x="332" y="907.9" font-size="14" fill="#f3ece1">Job</text>
<text x="56" y="940" font-size="12" fill="#9b9082">Job: a sweep renames every unlocked video whose new name hasn't changed for the settle window. Includes On writeback.</text>
<text x="526" y="908" font-size="14" fill="#9b9082">Settle window</text>
<rect x="630" y="888" width="56" height="30" rx="2" fill="#0c0a09" stroke="#2a2622" stroke-width="1"/>
<text x="646" y="908" font-size="14" fill="#f3ece1">7</text>
<text x="696" y="908" font-size="14" fill="#9b9082">days</text>
<text class="ttl" x="16" y="1020">3 · Off (the default): the card alone; no plan is computed</text>
<text class="cap" x="16" y="1035">On writeback adds: "When Holodex writes into a file whose name is out of date, it takes its new name too."</text>
<rect x="16" y="1046" width="928" height="150" rx="2" fill="#0c0a09"/>
<rect x="40" y="1064" width="880" height="114" rx="2" fill="#15110e" stroke="#2a2622" stroke-width="1"/>
<text x="56" y="1092" font-size="12" fill="#9b9082" letter-spacing="0.6">RENAMING</text>
<rect x="56" y="1104" width="308.2" height="30" rx="2" fill="none" stroke="#2a2622" stroke-width="1"/>
<rect x="57" y="1105" width="42.2" height="28" rx="1" fill="#181310"/>
<text x="68" y="1123.9" font-size="14" fill="#f3ece1">Off</text>
<line x1="100.2" y1="1105" x2="100.2" y2="1133" stroke="#2a2622"/>
<text x="112.2" y="1123.9" font-size="14" fill="#9b9082">Plan</text>
<line x1="151" y1="1105" x2="151" y2="1133" stroke="#2a2622"/>
<text x="163" y="1123.9" font-size="14" fill="#9b9082">Manual</text>
<line x1="215.4" y1="1105" x2="215.4" y2="1133" stroke="#2a2622"/>
<text x="227.4" y="1123.9" font-size="14" fill="#9b9082">On writeback</text>
<line x1="320" y1="1105" x2="320" y2="1133" stroke="#2a2622"/>
<text x="332" y="1123.9" font-size="14" fill="#9b9082">Job</text>
<text x="56" y="1156" font-size="12" fill="#9b9082">Off: Holodex never renames a file. Choose Plan to see what your files would be called.</text>
</svg>
