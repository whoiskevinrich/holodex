<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="'Archivo Variable', Archivo, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">F90 Filters panel on Media and People</title>
  <desc id="d">Media: the toolbar with Filters · 3, the chips row with Linked, Has director and No poster chips carrying the owner key glyph, and the 320px Filters panel open with Provider link set to Linked and two field rows. People: the toolbar gains Filters · 1, a chips row with a No birthdate chip, and the panel with the field picker open on its search list.</desc>
  <rect width="1040" height="560" fill="#0c0a09"/>

  <!-- ===== Media (left) ===== -->
  <text x="24" y="34" font-size="12" fill="#9b9082" letter-spacing=".04em">MEDIA · OWNER</text>
  <!-- toolbar -->
  <rect x="24" y="48" width="150" height="32" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="36" y="69" font-size="14" fill="#f3ece1">Most enriched</text>
  <text x="158" y="69" font-size="12" fill="#9b9082">▾</text>
  <rect x="184" y="48" width="96" height="32" rx="2" fill="#15110e" stroke="#e8a33d"/>
  <text x="198" y="69" font-size="14" fill="#e8a33d">Filters · 3</text>
  <rect x="404" y="48" width="96" height="32" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="416" y="69" font-size="14" fill="#9b9082">Grid</text>
  <rect x="452" y="52" width="44" height="24" rx="2" fill="#181310"/>
  <text x="460" y="69" font-size="14" fill="#f3ece1">Table</text>

  <!-- chips row -->
  <g font-size="12">
    <rect x="24" y="92" width="70" height="22" rx="2" fill="#e8a33d"/>
    <text x="32" y="107" fill="#1a1206">⚿ Linked</text>
    <text x="84" y="107" fill="#1a1206">×</text>
    <rect x="100" y="92" width="104" height="22" rx="2" fill="#e8a33d"/>
    <text x="108" y="107" fill="#1a1206">⚿ Has director</text>
    <text x="194" y="107" fill="#1a1206">×</text>
    <rect x="210" y="92" width="94" height="22" rx="2" fill="none" stroke="#e8a33d"/>
    <text x="218" y="107" fill="#e8a33d">⚿ No poster</text>
    <text x="294" y="107" fill="#e8a33d">×</text>
    <text x="316" y="107" fill="#9b9082">Clear</text>
    <text x="356" y="107" fill="#9b9082">Edit as text</text>
  </g>

  <!-- panel popover under Filters, 320 wide -->
  <rect x="184" y="124" width="320" height="300" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="200" y="152" font-size="12" fill="#9b9082">Provider link</text>
  <rect x="200" y="160" width="288" height="26" rx="2" fill="none" stroke="#2a2622"/>
  <text x="228" y="178" font-size="12" fill="#9b9082">Any</text>
  <rect x="296" y="161" width="96" height="24" fill="#e8a33d"/>
  <text x="324" y="178" font-size="12" fill="#1a1206">Linked</text>
  <text x="410" y="178" font-size="12" fill="#9b9082">Not linked</text>

  <text x="200" y="210" font-size="12" fill="#9b9082">Fields</text>
  <!-- row: Director has -->
  <text x="200" y="236" font-size="14" fill="#f3ece1">Director</text>
  <rect x="352" y="222" width="110" height="22" rx="2" fill="none" stroke="#2a2622"/>
  <rect x="353" y="223" width="40" height="20" fill="#e8a33d"/>
  <text x="362" y="237" font-size="12" fill="#1a1206">Has</text>
  <text x="404" y="237" font-size="12" fill="#9b9082">Missing</text>
  <text x="474" y="237" font-size="14" fill="#9b9082">×</text>
  <!-- row: Poster missing -->
  <text x="200" y="266" font-size="14" fill="#f3ece1">Poster</text>
  <rect x="352" y="252" width="110" height="22" rx="2" fill="none" stroke="#2a2622"/>
  <text x="362" y="267" font-size="12" fill="#9b9082">Has</text>
  <rect x="394" y="253" width="67" height="20" fill="#e8a33d"/>
  <text x="404" y="267" font-size="12" fill="#1a1206">Missing</text>
  <text x="474" y="267" font-size="14" fill="#9b9082">×</text>
  <!-- add field -->
  <rect x="200" y="284" width="288" height="30" rx="2" fill="#181310" stroke="#2a2622"/>
  <text x="210" y="304" font-size="14" fill="#9b9082">+ Add a field…</text>

  <!-- existing fields, shortened -->
  <line x1="200" y1="330" x2="488" y2="330" stroke="#2a2622"/>
  <text x="200" y="352" font-size="12" fill="#9b9082">Resolution · Year · Duration · mapped facets</text>
  <text x="200" y="370" font-size="12" fill="#9b9082">(unchanged, below the new controls)</text>
  <text x="200" y="404" font-size="12" fill="#9b9082">Applies live — no Apply button</text>

  <!-- count line -->
  <text x="24" y="452" font-size="14" fill="#9b9082">212 videos</text>
  <text x="24" y="490" font-size="12" fill="#9b9082">⚿ = owner-only (existing glyph). NOT chips stay outlined.</text>
  <text x="24" y="508" font-size="12" fill="#9b9082">A panel choice writes the same expr chip as typing it.</text>

  <!-- ===== People (right) ===== -->
  <line x1="540" y1="24" x2="540" y2="536" stroke="#2a2622"/>
  <text x="564" y="34" font-size="12" fill="#9b9082" letter-spacing=".04em">PEOPLE · OWNER (STUDIOS THE SAME)</text>
  <rect x="564" y="48" width="132" height="32" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="576" y="69" font-size="14" fill="#f3ece1">Name — A→Z</text>
  <text x="680" y="69" font-size="12" fill="#9b9082">▾</text>
  <rect x="706" y="48" width="96" height="32" rx="2" fill="#15110e" stroke="#e8a33d"/>
  <text x="720" y="69" font-size="14" fill="#e8a33d">Filters · 1</text>

  <g font-size="12">
    <rect x="564" y="92" width="104" height="22" rx="2" fill="none" stroke="#e8a33d"/>
    <text x="572" y="107" fill="#e8a33d">⚿ No birthdate</text>
    <text x="658" y="107" fill="#e8a33d">×</text>
  </g>

  <rect x="706" y="124" width="320" height="300" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="722" y="152" font-size="12" fill="#9b9082">Provider link</text>
  <rect x="722" y="160" width="288" height="26" rx="2" fill="none" stroke="#2a2622"/>
  <rect x="723" y="161" width="96" height="24" fill="#e8a33d"/>
  <text x="760" y="178" font-size="12" fill="#1a1206">Any</text>
  <text x="846" y="178" font-size="12" fill="#9b9082">Linked</text>
  <text x="932" y="178" font-size="12" fill="#9b9082">Not linked</text>

  <text x="722" y="210" font-size="12" fill="#9b9082">Fields</text>
  <text x="722" y="236" font-size="14" fill="#f3ece1">Birthdate</text>
  <rect x="874" y="222" width="110" height="22" rx="2" fill="none" stroke="#2a2622"/>
  <text x="884" y="237" font-size="12" fill="#9b9082">Has</text>
  <rect x="916" y="223" width="67" height="20" fill="#e8a33d"/>
  <text x="926" y="237" font-size="12" fill="#1a1206">Missing</text>
  <text x="996" y="237" font-size="14" fill="#9b9082">×</text>

  <!-- add field input with open list -->
  <rect x="722" y="254" width="288" height="30" rx="2" fill="#181310" stroke="#e8a33d"/>
  <text x="732" y="274" font-size="14" fill="#f3ece1">na</text>
  <rect x="722" y="288" width="288" height="96" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="734" y="306" font-size="12" fill="#9b9082" letter-spacing=".04em">FIELDS</text>
  <rect x="723" y="314" width="286" height="28" fill="#181310"/>
  <text x="734" y="333" font-size="14" fill="#f3ece1">Name</text>
  <text x="734" y="363" font-size="14" fill="#f3ece1">Nationality</text>
  <text x="734" y="404" font-size="12" fill="#9b9082">Enter adds · Esc closes</text>

  <text x="564" y="452" font-size="14" fill="#9b9082">37 people</text>
  <text x="564" y="490" font-size="12" fill="#9b9082">Fields offered: the entity's own, incl. Photo (people)</text>
  <text x="564" y="508" font-size="12" fill="#9b9082">or Branding (studios). No Year, Resolution or facets.</text>
</svg>
