<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Archivo, system-ui, sans-serif" role="img">
  <title>No metadata provider configured hint (HOLODEX-88)</title>
  <desc>Owner view with zero providers configured: a muted plain-text hint replaces the Enrich chips on the entity Details panel and the media action row, and replaces the misleading empty state of the enrichment queue.</desc>
  <rect width="720" height="470" fill="#0c0a09"/>

  <text x="20" y="28" font-size="12" fill="#9b9082">1 · Person / studio / film — Details panel header (owner, zero providers)</text>
  <rect x="20" y="40" width="680" height="84" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="36" y="64" font-size="11" letter-spacing="0.8" fill="#9b9082">› DETAILS · 4 FIELDS</text>
  <text x="684" y="64" font-size="12" fill="#9b9082" text-anchor="end">No metadata provider configured</text>
  <text x="36" y="92" font-size="13" fill="#9b9082">Born <tspan fill="#f3ece1">1971</tspan></text>
  <text x="36" y="112" font-size="13" fill="#9b9082">Nationality <tspan fill="#f3ece1">—</tspan></text>

  <text x="20" y="152" font-size="12" fill="#9b9082">1b · Stressed: no resolved fields — panel now renders for the owner (visitors still see nothing)</text>
  <rect x="20" y="164" width="680" height="40" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="36" y="188" font-size="11" letter-spacing="0.8" fill="#9b9082">DETAILS</text>
  <text x="684" y="188" font-size="12" fill="#9b9082" text-anchor="end">No metadata provider configured</text>

  <text x="20" y="232" font-size="12" fill="#9b9082">2 · Media page — action row (Sync unchanged)</text>
  <rect x="20" y="244" width="680" height="40" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="36" y="268" font-size="12" fill="#9b9082">Extract from filename</text>
  <text x="180" y="268" font-size="12" fill="#9b9082">No metadata provider configured</text>

  <text x="20" y="312" font-size="12" fill="#9b9082">3 · Owner → Enrichment queue — replaces “Nothing left to review.” when no provider is configured</text>
  <rect x="20" y="324" width="680" height="126" rx="2" fill="#0c0a09" stroke="#2a2622" stroke-dasharray="3 3"/>
  <text x="360" y="380" font-size="14" fill="#9b9082" text-anchor="middle">No metadata provider configured.</text>
  <text x="360" y="402" font-size="14" fill="#9b9082" text-anchor="middle">Add one to metadata-sources.yaml to start enriching.</text>
</svg>
