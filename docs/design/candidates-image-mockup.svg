<svg viewBox="0 0 960 1040" xmlns="http://www.w3.org/2000/svg" font-family="'Archivo Variable', sans-serif">
  <defs>
    <style>
      .bg { fill: #0c0a09; }
      .panel { fill: #15110e; stroke: #2a2622; stroke-width: 1; }
      .field { fill: #15110e; stroke: #2a2622; stroke-width: 1; }
      .rowActive { fill: #1c1714; }
      .rowBar { fill: #e8a33d; }
      .rule { stroke: #2a2622; stroke-width: 1; fill: none; }
      .plate { fill: #e9e2d6; }
      .plateInk { fill: #2a2622; font-family: 'Fraunces Variable', serif; font-weight: 600; }
      .photo { fill: #6b5d4a; }
      .photoInk { fill: #d9ccb8; }
      .poster { fill: #3d4a5c; }
      .posterInk { fill: #dbe3ee; }
      .logo { fill: #8a2f2f; }
      .ink { fill: #f3ece1; }
      .muted { fill: #9b9082; }
      .accent { fill: #e8a33d; }
      .accentMark { stroke: #e8a33d; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .dim { stroke: #9b9082; stroke-width: 1; fill: none; }
      .label { font-size: 11px; letter-spacing: 0.06em; }
      .title { font-family: 'Fraunces Variable', serif; }
      .xs { font-size: 12px; }
      .sm { font-size: 14px; }
      .dotted { text-decoration: underline dotted; }
    </style>
  </defs>

  <rect class="bg" width="960" height="1040" />

  <text x="24" y="34" class="title ink" font-size="17">Enrich picker &#8212; candidate thumbnail from /resolve candidates[].image_url</text>
  <text x="24" y="54" class="muted xs">Skin 1 (Cin&#233;math&#232;que). Gold dashed outline marks what this change adds. HOLODEX-406 / F64 FR3.</text>

  <!-- ===== 1. PERSON: THREE SAME-LABEL ROWS, ONE WITHOUT AN IMAGE ===== -->
  <text x="24" y="92" class="label muted">1 &#183; PERSON &#8212; THREE SAME-LABEL CANDIDATES; ROW 3 HAS NO image_url (MONOGRAM, COLUMN KEPT)</text>
  <rect x="24" y="104" width="560" height="326" class="panel" rx="2" />
  <text x="40" y="132" class="title ink" font-size="17">Enrich from acme</text>
  <text x="562" y="131" class="muted sm">&#10005;</text>
  <rect x="40" y="146" width="528" height="30" class="field" rx="2" />
  <text x="52" y="166" class="ink sm">Chris Evans</text>
  <text x="40" y="196" class="muted xs">3 matches for "Chris Evans".</text>

  <!-- row 1 (active) -->
  <rect x="40" y="208" width="528" height="76" class="rowActive" rx="2" />
  <rect x="40" y="208" width="2" height="76" class="rowBar" />
  <rect x="54" y="216" width="40" height="60" class="plate" rx="2" />
  <rect x="54" y="216" width="40" height="60" class="photo" rx="2" />
  <circle cx="74" cy="236" r="8" class="photoInk" />
  <path d="M60 268 Q74 244 88 268 Z" class="photoInk" />
  <rect x="51" y="213" width="46" height="66" class="accentMark" rx="2" />
  <text x="106" y="233" class="ink sm">Chris Evans</text>
  <text x="556" y="232" class="accent xs" text-anchor="end">Strong match</text>
  <text x="106" y="251" class="muted xs">Actor &#183; Captain America: The First Avenger</text>
  <text x="106" y="271" class="accent xs">view source &#8599;</text>
  <text x="196" y="271" class="accent xs dotted">details</text>

  <!-- row 2 -->
  <rect x="54" y="292" width="40" height="60" class="plate" rx="2" />
  <rect x="54" y="292" width="40" height="60" class="photo" rx="2" />
  <circle cx="74" cy="312" r="8" class="photoInk" />
  <path d="M60 344 Q74 320 88 344 Z" class="photoInk" />
  <text x="106" y="309" class="ink sm">Chris Evans</text>
  <text x="556" y="308" class="muted xs" text-anchor="end">Possible match</text>
  <text x="106" y="327" class="muted xs">Presenter &#183; Top Gear, TFI Friday</text>
  <text x="106" y="347" class="accent xs">view source &#8599;</text>
  <text x="196" y="347" class="accent xs dotted">details</text>

  <!-- row 3: no image_url -> monogram -->
  <rect x="54" y="368" width="40" height="60" class="plate" rx="2" />
  <text x="74" y="404" class="plateInk" font-size="14" text-anchor="middle">C</text>
  <rect x="51" y="365" width="46" height="66" class="accentMark" rx="2" />
  <text x="106" y="385" class="ink sm">Chris Evans</text>
  <text x="556" y="384" class="muted xs" text-anchor="end">Weak match</text>
  <text x="106" y="403" class="muted xs">Crew</text>
  <text x="106" y="423" class="accent xs">view source &#8599;</text>

  <!-- side notes panel 1 -->
  <text x="608" y="128" class="label muted">WHAT CHANGED</text>
  <text x="608" y="150" class="ink xs">One 40 &#215; 60 slot leads every row.</text>
  <text x="608" y="168" class="ink xs">Text block starts at the same x on</text>
  <text x="608" y="184" class="ink xs">every row, image or not.</text>
  <text x="608" y="212" class="ink xs">Slot = FilmsRow's 2:3 plate idiom:</text>
  <text x="608" y="228" class="muted xs">w-10 aspect-[2/3] rounded-theme</text>
  <text x="608" y="244" class="muted xs">bg-logo-plate overflow-hidden</text>
  <text x="608" y="272" class="ink xs">Image: object-contain (not cover &#8212;</text>
  <text x="608" y="288" class="ink xs">candidate aspect is not gated).</text>
  <text x="608" y="316" class="ink xs">Monogram: format.monogram(label),</text>
  <text x="608" y="332" class="muted xs">font-display font-semibold</text>
  <text x="608" y="348" class="muted xs">text-logo-plate-ink text-sm</text>
  <text x="608" y="376" class="ink xs">Row floor becomes 60 + py-2 = 76px;</text>
  <text x="608" y="392" class="ink xs">label/disambiguation/actions stack</text>
  <text x="608" y="408" class="ink xs">already costs 60, so parity holds.</text>

  <!-- ===== 2. FILM WITH DETAIL EXPANDED: THUMB TOP-ALIGNED ===== -->
  <text x="24" y="470" class="label muted">2 &#183; FILM &#8212; F61 DETAIL EXPANDED: THUMB STAYS PINNED TO THE LABEL LINE, LINES RUN UNDER THE LABEL</text>
  <rect x="24" y="482" width="560" height="232" class="panel" rx="2" />

  <!-- row expanded (active) -->
  <rect x="40" y="498" width="528" height="140" class="rowActive" rx="2" />
  <rect x="40" y="498" width="2" height="140" class="rowBar" />
  <rect x="54" y="506" width="40" height="60" class="plate" rx="2" />
  <rect x="54" y="506" width="40" height="60" class="poster" rx="2" />
  <text x="74" y="532" class="posterInk" font-size="7" text-anchor="middle" letter-spacing="0.1em">HEAT</text>
  <rect x="60" y="540" width="28" height="18" fill="#dbe3ee" opacity="0.25" />
  <line x1="50" y1="506" x2="50" y2="638" class="dim" stroke-dasharray="2 3" />
  <text x="106" y="523" class="ink sm">Heat (1995)</text>
  <text x="556" y="522" class="accent xs" text-anchor="end">Strong match</text>
  <text x="106" y="541" class="muted xs">Michael Mann &#183; 170 min</text>
  <text x="106" y="561" class="accent xs">view source &#8599;</text>
  <text x="196" y="561" class="accent xs dotted">hide details</text>
  <line x1="106" y1="572" x2="106" y2="628" class="rule" />
  <text x="116" y="586" class="muted xs">Cast: Al Pacino, Robert De Niro, Val Kilmer</text>
  <text x="116" y="604" class="muted xs">Genres: Crime &#183; Thriller</text>
  <text x="116" y="622" class="muted xs">Studio: Warner Bros. Pictures</text>
  <rect x="51" y="503" width="46" height="66" class="accentMark" rx="2" />

  <!-- row 2 collapsed below it -->
  <rect x="54" y="654" width="40" height="60" class="plate" rx="2" />
  <rect x="54" y="654" width="40" height="60" class="poster" rx="2" />
  <text x="74" y="680" class="posterInk" font-size="7" text-anchor="middle" letter-spacing="0.1em">HEAT</text>
  <text x="106" y="671" class="ink sm">Heat (1986)</text>
  <text x="556" y="670" class="muted xs" text-anchor="end">Possible match</text>
  <text x="106" y="689" class="muted xs">Dick Richards &#183; 101 min</text>
  <text x="106" y="709" class="accent xs">view source &#8599;</text>
  <text x="196" y="709" class="accent xs dotted">details</text>

  <text x="608" y="506" class="label muted">ALIGNMENT</text>
  <text x="608" y="528" class="ink xs">li becomes flex items-start gap-3.</text>
  <text x="608" y="546" class="ink xs">Slot is shrink-0; text block is</text>
  <text x="608" y="562" class="ink xs">min-w-0 flex-1 and keeps its exact</text>
  <text x="608" y="578" class="ink xs">F61 internals (label line, disamb,</text>
  <text x="608" y="594" class="ink xs">items-baseline actions line, ul).</text>
  <text x="608" y="622" class="ink xs">Expanded lines indent from the text</text>
  <text x="608" y="638" class="ink xs">block's left edge, not the slot's.</text>
  <text x="608" y="666" class="ink xs">The slot is not a tab stop and has</text>
  <text x="608" y="682" class="ink xs">no click handler of its own &#8212; the</text>
  <text x="608" y="698" class="ink xs">li's existing handlers cover it.</text>

  <!-- ===== 3. STUDIO LOGO LETTERBOXED + 404 FALLBACK ===== -->
  <text x="24" y="754" class="label muted">3 &#183; STUDIO &#8212; WIDE LOGO LETTERBOXES ON THE PLATE; A 404 FALLS BACK TO THE MONOGRAM, NEVER A BROKEN-IMAGE GLYPH</text>
  <rect x="24" y="766" width="560" height="182" class="panel" rx="2" />

  <!-- row 1 (active) logo -->
  <rect x="40" y="782" width="528" height="76" class="rowActive" rx="2" />
  <rect x="40" y="782" width="2" height="76" class="rowBar" />
  <rect x="54" y="790" width="40" height="60" class="plate" rx="2" />
  <rect x="56" y="812" width="36" height="16" class="logo" rx="2" />
  <text x="74" y="824" fill="#f3ece1" font-size="8" text-anchor="middle" font-weight="600">WB</text>
  <rect x="51" y="787" width="46" height="66" class="accentMark" rx="2" />
  <text x="106" y="807" class="ink sm">Warner Bros. Pictures</text>
  <text x="556" y="806" class="accent xs" text-anchor="end">Strong match</text>
  <text x="106" y="825" class="muted xs">Burbank, CA &#183; est. 1923</text>
  <text x="106" y="845" class="accent xs">view source &#8599;</text>

  <!-- row 2: image errored -> monogram -->
  <rect x="54" y="866" width="40" height="60" class="plate" rx="2" />
  <text x="74" y="902" class="plateInk" font-size="14" text-anchor="middle">W</text>
  <rect x="51" y="863" width="46" height="66" class="accentMark" rx="2" />
  <text x="106" y="883" class="ink sm">Warner Bros. Animation</text>
  <text x="556" y="882" class="muted xs" text-anchor="end">Possible match</text>
  <text x="106" y="901" class="muted xs">image_url sent, but 404 &#8594; onerror &#8594; monogram</text>
  <text x="106" y="921" class="accent xs">view source &#8599;</text>

  <text x="608" y="790" class="label muted">ONE RULE, EVERY ENTITY KIND</text>
  <text x="608" y="812" class="ink xs">Portrait (2:3) fills the box.</text>
  <text x="608" y="828" class="ink xs">Wide logo letterboxes, centred,</text>
  <text x="608" y="844" class="ink xs">plate showing above and below.</text>
  <text x="608" y="860" class="ink xs">No entity-kind branch in the</text>
  <text x="608" y="876" class="ink xs">component; no per-kind shape.</text>
  <text x="608" y="904" class="ink xs">img error &#8594; per-row failed flag</text>
  <text x="608" y="920" class="ink xs">&#8594; monogram branch. Resets when</text>
  <text x="608" y="936" class="ink xs">a new response arrives.</text>

  <!-- ===== 4. SLOT ANATOMY ===== -->
  <text x="24" y="988" class="label muted">4 &#183; SLOT ANATOMY (CSS px) &#8212; 40 &#215; 60 box, 12 gap, row padding 12 / 8, radius rounded-theme (2 / 0 / 0 by skin)</text>
  <rect x="40" y="1000" width="40" height="30" class="plate" rx="2" />
  <line x1="40" y1="1036" x2="80" y2="1036" class="dim" />
  <text x="60" y="1034" class="muted" font-size="9" text-anchor="middle">40</text>
  <line x1="86" y1="1000" x2="86" y2="1030" class="dim" />
  <text x="92" y="1018" class="muted" font-size="9">60 (aspect 2/3)</text>
  <line x1="200" y1="1000" x2="212" y2="1000" class="dim" />
  <text x="216" y="1004" class="muted" font-size="9">gap-3 = 12</text>
  <text x="300" y="1004" class="muted" font-size="9">px-3 = 12 &#183; py-2 = 8 &#183; alt="" &#183; loading="lazy" &#183; referrerpolicy="no-referrer"</text>
</svg>
