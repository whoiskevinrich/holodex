<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" font-family="'Archivo Variable', Archivo, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">F90 enriched sorts, Enriched column and the retired ring</title>
  <desc id="d">The sort menu's owner group lists Most enriched and Least enriched in place of the two Completeness sorts. Tables on Media, People and the new Studios Table view replace the Done column's ring with a right-aligned Enriched number. A video card and a people row are shown with no ring.</desc>
  <rect width="1040" height="520" fill="#0c0a09"/>

  <!-- sort menu -->
  <text x="24" y="34" font-size="12" fill="#9b9082" letter-spacing=".04em">SORT MENU · OWNER GROUP</text>
  <rect x="24" y="48" width="220" height="208" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="40" y="74" font-size="14" fill="#f3ece1">Name — A→Z</text>
  <text x="40" y="100" font-size="14" fill="#f3ece1">Videos — most</text>
  <text x="40" y="126" font-size="14" fill="#f3ece1">Random</text>
  <line x1="24" y1="140" x2="244" y2="140" stroke="#2a2622"/>
  <text x="40" y="160" font-size="12" fill="#9b9082">Owner</text>
  <rect x="25" y="168" width="218" height="28" fill="#181310"/>
  <text x="40" y="187" font-size="14" fill="#e8a33d">Most enriched</text>
  <text x="40" y="216" font-size="14" fill="#f3ece1">Least enriched</text>
  <text x="40" y="244" font-size="12" fill="#9b9082">Completeness sorts removed</text>

  <!-- Media table -->
  <text x="276" y="34" font-size="12" fill="#9b9082" letter-spacing=".04em">MEDIA · TABLE</text>
  <rect x="276" y="48" width="440" height="176" rx="2" fill="#15110e" stroke="#2a2622"/>
  <g font-size="12" fill="#9b9082">
    <text x="290" y="72">Title</text><text x="460" y="72">Duration</text><text x="532" y="72">Res</text><text x="574" y="72">Added</text>
    <text x="704" y="72" text-anchor="end" fill="#e8a33d">Enriched ▾</text>
  </g>
  <line x1="276" y1="84" x2="716" y2="84" stroke="#2a2622"/>
  <g font-size="14" fill="#f3ece1">
    <text x="290" y="114">The long night</text><text x="460" y="114" fill="#9b9082">1:52:10</text><text x="532" y="114" fill="#9b9082">FHD</text><text x="574" y="114" fill="#9b9082">2 days</text><text x="704" y="114" text-anchor="end">14</text>
  </g>
  <line x1="276" y1="128" x2="716" y2="128" stroke="#2a2622"/>
  <g font-size="14" fill="#f3ece1">
    <text x="290" y="158">Harbour lights</text><text x="460" y="158" fill="#9b9082">48:03</text><text x="532" y="158" fill="#9b9082">HD</text><text x="574" y="158" fill="#9b9082">1 wk</text><text x="704" y="158" text-anchor="end">9</text>
  </g>
  <line x1="276" y1="172" x2="716" y2="172" stroke="#2a2622"/>
  <g font-size="14" fill="#f3ece1">
    <text x="290" y="202">home_movie_03</text><text x="460" y="202" fill="#9b9082">12:40</text><text x="532" y="202" fill="#9b9082">SD</text><text x="574" y="202" fill="#9b9082">3 mo</text><text x="704" y="202" text-anchor="end" fill="#9b9082">0</text>
  </g>

  <!-- Studios table (new) -->
  <text x="748" y="34" font-size="12" fill="#9b9082" letter-spacing=".04em">STUDIOS · NEW TABLE VIEW</text>
  <rect x="748" y="48" width="268" height="40" rx="2" fill="none"/>
  <rect x="908" y="8" width="108" height="28" rx="2" fill="#15110e" stroke="#2a2622"/>
  <text x="918" y="27" font-size="14" fill="#9b9082">List</text>
  <rect x="952" y="11" width="60" height="22" rx="2" fill="#181310"/>
  <text x="962" y="27" font-size="14" fill="#f3ece1">Table</text>
  <rect x="748" y="48" width="268" height="176" rx="2" fill="#15110e" stroke="#2a2622"/>
  <g font-size="12" fill="#9b9082"><text x="762" y="72">Name</text><text x="912" y="72" text-anchor="end">Videos</text><text x="1004" y="72" text-anchor="end">Enriched</text></g>
  <line x1="748" y1="84" x2="1016" y2="84" stroke="#2a2622"/>
  <g font-size="14" fill="#f3ece1"><text x="762" y="114">Studio one</text><text x="912" y="114" text-anchor="end" fill="#9b9082">41</text><text x="1004" y="114" text-anchor="end">4</text></g>
  <line x1="748" y1="128" x2="1016" y2="128" stroke="#2a2622"/>
  <g font-size="14" fill="#f3ece1"><text x="762" y="158">Studio two</text><text x="912" y="158" text-anchor="end" fill="#9b9082">12</text><text x="1004" y="158" text-anchor="end">2</text></g>
  <line x1="748" y1="172" x2="1016" y2="172" stroke="#2a2622"/>
  <g font-size="14" fill="#f3ece1"><text x="762" y="202">Studio three</text><text x="912" y="202" text-anchor="end" fill="#9b9082">3</text><text x="1004" y="202" text-anchor="end" fill="#9b9082">0</text></g>

  <!-- ring removed: card + row -->
  <text x="24" y="296" font-size="12" fill="#9b9082" letter-spacing=".04em">RING RETIRED · VIDEO CARD</text>
  <rect x="24" y="310" width="220" height="124" rx="2" fill="#181310" stroke="#2a2622"/>
  <rect x="32" y="406" width="40" height="20" rx="2" fill="#000" fill-opacity=".7"/>
  <text x="40" y="421" font-size="12" fill="#f3ece1">pt 2</text>
  <text x="24" y="456" font-size="14" fill="#f3ece1">Harbour lights</text>
  <text x="24" y="476" font-size="12" fill="#9b9082">Part badge moves to the bottom-left corner the ring left.</text>

  <text x="276" y="296" font-size="12" fill="#9b9082" letter-spacing=".04em">RING RETIRED · PEOPLE LIST ROW, HOVER CARD, STUDIO ROW</text>
  <rect x="276" y="310" width="440" height="44" rx="2" fill="#15110e" stroke="#2a2622"/>
  <circle cx="300" cy="332" r="14" fill="#181310" stroke="#2a2622"/>
  <text x="324" y="337" font-size="14" fill="#f3ece1">A. Person</text>
  <text x="704" y="337" font-size="14" fill="#9b9082" text-anchor="end">23</text>
  <text x="276" y="376" font-size="12" fill="#9b9082">The count keeps its place; nothing replaces the ring on rows or cards.</text>
  <text x="276" y="394" font-size="12" fill="#9b9082">Detail pages keep the field list with present / missing, with no score or bar.</text>

  <text x="748" y="296" font-size="12" fill="#9b9082" letter-spacing=".04em">VISITOR</text>
  <text x="748" y="318" font-size="12" fill="#9b9082">No Filters additions, no owner sort group,</text>
  <text x="748" y="336" font-size="12" fill="#9b9082">no Enriched column. Lists look as today.</text>
</svg>
