# Release on a v* tag: promote the already-built image (semver + latest) and cut a GitHub
# Release with a Conventional-Commits changelog (git-cliff), a GHCR Deployment link, and a
# package link (ADR-034). Tag a release with:  git tag v0.1.0 && git push origin v0.1.0
#
# ADR-070 changed how the image is produced: this no longer rebuilds at the tag, it retags
# the digest that was published from main and canaried before the release PR was merged.
# That means the released bits are exactly the validated bits — and that the ancestry
# checks in scripts/resolve-release-digest.mjs are what keep an unrelated image from being
# published under a release version.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Runs as a signal, not as the artifact gate. Since ADR-070 the released image is a
  # digest already built from main (where branch protection required this same CI), and
  # the "does this digest belong to this tag" question is answered by the ancestry checks
  # in the promote job — not by rebuilding here.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Promote the already-built, already-canaried digest instead of rebuilding (ADR-070).
  # The bits published as 1.2.3/latest are byte-identical to the ones the canary ran.
  # scripts/resolve-release-digest.mjs is what makes that safe: it only ever considers
  # ancestors of the tagged commit, cross-checks the image's revision label, and asserts
  # ancestry explicitly. If it can't tie a digest to this tag, the release fails.
  promote:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.retag.outputs.latest }}   # did this release take `latest`?
    permissions:
      contents: read
      packages: write        # retag within this repository's own package namespace
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # rev-list walks back from the tagged commit

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Resolves EVERY published image (scripts/lib/imagetools.mjs owns that list) before
      # anything is retagged — a sidecar that can't be resolved must not leave a
      # half-published release with only the core image promoted.
      - name: Resolve digests
        id: resolve
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/resolve-release-digest.mjs "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Retag as the release
        id: retag
        env:
          IMAGES: ${{ steps.resolve.outputs.images }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"

          # Exact version always; `X.Y`, `X` and `latest` only when this is the highest
          # release in that range, so a release/** hotfix can't pull `latest` back to an
          # older line. A prerelease gets only its exact version (HOLODEX-545).
          read -ra tags <<< "$(node scripts/release-tags.mjs "$ver")"
          [[ "${tags[0]:-}" == "$ver" ]] || { echo "release-tags produced no tags" >&2; exit 1; }
          if [[ " ${tags[*]} " == *" latest "* ]]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          # Materialise the list first: a process substitution that fails would feed the
          # loop nothing and exit 0, silently promoting no images at all.
          pairs="$(jq -er '.[] | "\(.ref) \(.digest)"' <<< "$IMAGES")"
          [[ -n "$pairs" ]] || { echo "resolve produced no images" >&2; exit 1; }

          while read -r ref digest; do
            args=()
            for t in "${tags[@]}"; do args+=(-t "${ref}:${t}"); done
            echo "Promoting ${ref}@${digest} -> ${tags[*]}"
            docker buildx imagetools create "${args[@]}" "${ref}@${digest}"
          done <<< "$pairs"

      - name: Summary
        env:
          IMAGES: ${{ steps.resolve.outputs.images }}
        run: |
          {
            echo "### Promoted by retag (ADR-070)"
            echo ""
            echo "| Image | Source commit | Digest |"
            echo "|---|---|---|"
            jq -r '.[] | "| `\(.name)` | `\(.commit)` | `\(.digest)` |"' <<< "$IMAGES"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub Release
    # Records a GitHub Deployment to the `prod` environment on this tagged run,
    # linking Release ↔ Deployments ↔ Environments; the URL is the package page
    # (ADR-034). The runner records it natively — no deployments:write needed.
    # Named `prod` (not `ghcr`) so GitHub-for-Jira's keyword-based environment-type
    # inference maps it to Production instead of leaving it Unmapped (HOLODEX-184).
    environment:
      name: prod
      url: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/holodex
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history for the changelog

      # A release/** hotfix (HOLODEX-545) isn't main's release, so the Jira sync below
      # must not run for it. Exit 1 means "not an ancestor"; anything else (a missing
      # origin/main) is an error, not an answer — fail rather than silently skip the sync.
      - name: Is this tag on main?
        id: lane
        run: |
          set +e
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          rc=$?
          set -e
          case $rc in
            0) on_main=true ;;
            1) on_main=false ;;
            *) echo "::error::cannot tell whether $GITHUB_SHA is on origin/main (rc=$rc)"; exit 1 ;;
          esac
          echo "on_main=$on_main" >> "$GITHUB_OUTPUT"
          echo "on_main=$on_main"

      - name: Generate changelog (Conventional Commits)
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: ${{ needs.promote.outputs.latest }}   # same decision as the image's `latest`
          body: |
            ${{ steps.changelog.outputs.content }}

            ### Container images
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}-provider-tmdb:${{ github.ref_name }}
            ```

            📦 **Holodex:** ${{ github.server_url }}/${{ github.repository }}/pkgs/container/holodex
            📦 **TMDB provider:** ${{ github.server_url }}/${{ github.repository }}/pkgs/container/holodex-provider-tmdb

      # This job IS the `prod` deployment (see environment above), so it's the point
      # at which the tag has shipped. Move every code-complete HOLODEX issue
      # (status = Done) to Released (ADR-058, replaces the old Automation rule 5).
      # Soft-fails: a Jira hiccup logs a warning and never red-builds a shipped release.
      # Skipped for a tag off main: the sync releases the whole `status = Done` set, which
      # is only true of a release cut from main (HOLODEX-545).
      - name: Set up Node
        if: steps.lane.outputs.on_main == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync Jira → Released
        if: steps.lane.outputs.on_main == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/jira-release-sync.mjs
