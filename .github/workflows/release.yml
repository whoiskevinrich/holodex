# Release on a v* tag: publish the image (semver + latest) and cut a GitHub Release
# with a Conventional-Commits changelog (git-cliff), a GHCR Deployment link, and a
# package link (ADR-034). Tag a release with:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Gate the release on the same checks that gate a PR merge — a tag can point at any
  # commit, so re-run CI here rather than trust that the tagged commit passed on main.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Reuse the image pipeline; the tag ref makes metadata-action emit semver + latest.
  image:
    needs: ci
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    secrets: inherit

  # Build the TMDB provider sidecar image alongside the main image on every release.
  provider-tmdb:
    needs: ci
    uses: ./.github/workflows/provider-tmdb.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    secrets: inherit

  github-release:
    needs: [image, provider-tmdb]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub Release
    # Records a GitHub Deployment to the `prod` environment on this tagged run,
    # linking Release ↔ Deployments ↔ Environments; the URL is the package page
    # (ADR-034). The runner records it natively — no deployments:write needed.
    # Named `prod` (not `ghcr`) so GitHub-for-Jira's keyword-based environment-type
    # inference maps it to Production instead of leaving it Unmapped (HOLODEX-184).
    environment:
      name: prod
      url: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/holodex
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history for the changelog

      - name: Generate changelog (Conventional Commits)
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.changelog.outputs.content }}

            ### Container images
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}-provider-tmdb:${{ github.ref_name }}
            ```

            📦 **Holodex:** ${{ github.server_url }}/${{ github.repository }}/pkgs/container/holodex
            📦 **TMDB provider:** ${{ github.server_url }}/${{ github.repository }}/pkgs/container/holodex-provider-tmdb

      # This job IS the `prod` deployment (see environment above), so it's the point
      # at which the tag has shipped. Move every code-complete HOLODEX issue
      # (status = Done) to Released (ADR-058, replaces the old Automation rule 5).
      # Soft-fails: a Jira hiccup logs a warning and never red-builds a shipped release.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync Jira → Released
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/jira-release-sync.mjs
