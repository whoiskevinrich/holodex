# Build, push, and scan the Holodex runtime image (ADR-023).
# - on push to main / manual dispatch: continuous build, tagged edge + sha-<short>.
# - via workflow_call (from release.yml on a v* tag): tagged with semver + latest.
# Multi-arch (amd64 + arm64); Trivy scans the pushed image into the Security tab.
name: Build image

on:
  push:
    branches: [main]
    # Only rebuild when something that lands in the image changes. Docs/site/spec-only
    # merges skip the (~5 min multi-arch) build. workflow_dispatch and workflow_call
    # (release.yml on a v* tag) ignore paths, so tagged releases always build.
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # whoiskevinrich/holodex

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR via the built-in GITHUB_TOKEN
      security-events: write   # upload the Trivy SARIF report
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU            # arm64 emulation for the multi-arch build
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # latest=auto → `latest` is added on semver tag events only, never on a main push.
          flavor: latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # only flag CVEs with an available fix

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
