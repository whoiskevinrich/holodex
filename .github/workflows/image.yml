# Build, push, and scan the Holodex runtime image (ADR-023). Tags every build `edge` and
# `sha-<short>`; it does NOT produce release tags. Since ADR-070 a v* release retags the
# `sha-<short>` digest that was already built here and canaried, so semver/`latest` are
# applied by release.yml's promote job and this workflow has no release path.
# Multi-arch (amd64 + arm64); Trivy scans the pushed image into the Security tab.
name: Build image

on:
  push:
    branches: [main]
    # Only rebuild when something that lands in the image changes. Docs/site/spec-only
    # merges skip the (~5 min multi-arch) build, which leaves `edge` behind main while
    # still being correct — this list is exactly what the release-candidate freshness
    # check measures against (ADR-070), so adding a path here also widens that check.
    # Use workflow_dispatch to force a rebuild.
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # whoiskevinrich/holodex

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR via the built-in GITHUB_TOKEN
      security-events: write   # upload the Trivy SARIF report
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU            # arm64 emulation for the multi-arch build
        uses: docker/setup-qemu-action@v4
        with:
          # Don't cache the binfmt image: its GHA cache key is global, so concurrent
          # workflows (e.g. provider-tmdb.yml) race to save it and emit a benign but
          # noisy "Unable to reserve cache" warning. The image is tiny and re-pulled fast.
          cache-image: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `sha-<short>` is not just provenance — it is the handle release.yml resolves
          # and retags at release time (ADR-070). Don't drop it.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
          flavor: latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # only flag CVEs with an available fix

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
