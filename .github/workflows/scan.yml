# Periodic CVE scan of the published images (ADR-070).
#
# Trivy also runs inside image.yml/provider-tmdb.yml, but only when a build happens — and
# those builds are `paths:`-filtered (ADR-035), so a quiet week means no scan. Releases no
# longer rebuild either (ADR-070 promotes by retag), which removed the last recurring
# re-scan of the release image. This is that recurring scan: a fresh Trivy DB against the
# images that are actually deployed, independent of whether anything was built.
name: Scan images

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, off the hour to avoid the scheduler rush
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-images
  cancel-in-progress: false

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      security-events: write   # upload the SARIF report to the Security tab
    strategy:
      fail-fast: false         # one image's CVEs must not hide the other's
      matrix:
        image:
          - holodex
          - holodex-provider-tmdb
        tag: [latest, edge]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # only flag CVEs with an available fix

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          # Distinct category per image+tag so results accumulate rather than overwrite.
          category: trivy-${{ matrix.image }}-${{ matrix.tag }}
