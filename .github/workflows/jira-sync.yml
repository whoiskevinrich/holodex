# Jira sync (ADR-058, amended by ADR-069) — transition the issue named by a PR's branch
# as the PR moves: ready for review → In Review, merged → Done. Replaces the old Jira
# Automation rules 2 & 3 (which metered the shared 100-run/month Free quota); the REST
# API is uncounted.
#
# A **Draft** PR fires nothing. Draft is Holodex's state for in-flight work — a PR opened
# early so a pre-implementation gate artifact (ADR, spec, design handoff) is reviewable
# and linked in the Jira dev panel. The ticket stays In Progress until the PR is marked
# ready for review, which is what `In Review` actually means (ADR-069).
#
# Plain `pull_request` (never `pull_request_target`): secrets are withheld from fork
# PRs, so a fork simply no-ops instead of leaking the token. The issue key comes from
# the branch name (Holodex convention) and is matched by an anchored regex in the
# script. Soft-fail: a Jira hiccup logs a warning and never fails the PR.
name: Jira sync

on:
  pull_request:
    types: [opened, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: jira-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  transition:
    # Opened ready, or a Draft marked ready → In Review; a merged PR → Done. A Draft PR
    # and a PR closed without merging are both ignored.
    if: >-
      ${{ (github.event.action == 'opened' && github.event.pull_request.draft == false)
      || github.event.action == 'ready_for_review'
      || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Transition Jira issue
        env:
          BRANCH_REF: ${{ github.head_ref }}
          JIRA_TARGET_STATUS: ${{ github.event.action == 'closed' && 'Done' || 'In Review' }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/jira-branch-sync.mjs
