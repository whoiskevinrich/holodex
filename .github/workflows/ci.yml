# PR quality gate — runs on every PR and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:   # release.yml reuses these exact checks to gate the image build

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # Unit tests are binary-free (pure-Go SQLite via modernc; mappers use inline JSON).
      - name: Test
        run: go test ./...

      # Enable once testdata/gen.sh + golden fixtures land (testing-strategy §3, §8):
      # - name: Install media tools
      #   run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl mkvtoolnix
      # - name: Integration tests
      #   run: go test -tags integration ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test -- --passWithNoTests   # drop the flag once Vitest specs exist

      - name: Build
        run: npm run build

  scripts:
    # Node tests for the dependency-free automation in scripts/ (Jira sync, release-digest
    # resolution). These had no runner before ADR-070 made scripts/resolve-release-digest.mjs
    # load-bearing for what gets published as a release.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: make test-scripts   # same target the maintainer runs locally

  theming:
    # Enforces the CLAUDE.md / ADR-021 rule: components use semantic tokens, never
    # hardcoded palette/radius. rounded-full pills and raw hex in app.css are allowed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: No hardcoded styling in Svelte components
        run: |
          if grep -REn 'zinc-|sky-|emerald-|amber-|rounded-(lg|md|sm|xl)' web/src --include='*.svelte'; then
            echo "::error::Hardcoded styling found in a component — use semantic tokens (bg-bg, text-ink, rounded-theme, …). See ADR-021 / docs/design/theming.md."
            exit 1
          fi
          echo "No hardcoded styling found."

  adr-numbers:
    # ADR numbers are a manual sequence with no allocation lock, so parallel branches
    # can pick the same next number and both merge before either sees the other. This
    # won't stop that race, but it turns a silent duplicate into a fast, loud CI failure.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: No duplicate ADR numbers
        run: |
          dupes=$(ls docs/architecture | grep -E '^ADR-[0-9]+-' | sed -E 's/^ADR-([0-9]+)-.*/\1/' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate ADR number(s) found: $dupes — renumber one of the colliding files and its README.md entry/cross-references."
            ls docs/architecture | grep -E '^ADR-[0-9]+-' | while read -r f; do
              num=$(echo "$f" | sed -E 's/^ADR-([0-9]+)-.*/\1/')
              echo "$dupes" | grep -qx "$num" && echo "  $f"
            done
            exit 1
          fi
          echo "No duplicate ADR numbers."
