# Refresh the release-candidate comment on the open release-please PR (ADR-070).
#
# `:edge` already IS that PR's content — release-please stacks the version bump and
# CHANGELOG, not the code — so nothing is built here. This resolves the digests that were
# already published, reports whether they're current with main, and hands over a pinned
# pull command for the canary instance.
#
# Advisory by design: no status check, no merge gate. A stale image shows up in the comment.
name: Release candidate

on:
  # Re-run whenever something that changes the answer lands: a new image, or a new/updated
  # release PR. workflow_run always uses the default branch's copy of this file.
  workflow_run:
    workflows: ["Build image", "Build provider-tmdb image", "Release Please"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-candidate
  cancel-in-progress: true

jobs:
  comment:
    # Don't advertise a candidate built by a run that failed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # read digests/labels from GHCR
      pull-requests: write    # upsert the comment on the release PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0      # rev-list/describe need full history and tags

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Read HEAD from the checkout rather than github.sha: on a workflow_run event that
      # is the commit that triggered the *upstream* run, which can already be behind main.
      - name: Resolve main HEAD
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post release-candidate comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.head.outputs.sha }}
        run: node scripts/release-candidate-comment.mjs
