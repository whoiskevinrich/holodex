# git-cliff — a categorized, human-readable changelog from Conventional Commits,
# for GitHub Releases (ADR-034). The release workflow runs `git-cliff --latest` on
# a v* tag to emit the just-tagged version's sections. Based on the git-cliff
# default template (proven), with Holodex's commit categories.

[changelog]
header = ""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true   # drop non-conventional commits (raw merges, etc.)
split_commits = false
# Section order = list order; the <!-- N --> prefixes sort the groups, striptags
# strips them from the rendered heading.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Testing" },
  { message = "^ci|^build", group = "<!-- 6 -->⚙️ CI / Build" },
  { message = "^revert", group = "<!-- 7 -->◀️ Revert" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^style", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
