# Flightplan config — the portability seam (ADR-064).
# Copy to .claude/flightplan.yaml and edit for this repo. Nothing repo-specific is compiled into
# the plugin; this file is the only thing that changes between repos.

tracker:
  system: jira                  # none | jira | github (Flightplan ADR-005)
  project: HOLODEX
  branch_key: 'HOLODEX-\d+'     # SessionStart matches this against the branch to find the key
  # In Progress: SessionStart fires it over Jira REST (ADR-058's uncounted path) using JIRA_* from
  # the environment — no script to configure. It never moves an issue backwards, so a session on a
  # branch keyed to a Done issue leaves it Done. In Review / Done / Released are fired by CI
  # (.github/workflows/jira-sync.yml + release.yml), not by Flightplan.

  labels:
    # Designed and waiting on the owner (Flightplan ADR-007 §5). /handoff adds it when every
    # design-phase gate is settled and the design sign-off is outstanding; /implement removes it.
    #   project = HOLODEX AND labels = fp:ready-to-build AND status != Done
    ready_to_build: fp:ready-to-build

worklog:
  dir: docs/plans               # where <KEY>.md worklogs live (this repo's existing convention)
  session_cap: 8                # keep the last N session-log entries inline; older → docs/plans/archive/
  archive_dir: docs/plans/archive

# The routing table — mirrors CLAUDE.md's change-routing rules. Each gate is a column in a worklog's
# "Gates — definition of done" checklist. `skill` (optional) is the producing skill PostToolUse watches
# to flip the gate to [/]; `artifact` (optional) is the glob whose presence a gate can be cross-checked against.
gates:
  - { id: spec,         skill: write-spec,        artifact: 'docs/specs/**' }
  - { id: architecture, skill: architecture,      artifact: 'docs/architecture/ADR-*' }
  - { id: design,       skill: design-handoff,    artifact: 'docs/design/**', approve: true }
  - { id: backend,                                artifact: '{cmd,internal,providers}/**' }
  - { id: frontend,                               artifact: 'web/src/**' }
  - { id: testing,      skill: testing-strategy }
  - { id: security,     skill: security-review }

# Postures — which gates an epic is actually held to, picked per worklog as `profile:` (Flightplan
# ADR-004). Derived from CLAUDE.md's change-routing table; rows always print in roster order. No
# `default:`, so a new worklog gets the full roster and the banner asks for a posture.
postures:
  full:    [spec, architecture, design, backend, frontend, testing, security]  # data model / auth + UI
  feature: [spec, design, backend, frontend, testing]            # new user-facing behavior
  backend: [spec, backend, testing]                              # behavior with no UI surface
  ui:      [design, frontend, testing]                           # UX change, behavior unchanged
  infra:   [architecture, backend, testing, security]            # stack, data model, deploy, auth
  chore:   []                                                    # closeouts, tooling, bookkeeping

# The design → build boundary (Flightplan ADR-007). An epic is in its design phase until spec,
# architecture and design are settled AND the owner has signed off on the design handoff — recorded
# under `approved:` in the worklog, pinned to a commit. Until then a keyed branch can be pushed but
# cannot open a PR, and cannot edit a backend/frontend artifact; "implement HOLODEX-nnn" is the
# crossing, and it puts the mockup in front of the owner and asks. A later change to the mockup is
# re-confirmed with the diff, never a return to design. Say "approved" in a session and /handoff
# records it; nothing infers a yes from silence or from the gate being [x].
phases:
  design: [spec, architecture, design]
  build:  [backend, frontend, testing, security]

# capture.inbox intentionally unset → <git common dir>/flightplan/INBOX.md (Flightplan ADR-006):
# shared by every worktree, never in a diff. /triage drains it.
