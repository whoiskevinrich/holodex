# Holodex — production / self-host compose (ADR-023).
# Runs the prebuilt image from GHCR; no source tree or build toolchain required.
#
#   1. (optional) point Holodex at your library:
#        PowerShell:  $env:MEDIA_PATH = "D:\Videos"
#        bash:        export MEDIA_PATH=/srv/media
#      (or set MEDIA_PATH in a .env next to this file). Defaults to ./media if unset.
#   2. docker compose -f docker-compose.prod.yml up -d
#   3. open http://localhost:7800
#
# To pin a release instead of latest:  HOLODEX_TAG=1.2.0 docker compose ... up -d
services:
  holodex:
    image: ghcr.io/whoiskevinrich/holodex:${HOLODEX_TAG:-latest}
    container_name: holodex
    pull_policy: always
    ports:
      - "7800:7800"   # web UI + REST API
      - "7801:7801"   # MCP (Phase 2; optional)
    environment:
      MEDIA_PATH: /media
      DATA_PATH: /data
      PORT: "7800"
      LOG_LEVEL: info
    volumes:
      # host library path from .env / shell ${MEDIA_PATH}, mounted read-only at the
      # container's MEDIA_PATH (=/media above). Defaults to ./media if unset.
      - ${MEDIA_PATH:-./media}:/media:ro            # your library (read-only)
      - holodex-data:/data                          # index, thumbnails, config
    restart: unless-stopped

volumes:
  holodex-data:
